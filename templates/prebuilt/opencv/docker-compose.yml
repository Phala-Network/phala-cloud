services:
  app:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    environment:
      OPENCV_PYTHON_HEADLESS_VERSION: ${OPENCV_PYTHON_HEADLESS_VERSION:-4.13.0.92}
      OPENCV_LOG_LEVEL: ERROR
      OPENCV_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      UV_SYSTEM_PYTHON: "1"
    configs:
      - source: opencv_demo_app
        target: /opt/opencv-demo/main.py
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        uv pip install --system --no-cache "opencv-python-headless==$${OPENCV_PYTHON_HEADLESS_VERSION}"
        exec python /opt/opencv-demo/main.py
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5); sys.exit(0 if response.status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - internal

  proxy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "8080:80"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          encode zstd gzip
          header {
              X-Content-Type-Options "nosniff"
              Referrer-Policy "no-referrer"
              -Server
          }
          reverse_proxy app:8000
      }

  opencv_demo_app:
    content: |
      import hashlib
      import importlib
      import importlib.metadata
      import json
      import os
      import platform
      import sys
      import time
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import urlparse


      STARTED_AT = time.time()
      PACKAGE_NAME = "opencv-python-headless"
      IMPORT_STATUS = {
          "package": PACKAGE_NAME,
          "distribution_version": None,
          "cv2_version": None,
          "import_ok": False,
          "build": {},
          "error": None,
      }
      cv2 = None
      np = None


      def build_value(build_info, label):
          prefix = f"{label}:"
          for line in build_info.splitlines():
              stripped = line.strip()
              if stripped.startswith(prefix):
                  return stripped.split(":", 1)[1].strip()
          return None


      def import_checks():
          global cv2, np
          try:
              cv2 = importlib.import_module("cv2")
              np = importlib.import_module("numpy")
              if hasattr(cv2, "setNumThreads"):
                  cv2.setNumThreads(int(os.environ.get("OPENCV_NUM_THREADS", "1")))
              build_info = cv2.getBuildInformation()
              IMPORT_STATUS.update(
                  {
                      "distribution_version": importlib.metadata.version(PACKAGE_NAME),
                      "cv2_version": getattr(cv2, "__version__", None),
                      "numpy_version": getattr(np, "__version__", None),
                      "import_ok": True,
                      "build": {
                          "gui": build_value(build_info, "GUI"),
                          "parallel_framework": build_value(build_info, "Parallel framework"),
                          "python_bindings": build_value(build_info, "Python 3"),
                      },
                  }
              )
          except Exception as exc:
              IMPORT_STATUS["error"] = f"{type(exc).__name__}: {exc}"


      def sha256_bytes(value):
          return hashlib.sha256(value).hexdigest()


      def sha256_array(value):
          return sha256_bytes(value.tobytes())


      def run_demo():
          if not IMPORT_STATUS["import_ok"]:
              raise RuntimeError(IMPORT_STATUS["error"] or "OpenCV import failed")

          height, width = 96, 128
          image = np.zeros((height, width, 3), dtype=np.uint8)
          cv2.rectangle(image, (12, 12), (116, 84), (30, 180, 240), -1)
          cv2.circle(image, (64, 48), 22, (240, 80, 40), -1)
          cv2.line(image, (0, 0), (127, 95), (255, 255, 255), 2)
          cv2.putText(image, "CV", (42, 57), cv2.FONT_HERSHEY_SIMPLEX, 0.8, (255, 255, 255), 2, cv2.LINE_AA)

          gray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)
          blurred = cv2.GaussianBlur(gray, (5, 5), 0)
          edges = cv2.Canny(blurred, 50, 150)
          _, threshold = cv2.threshold(gray, 100, 255, cv2.THRESH_BINARY)
          contours, _ = cv2.findContours(threshold, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)
          corners = cv2.goodFeaturesToTrack(gray, maxCorners=8, qualityLevel=0.01, minDistance=5)
          ok, encoded_png = cv2.imencode(".png", image)
          if not ok:
              raise RuntimeError("OpenCV failed to encode synthetic demo image")

          corner_points = []
          if corners is not None:
              for corner in corners.reshape(-1, 2):
                  corner_points.append([round(float(corner[0]), 2), round(float(corner[1]), 2)])

          return {
              "input": {
                  "kind": "synthetic_bgr_image",
                  "shape": list(image.shape),
                  "dtype": str(image.dtype),
              },
              "algorithms": [
                  "cv2.rectangle",
                  "cv2.circle",
                  "cv2.line",
                  "cv2.putText",
                  "cv2.cvtColor",
                  "cv2.GaussianBlur",
                  "cv2.Canny",
                  "cv2.threshold",
                  "cv2.findContours",
                  "cv2.goodFeaturesToTrack",
                  "cv2.imencode",
              ],
              "measurements": {
                  "gray_mean": round(float(gray.mean()), 4),
                  "edge_pixels": int(np.count_nonzero(edges)),
                  "contour_count": len(contours),
                  "contour_areas": sorted(round(float(cv2.contourArea(contour)), 2) for contour in contours),
                  "corner_count": len(corner_points),
                  "corners": corner_points,
              },
              "checksums": {
                  "source_png_sha256": sha256_bytes(encoded_png.tobytes()),
                  "gray_sha256": sha256_array(gray),
                  "edges_sha256": sha256_array(edges),
              },
          }


      def base_payload():
          return {
              "service": "opencv-demo",
              "upstream": "https://github.com/opencv/opencv",
              "package": IMPORT_STATUS,
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "credentials_required": False,
              "remote_calls": False,
              "model_downloaded": False,
              "gpu_required": False,
          }


      def response_body(path):
          if path in ("/", "/healthz"):
              payload = base_payload()
              payload["status"] = "ok" if IMPORT_STATUS["import_ok"] else "unhealthy"
              payload["endpoints"] = ["/healthz", "/demo", "/v1/models"]
              return HTTPStatus.OK if IMPORT_STATUS["import_ok"] else HTTPStatus.SERVICE_UNAVAILABLE, payload

          if path == "/demo":
              payload = base_payload()
              payload["description"] = "Deterministic local OpenCV image-processing smoke test."
              if not IMPORT_STATUS["import_ok"]:
                  payload["status"] = "unhealthy"
                  return HTTPStatus.SERVICE_UNAVAILABLE, payload
              try:
                  payload["demo"] = run_demo()
                  payload["status"] = "ok"
              except Exception as exc:
                  payload["status"] = "failed"
                  payload["error"] = f"{type(exc).__name__}: {exc}"
                  return HTTPStatus.INTERNAL_SERVER_ERROR, payload
              return HTTPStatus.OK, payload

          if path == "/v1/models":
              return HTTPStatus.OK, {
                  "object": "list",
                  "data": [
                      {
                          "id": "opencv/local-cpu-image-processing",
                          "object": "model",
                          "created": 0,
                          "owned_by": "opencv",
                          "description": "No ML model is hosted. This endpoint identifies the deterministic local OpenCV CPU verifier.",
                      }
                  ],
                  "opencv": {
                      "cv2_version": IMPORT_STATUS.get("cv2_version"),
                      "package": PACKAGE_NAME,
                      "package_version": IMPORT_STATUS.get("distribution_version"),
                  },
              }

          return HTTPStatus.NOT_FOUND, {
              "error": "not_found",
              "endpoints": ["/healthz", "/demo", "/v1/models"],
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "opencv-demo"

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      }
                  ),
                  flush=True,
              )

          def do_GET(self):
              path = urlparse(self.path).path.rstrip("/") or "/"
              status, payload = response_body(path)
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)


      if __name__ == "__main__":
          import_checks()
          print(
              json.dumps(
                  {
                      "event": "startup",
                      "port": 8000,
                      "opencv": IMPORT_STATUS,
                      "remote_calls": False,
                      "gpu_required": False,
                  }
              ),
              flush=True,
          )
          ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()

networks:
  internal:
    driver: bridge
