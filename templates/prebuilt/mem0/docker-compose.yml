services:
  app:
    image: python:3.11-slim-bookworm
    ports:
      - "8080:8080"
    environment:
      - MEM0AI_VERSION=${MEM0AI_VERSION:-2.0.2}
      - MEM0_TELEMETRY=false
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_NO_CACHE_DIR=1
      - PIP_ROOT_USER_ACTION=ignore
      - PORT=8080
      - PYTHONUNBUFFERED=1
    command:
      - /bin/sh
      - -lc
      - |
        python -m pip install --no-cache-dir "mem0ai==$${MEM0AI_VERSION}"
        exec python /server.py
    configs:
      - source: server_py
        target: /server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen("http://127.0.0.1:%s/healthz" % os.environ.get("PORT", "8080"), timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

configs:
  server_py:
    content: |
      import importlib.metadata
      import json
      import os
      import platform
      import re
      import sys
      import time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import parse_qs, urlparse

      STARTED_AT = time.time()
      IMPORT_ERROR = None
      PACKAGE = {}

      try:
          import mem0
          from mem0 import Memory

          PACKAGE = {
              "distribution": "mem0ai",
              "version": importlib.metadata.version("mem0ai"),
              "module": mem0.__name__,
              "memory_class": Memory.__name__,
          }
      except Exception as exc:
          IMPORT_ERROR = f"{type(exc).__name__}: {exc}"

      DEMO_MEMORIES = [
          {
              "id": "demo-001",
              "user_id": "demo-user",
              "memory": "Alice prefers black coffee and uses mem0 for long-term agent memory.",
              "metadata": {"source": "deterministic-demo", "topic": "preference"},
          },
          {
              "id": "demo-002",
              "user_id": "demo-user",
              "memory": "The production mem0 server should be configured with real LLM and embedding providers.",
              "metadata": {"source": "deterministic-demo", "topic": "production"},
          },
          {
              "id": "demo-003",
              "user_id": "demo-user",
              "memory": "This Phala template keeps default smoke tests CPU-only and credential-free.",
              "metadata": {"source": "deterministic-demo", "topic": "deployment"},
          },
      ]


      def tokenize(value):
          return set(re.findall(r"[a-z0-9]+", value.lower()))


      def search_demo(query):
          query_terms = tokenize(query)
          scored = []
          for item in DEMO_MEMORIES:
              memory_terms = tokenize(item["memory"])
              score = len(query_terms & memory_terms)
              if query_terms and score == 0:
                  continue
              scored.append({**item, "score": score})
          scored.sort(key=lambda item: (-item["score"], item["id"]))
          return scored


      def base_payload():
          return {
              "service": "mem0-demo",
              "upstream": "https://github.com/mem0ai/mem0",
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "package": PACKAGE,
              "cpu_safe": True,
              "external_credentials_required": False,
              "real_mem0_operations_enabled": False,
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "mem0-demo/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              parsed = urlparse(self.path)
              if parsed.path in ("/", "/healthz"):
                  payload = base_payload()
                  payload.update({
                      "ok": IMPORT_ERROR is None,
                      "status": "ready" if IMPORT_ERROR is None else "import_failed",
                      "endpoints": ["/healthz", "/demo", "/v1/models"],
                  })
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              if parsed.path == "/demo":
                  params = parse_qs(parsed.query)
                  query = params.get("q", ["coffee memory"])[0]
                  payload = base_payload()
                  payload.update({
                      "ok": IMPORT_ERROR is None,
                      "mode": "deterministic-local-demo",
                      "query": query,
                      "results": search_demo(query),
                      "note": (
                          "The official mem0ai package imported successfully. "
                          "This endpoint uses deterministic local data so smoke "
                          "tests do not need LLM, embedding, vector database, or "
                          "hosted service credentials."
                      ),
                  })
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              if parsed.path == "/v1/models":
                  payload = {
                      "object": "list",
                      "data": [
                          {
                              "id": "mem0-local-demo",
                              "object": "model",
                              "created": 0,
                              "owned_by": "phala-template",
                              "permission": [],
                              "root": "mem0-local-demo",
                              "parent": None,
                          }
                      ],
                  }
                  self.respond_json(200, payload)
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      port = int(os.environ.get("PORT", "8080"))
      server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
      print(f"mem0 demo server listening on 0.0.0.0:{port}", flush=True)
      server.serve_forever()
