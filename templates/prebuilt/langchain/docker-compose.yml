services:
  app:
    image: python:3.12-slim-bookworm
    expose:
      - "8000"
    environment:
      LANGCHAIN_VERSION: ${LANGCHAIN_VERSION:-0.3.27}
      PORT: "8000"
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_ROOT_USER_ACTION: ignore
      PYTHONUNBUFFERED: "1"
    command:
      - /bin/sh
      - -lc
      - |
        python -m pip install --no-cache-dir "langchain==$${LANGCHAIN_VERSION}"
        exec python /server.py
    configs:
      - source: server_py
        target: /server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    networks:
      - internal

  proxy:
    image: caddy:2.8
    ports:
      - "18080:80"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          reverse_proxy app:8000
      }

  server_py:
    content: |
      import importlib.metadata
      import json
      import os
      import platform
      import sys
      import time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import parse_qs, urlparse

      STARTED_AT = time.time()
      IMPORT_ERROR = None
      PACKAGE = {}

      try:
          import langchain
          from langchain_core.output_parsers import StrOutputParser
          from langchain_core.prompts import PromptTemplate
          from langchain_core.runnables import RunnableLambda

          PACKAGE = {
              "distribution": "langchain",
              "version": importlib.metadata.version("langchain"),
              "module": langchain.__name__,
              "components": [
                  PromptTemplate.__name__,
                  RunnableLambda.__name__,
                  StrOutputParser.__name__,
              ],
          }
      except Exception as exc:
          IMPORT_ERROR = f"{type(exc).__name__}: {exc}"


      def base_payload():
          return {
              "service": "langchain-demo",
              "upstream": "https://github.com/langchain-ai/langchain",
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "package": PACKAGE,
          }


      def run_demo(topic):
          prompt = PromptTemplate.from_template(
              "Create a deterministic LangChain demo response about: {topic}"
          )

          def local_step(prompt_value):
              prompt_text = prompt_value.to_string()
              return (
                  f"{prompt_text}\n"
                  "Result: PromptTemplate produced this prompt, RunnableLambda "
                  "handled it locally, and StrOutputParser returned plain text. "
                  "No model provider, API key, GPU, or model download was used."
              )

          chain = prompt | RunnableLambda(local_step) | StrOutputParser()
          return chain.invoke({"topic": topic})


      class Handler(BaseHTTPRequestHandler):
          server_version = "langchain-demo/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              request = urlparse(self.path)
              path = request.path.rstrip("/") or "/"

              if path == "/":
                  payload = base_payload()
                  payload.update(
                      {
                          "ok": IMPORT_ERROR is None,
                          "endpoints": ["/healthz", "/demo", "/v1/models"],
                      }
                  )
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              if path == "/healthz":
                  payload = base_payload()
                  payload.update(
                      {
                          "ok": IMPORT_ERROR is None,
                          "status": "ready" if IMPORT_ERROR is None else "import_failed",
                      }
                  )
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              if path == "/demo":
                  payload = base_payload()
                  if IMPORT_ERROR:
                      payload.update({"ok": False, "error": IMPORT_ERROR})
                      self.respond_json(500, payload)
                      return

                  query = parse_qs(request.query)
                  topic = query.get("topic", ["confidential AI orchestration"])[0][:200]
                  payload.update(
                      {
                          "ok": True,
                          "cpu_only": True,
                          "external_provider_calls": False,
                          "model_downloaded": False,
                          "chain": [
                              "PromptTemplate",
                              "RunnableLambda",
                              "StrOutputParser",
                          ],
                          "input": {"topic": topic},
                          "output": run_demo(topic),
                      }
                  )
                  self.respond_json(200, payload)
                  return

              if path == "/v1/models":
                  payload = base_payload()
                  payload.update(
                      {
                          "ok": IMPORT_ERROR is None,
                          "object": "list",
                          "data": [
                              {
                                  "id": "langchain-local-deterministic-chain",
                                  "object": "model",
                                  "created": 0,
                                  "owned_by": "langchain-ai",
                                  "description": (
                                      "Local deterministic LangChain chain using "
                                      "PromptTemplate, RunnableLambda, and "
                                      "StrOutputParser. It is not an inference model."
                                  ),
                              }
                          ],
                      }
                  )
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      port = int(os.environ.get("PORT", "8000"))
      server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
      print(f"langchain demo server listening on 0.0.0.0:{port}", flush=True)
      server.serve_forever()

networks:
  internal:
    driver: bridge
