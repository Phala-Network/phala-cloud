services:
  app:
    image: python:3.12-slim
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      FINANCIAL_SERVICES_REF: ${FINANCIAL_SERVICES_REF:-120a31dcede4affa1d771cbf286a63ee331f92a4}
      PYTHONUNBUFFERED: "1"
    configs:
      - source: financial_services_demo_server
        target: /opt/financial-services-demo/server.py
    command:
      - python
      - /opt/financial-services-demo/server.py
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('PORT', '8080'), timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

configs:
  financial_services_demo_server:
    content: |
      import hashlib
      import io
      import json
      import os
      import platform
      import re
      import shutil
      import tarfile
      import tempfile
      import time
      import urllib.parse
      import urllib.request
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from pathlib import Path
      from urllib.parse import parse_qs, urlparse


      STARTED_AT = time.time()
      DEFAULT_REF = "120a31dcede4affa1d771cbf286a63ee331f92a4"
      SOURCE_REF = os.environ.get("FINANCIAL_SERVICES_REF", DEFAULT_REF).strip() or DEFAULT_REF
      UPSTREAM_REPO = "https://github.com/anthropics/financial-services"
      PHALA_TEMPLATE = "https://github.com/Phala-Network/phala-cloud/tree/main/templates/prebuilt/financial-services"
      LOCAL_MODEL_ID = "financial-services/source-verifier"
      EXPECTED_MARKETPLACE = {
          "financial-analysis",
          "investment-banking",
          "equity-research",
          "private-equity",
          "wealth-management",
          "fund-admin",
          "operations",
          "pitch-agent",
          "market-researcher",
          "earnings-reviewer",
          "meeting-prep-agent",
          "model-builder",
          "gl-reconciler",
          "kyc-screener",
          "valuation-reviewer",
          "month-end-closer",
          "statement-auditor",
          "lseg",
          "sp-global",
          "claude-for-msft-365-install",
      }
      EXPECTED_MANAGED_AGENTS = {
          "earnings-reviewer",
          "gl-reconciler",
          "kyc-screener",
          "market-researcher",
          "meeting-prep-agent",
          "model-builder",
          "month-end-closer",
          "pitch-agent",
          "statement-auditor",
          "valuation-reviewer",
      }


      def safe_text(value, limit=4000):
          return str(value or "").replace("\x00", "").strip()[:limit]


      def rel(path, root):
          try:
              return str(path.relative_to(root))
          except ValueError:
              return str(path)


      def safe_extract_tar(data, destination):
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              top_dir = None
              for member in archive.getmembers():
                  parts = Path(member.name).parts
                  if not parts:
                      continue
                  top_dir = top_dir or parts[0]
                  if len(parts) == 1:
                      continue
                  relative = Path(*parts[1:])
                  if relative.is_absolute() or ".." in relative.parts:
                      raise RuntimeError("unsafe tar path: " + member.name)
                  target = destination / relative
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  elif member.isfile():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      src = archive.extractfile(member)
                      if src is None:
                          raise RuntimeError("cannot read tar member: " + member.name)
                      with src, open(target, "wb") as dst:
                          shutil.copyfileobj(src, dst)
                      if member.mode:
                          target.chmod(member.mode & 0o777)
              return top_dir


      def download_source():
          encoded_ref = urllib.parse.quote(SOURCE_REF, safe="")
          url = "https://api.github.com/repos/anthropics/financial-services/tarball/" + encoded_ref
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "phala-cloud-financial-services-template",
              },
          )
          started = time.time()
          with urllib.request.urlopen(request, timeout=120) as response:
              data = response.read()
          source_dir = Path(tempfile.mkdtemp(prefix="financial-services-source-"))
          top_dir = safe_extract_tar(data, source_dir)
          return {
              "ok": True,
              "source_dir": source_dir,
              "source_ref": SOURCE_REF,
              "source_url": url,
              "source_tree": top_dir,
              "archive_sha256": hashlib.sha256(data).hexdigest(),
              "downloaded_bytes": len(data),
              "download_seconds": round(time.time() - started, 3),
          }


      def read_json(path, root):
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              return {"ok": True, "path": rel(path, root), "data": data}
          except Exception as exc:
              return {
                  "ok": False,
                  "path": rel(path, root),
                  "error": type(exc).__name__ + ": " + str(exc),
              }


      def author_name(value):
          if isinstance(value, dict):
              return value.get("name")
          if isinstance(value, str):
              return value
          return None


      def plugin_kind(path, root):
          parts = path.relative_to(root).parts
          if len(parts) >= 3 and parts[0] == "plugins":
              return parts[1]
          if parts[0] == "claude-for-msft-365-install":
              return "install-tooling"
          return "other"


      def summarize_plugins(root):
          manifests = []
          errors = []
          for path in sorted(root.glob("plugins/**/.claude-plugin/plugin.json")):
              item = read_json(path, root)
              if not item["ok"]:
                  errors.append({"path": item["path"], "error": item["error"]})
                  continue
              data = item["data"]
              manifests.append(
                  {
                      "name": data.get("name"),
                      "version": data.get("version"),
                      "description": data.get("description"),
                      "author": author_name(data.get("author")),
                      "kind": plugin_kind(path, root),
                      "path": item["path"],
                  }
              )
          install_tool = root / "claude-for-msft-365-install" / ".claude-plugin" / "plugin.json"
          if install_tool.is_file():
              item = read_json(install_tool, root)
              if item["ok"]:
                  data = item["data"]
                  manifests.append(
                      {
                          "name": data.get("name"),
                          "version": data.get("version"),
                          "description": data.get("description"),
                          "author": author_name(data.get("author")),
                          "kind": "install-tooling",
                          "path": item["path"],
                      }
                  )
              else:
                  errors.append({"path": item["path"], "error": item["error"]})
          return manifests, errors


      def summarize_marketplace(root):
          item = read_json(root / ".claude-plugin" / "marketplace.json", root)
          if not item["ok"]:
              return {
                  "ok": False,
                  "path": item["path"],
                  "error": item["error"],
                  "plugin_count": 0,
                  "plugins": [],
                  "missing_expected_plugins": sorted(EXPECTED_MARKETPLACE),
              }
          plugins = item["data"].get("plugins", [])
          names = [entry.get("name") for entry in plugins if isinstance(entry, dict)]
          return {
              "ok": True,
              "path": item["path"],
              "plugin_count": len(names),
              "plugins": names,
              "missing_expected_plugins": sorted(EXPECTED_MARKETPLACE.difference(names)),
          }


      def list_skill_ids(root):
          ids = set()
          for skill in root.glob("plugins/**/skills/*/SKILL.md"):
              ids.add(skill.parent.name)
          return sorted(ids)


      def list_command_ids(root):
          return sorted({path.stem for path in root.glob("plugins/**/commands/*.md")})


      def managed_agent_summary(agent_dir, root):
          agent_yaml = agent_dir / "agent.yaml"
          text = agent_yaml.read_text(encoding="utf-8") if agent_yaml.is_file() else ""
          model_match = re.search(r"(?m)^model:\s*(.+)$", text)
          env_refs = sorted(set(re.findall(r"\$\{([A-Z0-9_]+)\}", text)))
          subagents = sorted(path.stem for path in agent_dir.glob("subagents/*.yaml"))
          return {
              "name": agent_dir.name,
              "path": rel(agent_dir, root),
              "agent_yaml": agent_yaml.is_file(),
              "readme": (agent_dir / "README.md").is_file(),
              "steering_examples": (agent_dir / "steering-examples.json").is_file(),
              "subagent_count": len(subagents),
              "sample_subagents": subagents[:6],
              "declared_model": safe_text(model_match.group(1) if model_match else None, 120),
              "env_placeholders": env_refs,
          }


      def summarize_managed_agents(root):
          agents = [
              managed_agent_summary(path, root)
              for path in sorted((root / "managed-agent-cookbooks").glob("*"))
              if path.is_dir()
          ]
          names = {agent["name"] for agent in agents}
          complete = [
              agent["name"]
              for agent in agents
              if agent["agent_yaml"] and agent["readme"] and agent["steering_examples"]
          ]
          return {
              "count": len(agents),
              "complete_count": len(complete),
              "missing_expected_agents": sorted(EXPECTED_MANAGED_AGENTS.difference(names)),
              "agents": agents,
          }


      def summarize_mcp(root):
          manifests = []
          for path in sorted(root.glob("plugins/**/.mcp.json")):
              item = read_json(path, root)
              if item["ok"]:
                  servers = item["data"].get("mcpServers", {})
                  manifests.append(
                      {
                          "ok": True,
                          "path": item["path"],
                          "server_count": len(servers) if isinstance(servers, dict) else 0,
                          "servers": sorted(servers.keys()) if isinstance(servers, dict) else [],
                      }
                  )
              else:
                  manifests.append(
                      {
                          "ok": False,
                          "path": item["path"],
                          "server_count": 0,
                          "servers": [],
                          "error": item["error"],
                      }
                  )
          return {
              "manifest_count": len(manifests),
              "parse_error_count": sum(1 for item in manifests if not item["ok"]),
              "manifests": manifests,
          }


      def load_status():
          try:
              source = download_source()
              root = source["source_dir"]
              marketplace = summarize_marketplace(root)
              plugins, plugin_errors = summarize_plugins(root)
              skills = list_skill_ids(root)
              commands = list_command_ids(root)
              managed_agents = summarize_managed_agents(root)
              mcp = summarize_mcp(root)
              readme_present = (root / "README.md").is_file()
              license_present = (root / "LICENSE").is_file()
              ok = (
                  marketplace["ok"]
                  and not marketplace["missing_expected_plugins"]
                  and not plugin_errors
                  and len(plugins) >= len(EXPECTED_MARKETPLACE)
                  and managed_agents["complete_count"] >= len(EXPECTED_MANAGED_AGENTS)
                  and not managed_agents["missing_expected_agents"]
                  and len(skills) > 0
                  and len(commands) > 0
                  and readme_present
                  and license_present
              )
              return {
                  "ok": ok,
                  "status": "ready" if ok else "unhealthy",
                  "source": {
                      key: value
                      for key, value in source.items()
                      if key != "source_dir"
                  },
                  "repository": {
                      "readme": readme_present,
                      "license": license_present,
                      "file_based_no_build_step": True,
                  },
                  "marketplace": marketplace,
                  "plugins": {
                      "count": len(plugins),
                      "parse_errors": plugin_errors,
                      "sample": plugins[:24],
                  },
                  "inventory": {
                      "skill_count": len(skills),
                      "sample_skills": skills[:20],
                      "command_count": len(commands),
                      "sample_commands": commands[:20],
                  },
                  "managed_agents": managed_agents,
                  "mcp_connectors": mcp,
              }
          except Exception as exc:
              return {
                  "ok": False,
                  "status": "unhealthy",
                  "error": type(exc).__name__ + ": " + str(exc),
                  "source": {
                      "source_ref": SOURCE_REF,
                      "source_url": "https://api.github.com/repos/anthropics/financial-services/tarball/"
                      + urllib.parse.quote(SOURCE_REF, safe=""),
                  },
              }


      STATUS = load_status()


      def safety():
          return {
              "cpu_only": True,
              "credentials_required_for_default_demo": False,
              "anthropic_api_calls": False,
              "mcp_provider_calls": False,
              "browser_auth": False,
              "model_downloads": False,
              "gpu_required": False,
              "financial_advice_generated": False,
              "source_artifact": "GitHub tarball pinned by FINANCIAL_SERVICES_REF",
          }


      def base_payload():
          return {
              "service": "financial-services-source-verifier",
              "ok": STATUS["ok"],
              "status": STATUS["status"],
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "python": platform.python_version(),
              "platform": platform.platform(),
              "upstream": {
                  "repo": UPSTREAM_REPO,
                  "source_ref": SOURCE_REF,
                  "phala_template": PHALA_TEMPLATE,
                  "icon_source": "https://github.com/anthropics.png",
              },
              "safety": safety(),
          }


      def choose_workflow(topic):
          text = topic.lower()
          if "kyc" in text or "onboarding" in text:
              return "kyc-screener"
          if "ledger" in text or "recon" in text or "gl" in text:
              return "gl-reconciler"
          if "earnings" in text:
              return "earnings-reviewer"
          if "meeting" in text or "client" in text:
              return "meeting-prep-agent"
          if "valuation" in text or "fund" in text:
              return "valuation-reviewer"
          if "model" in text or "dcf" in text or "lbo" in text:
              return "model-builder"
          if "market" in text or "research" in text or "sector" in text:
              return "market-researcher"
          return "pitch-agent"


      def demo_payload(query):
          topic = safe_text(query.get("topic", ["Build a pitch book for a software acquisition"])[0], 200)
          workflow = choose_workflow(topic)
          command_samples = STATUS.get("inventory", {}).get("sample_commands", [])
          skill_samples = STATUS.get("inventory", {}).get("sample_skills", [])
          agent = None
          for item in STATUS.get("managed_agents", {}).get("agents", []):
              if item["name"] == workflow:
                  agent = item
                  break
          return {
              **base_payload(),
              "mode": "local-deterministic-source-inventory",
              "demo_request": topic,
              "selected_workflow": workflow,
              "deterministic_trace_id": hashlib.sha256((SOURCE_REF + ":" + topic).encode()).hexdigest()[:16],
              "agent_manifest": agent,
              "local_steps": [
                  "Download and inspect the pinned upstream source artifact",
                  "Read Claude plugin marketplace and plugin manifests",
                  "Read managed-agent cookbooks and subagent declarations",
                  "Return deterministic inventory evidence without calling Anthropic or MCP providers",
              ],
              "available_examples": {
                  "commands": command_samples[:10],
                  "skills": skill_samples[:10],
                  "managed_agent_count": STATUS.get("managed_agents", {}).get("count", 0),
                  "plugin_count": STATUS.get("plugins", {}).get("count", 0),
              },
              "evidence": {
                  "real_upstream_source_downloaded": "archive_sha256" in STATUS.get("source", {}),
                  "marketplace_checked": STATUS.get("marketplace", {}).get("ok", False),
                  "plugin_manifests_checked": STATUS.get("plugins", {}).get("count", 0),
                  "managed_cookbooks_checked": STATUS.get("managed_agents", {}).get("complete_count", 0),
                  "mcp_manifest_parse_errors_reported": STATUS.get("mcp_connectors", {}).get("parse_error_count", 0),
                  "hosted_model_call_attempted": False,
              },
          }


      def models_payload():
          return {
              "object": "list",
              "data": [
                  {
                      "id": LOCAL_MODEL_ID,
                      "object": "model",
                      "created": 0,
                      "owned_by": "anthropics",
                      "description": (
                          "Metadata-only verifier for anthropics/financial-services source artifacts. "
                          "No LLM is hosted and no Anthropic API request is made."
                      ),
                  }
              ],
              "hosted_model_call_attempted": False,
          }


      def response_for(path, query):
          if path in ("", "/", "/healthz"):
              payload = {
                  **base_payload(),
                  "source": STATUS.get("source"),
                  "checks": {
                      "marketplace_ok": STATUS.get("marketplace", {}).get("ok", False),
                      "missing_expected_plugins": STATUS.get("marketplace", {}).get("missing_expected_plugins", []),
                      "plugin_manifest_count": STATUS.get("plugins", {}).get("count", 0),
                      "plugin_manifest_parse_errors": STATUS.get("plugins", {}).get("parse_errors", []),
                      "managed_agent_complete_count": STATUS.get("managed_agents", {}).get("complete_count", 0),
                      "missing_expected_managed_agents": STATUS.get("managed_agents", {}).get("missing_expected_agents", []),
                      "skill_count": STATUS.get("inventory", {}).get("skill_count", 0),
                      "command_count": STATUS.get("inventory", {}).get("command_count", 0),
                  },
              }
              return (HTTPStatus.OK if STATUS["ok"] else HTTPStatus.SERVICE_UNAVAILABLE), payload
          if path == "/demo":
              return HTTPStatus.OK, demo_payload(query)
          if path == "/v1/models":
              return HTTPStatus.OK, models_payload()
          if path == "/upstream":
              return HTTPStatus.OK, {
                  **base_payload(),
                  "source": STATUS.get("source"),
                  "repository": STATUS.get("repository"),
                  "marketplace": STATUS.get("marketplace"),
                  "plugins": STATUS.get("plugins"),
                  "inventory": STATUS.get("inventory"),
                  "managed_agents": STATUS.get("managed_agents"),
                  "mcp_connectors": STATUS.get("mcp_connectors"),
              }
          return HTTPStatus.NOT_FOUND, {
              "error": "not_found",
              "endpoints": ["/healthz", "/demo", "/v1/models", "/upstream"],
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "financial-services-source-verifier"

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      },
                      sort_keys=True,
                  ),
                  flush=True,
              )

          def do_GET(self):
              parsed = urlparse(self.path)
              path = parsed.path.rstrip("/") or "/"
              status, payload = response_for(path, parse_qs(parsed.query))
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)


      if __name__ == "__main__":
          port = int(os.environ.get("PORT", "8080"))
          print(
              json.dumps(
                  {
                      "event": "startup",
                      "port": port,
                      "status": STATUS["status"],
                      "source_ref": SOURCE_REF,
                      "safety": safety(),
                  },
                  sort_keys=True,
              ),
              flush=True,
          )
          ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()
