services:
  app:
    image: python:3.11-slim-bookworm
    ports:
      - "8080:8080"
    environment:
      - GPT4ALL_PYTHON_VERSION=${GPT4ALL_PYTHON_VERSION:-2.8.2}
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_NO_CACHE_DIR=1
      - PIP_ROOT_USER_ACTION=ignore
      - PYTHONUNBUFFERED=1
    command:
      - /bin/sh
      - -lc
      - |
        python -m pip install --no-cache-dir "gpt4all==$${GPT4ALL_PYTHON_VERSION}"
        exec python /server.py
    configs:
      - source: server_py
        target: /server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

configs:
  server_py:
    content: |
      import importlib.metadata
      import json
      import os
      import platform
      import sys
      import time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      STARTED_AT = time.time()
      IMPORT_ERROR = None
      PACKAGE = {}

      try:
          import gpt4all
          from gpt4all import GPT4All
          import gpt4all.gpt4all as binding_module

          PACKAGE = {
              "distribution": "gpt4all",
              "version": importlib.metadata.version("gpt4all"),
              "module": gpt4all.__name__,
              "binding_module": binding_module.__name__,
              "class_available": GPT4All.__name__,
          }
      except Exception as exc:
          IMPORT_ERROR = f"{type(exc).__name__}: {exc}"


      def base_payload():
          return {
              "service": "gpt4all-demo",
              "upstream": "https://github.com/nomic-ai/gpt4all",
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "package": PACKAGE,
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "gpt4all-demo/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              if self.path in ("/", "/healthz"):
                  payload = base_payload()
                  payload.update({
                      "ok": IMPORT_ERROR is None,
                      "status": "ready" if IMPORT_ERROR is None else "import_failed",
                  })
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              if self.path == "/demo":
                  payload = base_payload()
                  payload.update({
                      "ok": IMPORT_ERROR is None,
                      "check": "from gpt4all import GPT4All",
                      "cpu_only": True,
                      "model_loaded": False,
                      "model_downloaded": False,
                      "message": (
                          "GPT4All Python bindings loaded successfully. "
                          "Model inference is intentionally skipped so this demo "
                          "does not download multi-GB model weights."
                      ),
                  })
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      port = int(os.environ.get("PORT", "8080"))
      server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
      print(f"gpt4all demo server listening on 0.0.0.0:{port}", flush=True)
      server.serve_forever()
