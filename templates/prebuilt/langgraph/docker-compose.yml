services:
  app:
    image: python:3.11-slim-bookworm
    ports:
      - "8080:8080"
    environment:
      - LANGGRAPH_VERSION=${LANGGRAPH_VERSION:-1.2.1}
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_NO_CACHE_DIR=1
      - PIP_ROOT_USER_ACTION=ignore
      - PYTHONUNBUFFERED=1
      - PORT=8080
    command:
      - /bin/sh
      - -lc
      - |
        python -m pip install --no-cache-dir "langgraph==$${LANGGRAPH_VERSION}"
        exec python /server.py
    configs:
      - source: server_py
        target: /server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

configs:
  server_py:
    content: |
      import importlib.metadata
      import json
      import os
      import platform
      import sys
      import time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from typing import Annotated, TypedDict
      from urllib.parse import parse_qs, urlparse
      import operator

      STARTED_AT = time.time()
      IMPORT_ERROR = None
      PACKAGE = {}
      GRAPH = None
      GRAPH_MERMAID = ""

      try:
          import langgraph
          from langgraph.graph import END, START, StateGraph

          class DemoState(TypedDict, total=False):
              topic: str
              steps: Annotated[list[str], operator.add]
              response: str

          def normalize(state: DemoState) -> DemoState:
              topic = " ".join(state.get("topic", "").split()) or "LangGraph"
              return {
                  "topic": topic,
                  "steps": [f"normalized topic: {topic}"],
              }

          def plan(state: DemoState) -> DemoState:
              topic = state.get("topic", "LangGraph")
              return {
                  "steps": [f"planned deterministic workflow for {topic}"],
              }

          def summarize(state: DemoState) -> DemoState:
              topic = state.get("topic", "LangGraph")
              steps_seen = len(state.get("steps", []))
              return {
                  "response": (
                      "LangGraph executed a deterministic three-node state graph "
                      f"for '{topic}' without calling an external model."
                  ),
                  "steps": [f"produced response after {steps_seen + 1} nodes"],
              }

          builder = StateGraph(DemoState)
          builder.add_node("normalize", normalize)
          builder.add_node("plan", plan)
          builder.add_node("summarize", summarize)
          builder.add_edge(START, "normalize")
          builder.add_edge("normalize", "plan")
          builder.add_edge("plan", "summarize")
          builder.add_edge("summarize", END)
          GRAPH = builder.compile()
          GRAPH_MERMAID = GRAPH.get_graph().draw_mermaid()

          PACKAGE = {
              "distribution": "langgraph",
              "version": importlib.metadata.version("langgraph"),
              "module": langgraph.__name__,
              "graph_class": StateGraph.__name__,
          }
      except Exception as exc:
          IMPORT_ERROR = f"{type(exc).__name__}: {exc}"


      def run_demo(topic: str) -> dict:
          if IMPORT_ERROR or GRAPH is None:
              raise RuntimeError(IMPORT_ERROR or "graph unavailable")
          result = GRAPH.invoke({"topic": topic, "steps": []})
          return {
              "ok": True,
              "input": {"topic": topic},
              "node_order": ["normalize", "plan", "summarize"],
              "external_model_called": False,
              "credentials_required": False,
              "result": result,
          }


      def base_payload() -> dict:
          return {
              "service": "langgraph-demo",
              "upstream": "https://github.com/langchain-ai/langgraph",
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "package": PACKAGE,
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "langgraph-demo/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status: int, payload: dict):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              parsed = urlparse(self.path)

              if parsed.path in ("/", "/healthz"):
                  payload = base_payload()
                  payload.update({
                      "ok": IMPORT_ERROR is None,
                      "status": "ready" if IMPORT_ERROR is None else "import_failed",
                  })
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                      self.respond_json(500, payload)
                      return
                  try:
                      payload["graph_check"] = run_demo("health")["result"]["response"]
                      self.respond_json(200, payload)
                  except Exception as exc:
                      payload.update({
                          "ok": False,
                          "status": "graph_failed",
                          "error": f"{type(exc).__name__}: {exc}",
                      })
                      self.respond_json(500, payload)
                  return

              if parsed.path == "/demo":
                  topic = parse_qs(parsed.query).get("topic", ["phala cloud"])[0]
                  topic = topic.strip()[:160] or "phala cloud"
                  payload = base_payload()
                  try:
                      payload.update(run_demo(topic))
                      self.respond_json(200, payload)
                  except Exception as exc:
                      payload.update({
                          "ok": False,
                          "error": f"{type(exc).__name__}: {exc}",
                      })
                      self.respond_json(500, payload)
                  return

              if parsed.path == "/graph":
                  payload = base_payload()
                  payload.update({
                      "ok": IMPORT_ERROR is None,
                      "format": "mermaid",
                      "graph": GRAPH_MERMAID,
                      "nodes": ["normalize", "plan", "summarize"],
                  })
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                      self.respond_json(500, payload)
                  else:
                      self.respond_json(200, payload)
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      port = int(os.environ.get("PORT", "8080"))
      server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
      print(f"langgraph demo server listening on 0.0.0.0:{port}", flush=True)
      server.serve_forever()
