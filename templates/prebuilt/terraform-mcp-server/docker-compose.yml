services:
  app:
    image: hashicorp/terraform-mcp-server:0.5.0
    environment:
      - TFE_ADDRESS=${TFE_ADDRESS:-}
      - TFE_TOKEN=${TFE_TOKEN:-}
      - MCP_TOOLSETS=${MCP_TOOLSETS:-}
      - TRANSPORT_MODE=streamable-http
      - TRANSPORT_HOST=0.0.0.0
      - TRANSPORT_PORT=8080
      - MCP_ENDPOINT=/mcp
      - MCP_ALLOWED_ORIGINS=*
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - internal

  proxy:
    image: caddy:2.8
    ports:
      - "18080:80"
    environment:
      - BEARER_TOKEN=${BEARER_TOKEN}
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    restart: unless-stopped
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          @valid_auth {
              header X-Phala-MCP-Token "{env.BEARER_TOKEN}"
          }
          route @valid_auth {
              reverse_proxy app:8080
          }
          route {
              respond 401 {
                  body "Unauthorized"
                  close
              }
          }
      }

networks:
  internal:
    driver: bridge
