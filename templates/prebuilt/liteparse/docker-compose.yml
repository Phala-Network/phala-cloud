services:
  liteparse:
    image: ${LITEPARSE_SERVER_IMAGE:-ghcr.io/run-llama/liteparse-server:main}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NO_COLOR: "1"
    expose:
      - "5000"
    networks:
      - internal

  verifier:
    image: python:3.12-slim-bookworm
    restart: unless-stopped
    init: true
    environment:
      APP_PORT: "8000"
      LITEPARSE_SERVER_URL: http://liteparse:5000
      LITEPARSE_DEMO_TEXT: ${LITEPARSE_DEMO_TEXT:-LiteParse Phala Cloud demo}
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    configs:
      - source: liteparse_verifier_app
        target: /opt/liteparse-verifier/server.py
    command:
      - python
      - /opt/liteparse-verifier/server.py
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      liteparse:
        condition: service_started
    networks:
      - internal

  proxy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "8080:80"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      verifier:
        condition: service_healthy
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          encode zstd gzip
          header {
              X-Content-Type-Options "nosniff"
              Referrer-Policy "no-referrer"
              -Server
          }

          @liteparse_api {
              path /parse /screenshots
          }
          handle @liteparse_api {
              reverse_proxy liteparse:5000
          }
          handle {
              reverse_proxy verifier:8000
          }
      }

  liteparse_verifier_app:
    content: |
      import json
      import os
      import platform
      import sys
      import time
      import traceback
      import urllib.error
      import urllib.request
      import uuid
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import urlparse


      STARTED_AT = time.time()
      SERVICE = "liteparse-verifier"
      UPSTREAM_REPO = "https://github.com/run-llama/liteparse"
      SERVER_REPO = "https://github.com/run-llama/liteparse-server"
      SERVER_URL = os.environ.get("LITEPARSE_SERVER_URL", "http://liteparse:5000").rstrip("/")
      DEMO_TEXT = os.environ.get("LITEPARSE_DEMO_TEXT", "LiteParse Phala Cloud demo")


      def json_response(handler, status, payload):
          body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
          handler.send_response(status)
          handler.send_header("Content-Type", "application/json; charset=utf-8")
          handler.send_header("Cache-Control", "no-store")
          handler.send_header("Content-Length", str(len(body)))
          handler.end_headers()
          handler.wfile.write(body)


      def sample_pdf(text):
          escaped = (
              text.replace("\\", "\\\\")
              .replace("(", "\\(")
              .replace(")", "\\)")
              .encode("latin-1", "replace")
              .decode("latin-1")
          )
          stream = f"BT /F1 24 Tf 72 720 Td ({escaped}) Tj ET\n"
          objects = [
              "1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n",
              "2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n",
              "3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>\nendobj\n",
              "4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n",
              f"5 0 obj\n<< /Length {len(stream.encode('latin-1'))} >>\nstream\n{stream}endstream\nendobj\n",
          ]
          pdf = "%PDF-1.4\n"
          offsets = [0]
          for obj in objects:
              offsets.append(len(pdf.encode("latin-1")))
              pdf += obj
          xref_offset = len(pdf.encode("latin-1"))
          pdf += f"xref\n0 {len(objects) + 1}\n0000000000 65535 f \n"
          for offset in offsets[1:]:
              pdf += f"{offset:010d} 00000 n \n"
          pdf += f"trailer\n<< /Size {len(objects) + 1} /Root 1 0 R >>\nstartxref\n{xref_offset}\n%%EOF\n"
          return pdf.encode("latin-1")


      def multipart_body(fields, files):
          boundary = f"----phala-liteparse-{uuid.uuid4().hex}"
          chunks = []
          for name, value in fields.items():
              chunks.append(f"--{boundary}\r\n".encode("utf-8"))
              chunks.append(f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode("utf-8"))
              chunks.append(value.encode("utf-8"))
              chunks.append(b"\r\n")
          for name, filename, content_type, data in files:
              chunks.append(f"--{boundary}\r\n".encode("utf-8"))
              chunks.append(
                  (
                      f'Content-Disposition: form-data; name="{name}"; '
                      f'filename="{filename}"\r\n'
                      f"Content-Type: {content_type}\r\n\r\n"
                  ).encode("utf-8")
              )
              chunks.append(data)
              chunks.append(b"\r\n")
          chunks.append(f"--{boundary}--\r\n".encode("utf-8"))
          return boundary, b"".join(chunks)


      def upstream_request(path, method="GET", body=None, headers=None, timeout=8):
          request = urllib.request.Request(
              f"{SERVER_URL}{path}",
              data=body,
              headers=headers or {},
              method=method,
          )
          try:
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return {
                      "ok": 200 <= response.status < 300,
                      "status": response.status,
                      "headers": dict(response.headers.items()),
                      "body": response.read(),
                      "error": None,
                  }
          except urllib.error.HTTPError as exc:
              return {
                  "ok": False,
                  "status": exc.code,
                  "headers": dict(exc.headers.items()),
                  "body": exc.read(),
                  "error": None,
              }
          except Exception as exc:
              return {
                  "ok": False,
                  "status": None,
                  "headers": {},
                  "body": b"",
                  "error": f"{type(exc).__name__}: {exc}",
              }


      def upstream_health():
          response = upstream_request("/parse", method="POST", body=b"", timeout=5)
          healthy = response["status"] == 400 and not response["error"]
          body_text = response["body"].decode("utf-8", "replace")[:500]
          return {
              "ok": healthy,
              "server_url": SERVER_URL,
              "probe": "POST /parse without a file should return HTTP 400",
              "status": response["status"],
              "error": response["error"],
              "body_preview": body_text,
          }


      def run_demo():
          pdf = sample_pdf(DEMO_TEXT)
          config = {
              "ocrEnabled": False,
              "maxPages": 1,
          }
          boundary, body = multipart_body(
              {"config": json.dumps(config, separators=(",", ":"))},
              [("file", "liteparse-phala-demo.pdf", "application/pdf", pdf)],
          )
          response = upstream_request(
              "/parse?text=true",
              method="POST",
              body=body,
              headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
              timeout=30,
          )
          text = response["body"].decode("utf-8", "replace").strip()
          return {
              "ok": response["status"] == 200 and DEMO_TEXT in text,
              "upstream_status": response["status"],
              "upstream_error": response["error"],
              "input": {
                  "filename": "liteparse-phala-demo.pdf",
                  "bytes": len(pdf),
                  "config": config,
              },
              "parsed_text": text,
              "contains_expected_text": DEMO_TEXT in text,
              "credentials_required": False,
              "hosted_model_call_attempted": False,
              "model_weights_downloaded": False,
              "ocr_enabled": False,
          }


      def base_payload():
          return {
              "service": SERVICE,
              "upstream_repo": UPSTREAM_REPO,
              "server_repo": SERVER_REPO,
              "server_url": SERVER_URL,
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "endpoints": ["/healthz", "/demo", "/v1/models", "/parse", "/screenshots"],
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "liteparse-verifier/1.0"

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      }
                  ),
                  flush=True,
              )

          def do_GET(self):
              path = urlparse(self.path).path.rstrip("/") or "/"

              if path == "/healthz":
                  health = upstream_health()
                  payload = base_payload()
                  payload.update(
                      {
                          "ok": health["ok"],
                          "status": "ok" if health["ok"] else "unhealthy",
                          "liteparse_server": health,
                      }
                  )
                  json_response(self, HTTPStatus.OK if health["ok"] else HTTPStatus.SERVICE_UNAVAILABLE, payload)
                  return

              if path == "/demo":
                  payload = base_payload()
                  try:
                      demo = run_demo()
                      payload.update({"ok": demo["ok"], "status": "ok" if demo["ok"] else "failed", "demo": demo})
                      json_response(self, HTTPStatus.OK if demo["ok"] else HTTPStatus.BAD_GATEWAY, payload)
                  except Exception as exc:
                      payload.update(
                          {
                              "ok": False,
                              "status": "failed",
                              "error": f"{type(exc).__name__}: {exc}",
                              "traceback": traceback.format_exc().splitlines()[-6:],
                          }
                      )
                      json_response(self, HTTPStatus.INTERNAL_SERVER_ERROR, payload)
                  return

              if path == "/v1/models":
                  json_response(
                      self,
                      HTTPStatus.OK,
                      {
                          "object": "list",
                          "data": [
                              {
                                  "id": "liteparse/local-document-parser",
                                  "object": "model",
                                  "created": 0,
                                  "owned_by": "run-llama",
                                  "description": (
                                      "Metadata endpoint for the local LiteParse document parser. "
                                      "No hosted LLM model is loaded or called by this template."
                                  ),
                              }
                          ],
                      },
                  )
                  return

              if path == "/":
                  payload = base_payload()
                  payload.update(
                      {
                          "ok": True,
                          "description": "LiteParse HTTP smoke template. Use POST /parse and POST /screenshots for parser calls.",
                      }
                  )
                  json_response(self, HTTPStatus.OK, payload)
                  return

              json_response(
                  self,
                  HTTPStatus.NOT_FOUND,
                  {"ok": False, "error": "not_found", "endpoints": base_payload()["endpoints"]},
              )


      if __name__ == "__main__":
          port = int(os.environ.get("APP_PORT", "8000"))
          print(
              json.dumps(
                  {
                      "event": "startup",
                      "service": SERVICE,
                      "port": port,
                      "upstream_repo": UPSTREAM_REPO,
                      "server_url": SERVER_URL,
                      "credentials_required": False,
                  }
              ),
              flush=True,
          )
          ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()

networks:
  internal:
    driver: bridge
