services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN npm install -g supergateway@3.4.3
        WORKDIR /workspace
        EXPOSE 8000
        CMD ["sh", "-lc", "exec supergateway --stdio \"npx -y @azure/mcp@3.0.0-beta.6 server start\" --outputTransport streamableHttp --port 8000 --streamableHttpPath /mcp --healthEndpoint /healthz --cors"]
    image: azure-mcp:latest
    pull_policy: build
    environment:
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - AZURE_MCP_COLLECT_TELEMETRY=${AZURE_MCP_COLLECT_TELEMETRY:-}
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - internal

  proxy:
    image: caddy:2.8
    ports:
      - "18080:80"
    environment:
      - BEARER_TOKEN=${BEARER_TOKEN}
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    restart: unless-stopped
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          @valid_auth {
              header X-Phala-MCP-Token "{env.BEARER_TOKEN}"
          }
          route @valid_auth {
              reverse_proxy app:8000
          }
          route {
              respond 401 {
                  body "Unauthorized"
                  close
              }
          }
      }

networks:
  internal:
    driver: bridge
