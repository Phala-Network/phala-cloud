services:
  app:
    image: python:3.12-slim-bookworm
    ports:
      - "8080:8080"
    environment:
      TEXTGEN_SOURCE_REF: ${TEXTGEN_SOURCE_REF:-main}
      PYTHONUNBUFFERED: "1"
    command:
      - /bin/sh
      - -lc
      - |
        exec python /server.py
    configs:
      - source: server_py
        target: /server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

configs:
  server_py:
    content: |
      import hashlib
      import json
      import os
      import platform
      import py_compile
      import shutil
      import sys
      import threading
      import time
      import urllib.request
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from pathlib import Path
      from urllib.parse import quote, urlparse

      STARTED_AT = time.time()
      SOURCE_REPO = "oobabooga/text-generation-webui"
      SOURCE_REF = os.environ.get("TEXTGEN_SOURCE_REF", "main").strip() or "main"
      SOURCE_FILES = [
          "README.md",
          "server.py",
          "modules/shared.py",
          "modules/loaders.py",
          "modules/metadata_gguf.py",
          "docs/12 - OpenAI API.md",
      ]
      REQUIRED_FLAGS = [
          "--api",
          "--api-port",
          "--listen",
          "--nowebui",
          "--portable",
          "--cpu",
      ]
      SOURCE_ROOT = Path("/tmp/text-generation-webui-source")
      STATE_LOCK = threading.Lock()
      CHECK_STATE = {
          "ok": False,
          "status": "starting",
          "message": "Source verification has not completed yet.",
      }


      def source_file_url(path):
          encoded_ref = quote(SOURCE_REF, safe="")
          encoded_path = "/".join(quote(part, safe="") for part in path.split("/"))
          return f"https://raw.githubusercontent.com/{SOURCE_REPO}/{encoded_ref}/{encoded_path}"


      def fetch_file(path):
          target = SOURCE_ROOT / path
          target.parent.mkdir(parents=True, exist_ok=True)
          request = urllib.request.Request(
              source_file_url(path),
              headers={"User-Agent": "phala-cloud-text-generation-webui-template/1.0"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              content = response.read()
          target.write_bytes(content)
          return {
              "path": path,
              "bytes": len(content),
              "sha256": hashlib.sha256(content).hexdigest()[:16],
          }


      def verify_source():
          global CHECK_STATE
          state = {
              "ok": False,
              "status": "checking",
              "source_repo": SOURCE_REPO,
              "source_ref": SOURCE_REF,
              "files": [],
              "compiled": [],
              "required_flags": {},
              "model_downloaded": False,
              "model_loaded": False,
              "real_webui_started": False,
          }

          try:
              shutil.rmtree(SOURCE_ROOT, ignore_errors=True)
              SOURCE_ROOT.mkdir(parents=True, exist_ok=True)

              for path in SOURCE_FILES:
                  state["files"].append(fetch_file(path))

              for path in [p for p in SOURCE_FILES if p.endswith(".py")]:
                  py_compile.compile(str(SOURCE_ROOT / path), doraise=True)
                  state["compiled"].append(path)

              shared_py = (SOURCE_ROOT / "modules/shared.py").read_text(encoding="utf-8")
              state["required_flags"] = {flag: flag in shared_py for flag in REQUIRED_FLAGS}
              missing_flags = [flag for flag, present in state["required_flags"].items() if not present]

              readme = (SOURCE_ROOT / "README.md").read_text(encoding="utf-8")
              api_doc = (SOURCE_ROOT / "docs/12 - OpenAI API.md").read_text(encoding="utf-8")
              state["readme_mentions_ui_api"] = "UI + API" in readme or "OpenAI/Anthropic-compatible API" in readme
              state["api_doc_present"] = "OpenAI" in api_doc and "API" in api_doc
              state["status"] = "ready" if not missing_flags else "source_flag_mismatch"
              state["ok"] = not missing_flags and state["readme_mentions_ui_api"] and state["api_doc_present"]
              state["message"] = (
                  "Downloaded selected upstream source files, compiled Python entry modules, "
                  "and verified expected CPU/API startup flags. No model weights were downloaded."
              )
              if missing_flags:
                  state["missing_flags"] = missing_flags
          except Exception as exc:
              state["status"] = "source_check_failed"
              state["error"] = f"{type(exc).__name__}: {exc}"
              state["message"] = (
                  "The demo HTTP server is running, but upstream source verification failed. "
                  "Retry later or set TEXTGEN_SOURCE_REF to a reachable branch, tag, or commit."
              )

          with STATE_LOCK:
              CHECK_STATE = state


      def current_state():
          with STATE_LOCK:
              return dict(CHECK_STATE)


      def base_payload():
          return {
              "service": "text-generation-webui-demo",
              "upstream": "https://github.com/oobabooga/text-generation-webui",
              "display_name": "oobabooga/textgen",
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "demo_scope": (
                  "CPU-safe source and API-shape smoke test. The full Gradio WebUI, model loading, "
                  "and text generation are intentionally not started."
              ),
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "text-generation-webui-demo/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              path = urlparse(self.path).path

              if path in ("/", "/healthz"):
                  payload = base_payload()
                  payload.update(current_state())
                  self.respond_json(200, payload)
                  return

              if path == "/demo":
                  payload = base_payload()
                  payload.update(current_state())
                  payload.update({
                      "check": (
                          "Fetch upstream source files, py_compile server.py and selected modules, "
                          "and verify API/CPU startup flags in modules/shared.py."
                      ),
                      "cpu_only": True,
                      "credentials_required": False,
                  })
                  self.respond_json(200, payload)
                  return

              if path == "/v1/models":
                  payload = {
                      "object": "list",
                      "data": [],
                      "demo": "No oobabooga/textgen model server is running in this CPU-safe template.",
                      "source_ready": current_state().get("ok", False),
                  }
                  self.respond_json(200, payload)
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      threading.Thread(target=verify_source, daemon=True).start()
      server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
      print("text-generation-webui demo server listening on 0.0.0.0:8080", flush=True)
      server.serve_forever()
