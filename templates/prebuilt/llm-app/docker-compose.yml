services:
  app:
    build:
      context: .
      args:
        PATHWAY_PACKAGE_VERSION: ${PATHWAY_PACKAGE_VERSION:-0.30.1}
      dockerfile_inline: |
        # syntax=docker/dockerfile:1.9
        FROM python:3.11-slim-bookworm

        ARG PATHWAY_PACKAGE_VERSION=0.30.1

        ENV PIP_DISABLE_PIP_VERSION_CHECK=1 \
            PIP_NO_CACHE_DIR=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONUNBUFFERED=1

        RUN python -m pip install --upgrade pip \
            && python -m pip install "pathway==$${PATHWAY_PACKAGE_VERSION}" \
            && python - <<'PY'
        import importlib
        import importlib.metadata

        importlib.import_module("pathway")
        print("Installed pathway", importlib.metadata.version("pathway"))
        PY

        WORKDIR /app

        RUN groupadd --system app \
            && useradd --system --create-home --home-dir /app --gid app app \
            && chown -R app:app /app

        USER app

        EXPOSE 8080
    image: phala-llm-app-verifier:0.30.1
    pull_policy: build
    restart: unless-stopped
    environment:
      LLM_APP_DEMO_TITLE: ${LLM_APP_DEMO_TITLE:-Pathway llm-app CPU demo}
      LLM_APP_DEMO_TOP_K: ${LLM_APP_DEMO_TOP_K:-2}
    ports:
      - "8080:8080"
    configs:
      - source: server_py
        target: /app/server.py
        mode: 0444
    command:
      - python
      - /app/server.py
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; data = json.load(urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5)); assert data["ok"] is True
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

configs:
  server_py:
    content: |
      import importlib
      import importlib.metadata
      import json
      import os
      import platform
      import re
      import sys
      import time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import parse_qs, urlparse

      STARTED_AT = time.time()
      UPSTREAM = "https://github.com/pathwaycom/llm-app"
      DEFAULT_QUERY = "How does pathwaycom/llm-app provide RAG over live data?"
      MODEL_ID = "llm-app-pathway-local-verifier"

      IMPORT_ERROR = None
      PACKAGE = {}

      try:
          pathway = importlib.import_module("pathway")
          metadata = importlib.metadata.metadata("pathway")
          PACKAGE = {
              "distribution": "pathway",
              "version": importlib.metadata.version("pathway"),
              "module": pathway.__name__,
              "summary": metadata.get("Summary", ""),
              "requires_python": metadata.get("Requires-Python", ""),
          }
      except Exception as exc:
          IMPORT_ERROR = f"{type(exc).__name__}: {exc}"

      DOCUMENTS = [
          {
              "id": "repo-overview",
              "title": "Pathway AI Pipelines repository",
              "text": (
                  "The upstream pathwaycom/llm-app repository is a collection of "
                  "ready-to-run LLM application templates for RAG, enterprise search, "
                  "document indexing, adaptive RAG, multimodal RAG, private RAG, and "
                  "SQL question answering."
              ),
          },
          {
              "id": "live-data",
              "title": "Live data connectors",
              "text": (
                  "The README describes live synchronization from file systems, "
                  "Google Drive, SharePoint, S3, Kafka, PostgreSQL, and real-time "
                  "data APIs so retrieval uses up-to-date source knowledge."
              ),
          },
          {
              "id": "indexing",
              "title": "Built-in indexing",
              "text": (
                  "The templates rely on Pathway for built-in data indexing, "
                  "including vector search, hybrid search, full-text search, "
                  "in-memory execution, and cache support without a separate "
                  "vector database service."
              ),
          },
          {
              "id": "http-api",
              "title": "HTTP APIs and optional UI",
              "text": (
                  "Upstream applications run as Docker containers, expose HTTP APIs "
                  "for retrieval or question answering, and some examples add a "
                  "Streamlit UI that calls the backend API."
              ),
          },
          {
              "id": "production-requirements",
              "title": "Full template requirements",
              "text": (
                  "The full question-answering RAG template uses OpenAI chat and "
                  "embedding components and expects OPENAI_API_KEY. The private RAG "
                  "template targets Ollama and sentence-transformer models. Several "
                  "upstream Docker examples mount local data and cache directories."
              ),
          },
      ]


      def tokenize(text):
          return set(re.findall(r"[a-z0-9]+", text.lower()))


      DOC_TOKENS = {
          document["id"]: tokenize(f"{document['title']} {document['text']}")
          for document in DOCUMENTS
      }


      def clamp_int(value, default, minimum, maximum):
          try:
              parsed = int(value)
          except (TypeError, ValueError):
              parsed = default
          return max(minimum, min(maximum, parsed))


      def rank_documents(query, top_k):
          query_tokens = tokenize(query)
          scored = []

          for document in DOCUMENTS:
              matches = sorted(query_tokens & DOC_TOKENS[document["id"]])
              score = len(matches)
              title_tokens = tokenize(document["title"])
              score += len(query_tokens & title_tokens)
              if "rag" in query_tokens and "RAG" in document["text"]:
                  score += 2
              if "pathway" in query_tokens and "Pathway" in document["text"]:
                  score += 2
              if "live" in query_tokens and "live" in document["text"].lower():
                  score += 1
              scored.append((score, document["id"], matches, document))

          scored.sort(key=lambda item: (-item[0], item[1]))
          return [
              {
                  "id": document["id"],
                  "title": document["title"],
                  "score": score,
                  "matched_terms": matches,
                  "text": document["text"],
              }
              for score, _doc_id, matches, document in scored[:top_k]
          ]


      def base_payload():
          payload = {
              "ok": IMPORT_ERROR is None,
              "service": "llm-app-pathway-verifier",
              "title": os.environ.get("LLM_APP_DEMO_TITLE", "Pathway llm-app CPU demo"),
              "upstream": UPSTREAM,
              "repository": {
                  "owner": "pathwaycom",
                  "name": "llm-app",
                  "declared_version": "0.3.6",
                  "license": "MIT",
                  "package_mode": False,
              },
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "pathway_package": PACKAGE,
              "full_upstream_stack": False,
              "external_calls": False,
              "credentials_used": False,
          }
          if IMPORT_ERROR:
              payload["pathway_import_error"] = IMPORT_ERROR
          return payload


      def demo_payload(query, top_k):
          contexts = rank_documents(query, top_k)
          return {
              **base_payload(),
              "demo": {
                  "query": query,
                  "model": MODEL_ID,
                  "retrieval": {
                      "top_k": top_k,
                      "contexts": contexts,
                  },
                  "deterministic_answer": (
                      "This CPU-safe verifier imports the Pathway runtime, ranks a "
                      "bundled set of upstream llm-app facts, and returns local RAG "
                      "context without calling an LLM, downloading a model, or using "
                      "an external database."
                  ),
                  "limitations": [
                      "This is not the full upstream question-answering or private RAG stack.",
                      "No user documents are indexed by default.",
                      "No OpenAI, Ollama, SharePoint, Google Drive, S3, Kafka, or PostgreSQL connector is started.",
                  ],
              },
          }


      def models_payload():
          return {
              "object": "list",
              "data": [
                  {
                      "id": MODEL_ID,
                      "object": "model",
                      "created": 0,
                      "owned_by": "pathwaycom/llm-app",
                      "provider": "local-deterministic",
                      "external_calls": False,
                  }
              ],
          }


      class Handler(BaseHTTPRequestHandler):
          def log_message(self, fmt, *args):
              print(
                  "%s - - [%s] %s"
                  % (self.address_string(), self.log_date_time_string(), fmt % args),
                  flush=True,
              )

          def send_json(self, payload, status=200):
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              parsed = urlparse(self.path)
              params = parse_qs(parsed.query)

              if parsed.path in {"/", "/healthz"}:
                  status = 200 if IMPORT_ERROR is None else 500
                  self.send_json(base_payload(), status=status)
                  return

              if parsed.path == "/demo":
                  query = params.get("q", [DEFAULT_QUERY])[0].strip() or DEFAULT_QUERY
                  default_top_k = clamp_int(
                      os.environ.get("LLM_APP_DEMO_TOP_K"), 2, 1, len(DOCUMENTS)
                  )
                  top_k = clamp_int(
                      params.get("top_k", [default_top_k])[0],
                      default_top_k,
                      1,
                      len(DOCUMENTS),
                  )
                  status = 200 if IMPORT_ERROR is None else 500
                  self.send_json(demo_payload(query, top_k), status=status)
                  return

              if parsed.path == "/v1/models":
                  self.send_json(models_payload())
                  return

              self.send_json(
                  {
                      "ok": False,
                      "error": "not_found",
                      "available_endpoints": ["/healthz", "/demo", "/v1/models"],
                  },
                  status=404,
              )


      if __name__ == "__main__":
          host = os.environ.get("HOST", "0.0.0.0")
          port = clamp_int(os.environ.get("PORT"), 8080, 1, 65535)
          server = ThreadingHTTPServer((host, port), Handler)
          print(f"Serving llm-app Pathway verifier on {host}:{port}", flush=True)
          server.serve_forever()
