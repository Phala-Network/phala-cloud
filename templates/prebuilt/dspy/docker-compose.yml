services:
  app:
    image: python:3.12-slim-bookworm
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      DSPY_PACKAGE_VERSION: ${DSPY_PACKAGE_VERSION:-3.2.1}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_ROOT_USER_ACTION: ignore
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
    configs:
      - source: dspy_demo_app
        target: /opt/dspy-demo/server.py
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        python -m pip install --no-cache-dir "dspy==$${DSPY_PACKAGE_VERSION}"
        exec python /opt/dspy-demo/server.py
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, sys, urllib.request; port = os.environ.get('PORT', '8080'); response = urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=5); sys.exit(0 if response.status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

configs:
  dspy_demo_app:
    content: |
      import importlib
      import importlib.metadata
      import json
      import os
      import platform
      import sys
      import time
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import urlparse


      STARTED_AT = time.time()
      PACKAGE_NAME = "dspy"
      UPSTREAM_REPO = "https://github.com/stanfordnlp/dspy"


      def import_checks():
          result = {
              "package": PACKAGE_NAME,
              "distribution_version": None,
              "module_version": None,
              "import_ok": False,
              "symbols": {},
              "error": None,
          }
          try:
              result["distribution_version"] = importlib.metadata.version(PACKAGE_NAME)
              dspy = importlib.import_module(PACKAGE_NAME)
              result["module_version"] = getattr(dspy, "__version__", None)
              for symbol in ("Signature", "InputField", "OutputField", "Example", "Module", "Prediction"):
                  result["symbols"][symbol] = hasattr(dspy, symbol)
              result["import_ok"] = bool(result["distribution_version"]) and all(result["symbols"].values())
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"
          return result


      IMPORT_STATUS = import_checks()


      def as_plain_dict(value):
          if hasattr(value, "toDict"):
              return value.toDict()
          return dict(value)


      def run_local_dspy_demo():
          if not IMPORT_STATUS["import_ok"]:
              raise RuntimeError(IMPORT_STATUS["error"] or "DSPy import check failed")

          import dspy

          class SupportTriage(dspy.Signature):
              """Classify a support smoke-test message without invoking an LM."""

              text = dspy.InputField(desc="support or deployment status message")
              label = dspy.OutputField(desc="one of pass, needs_attention, review")
              rationale = dspy.OutputField(desc="short deterministic local explanation")

          class LocalTriageProgram(dspy.Module):
              def forward(self, text: str):
                  normalized = text.lower()
                  if "timeout" in normalized or "error" in normalized or "failed" in normalized:
                      label = "needs_attention"
                      rationale = "Matched local failure keyword rule."
                  elif "passed" in normalized or "ready" in normalized or "200" in normalized:
                      label = "pass"
                      rationale = "Matched local readiness keyword rule."
                  else:
                      label = "review"
                      rationale = "No pass or failure keyword matched."
                  return dspy.Prediction(label=label, rationale=rationale)

          examples = [
              dspy.Example(
                  text="The health endpoint returned 200 and the smoke test passed.",
                  label="pass",
              ).with_inputs("text"),
              dspy.Example(
                  text="The optimizer job failed with a timeout error.",
                  label="needs_attention",
              ).with_inputs("text"),
          ]
          program = LocalTriageProgram()
          cases = []
          passed = 0

          for index, example in enumerate(examples, start=1):
              inputs = as_plain_dict(example.inputs())
              labels = as_plain_dict(example.labels())
              prediction = program(**inputs)
              prediction_dict = as_plain_dict(prediction)
              exact_match = prediction_dict["label"] == labels["label"]
              passed += int(exact_match)
              cases.append(
                  {
                      "case": index,
                      "inputs": inputs,
                      "expected": labels,
                      "prediction": prediction_dict,
                      "exact_match": exact_match,
                  }
              )

          return {
              "ok": passed == len(cases),
              "demo_type": "deterministic local DSPy primitives",
              "signature": str(SupportTriage.signature),
              "dspy_objects": [
                  "Signature",
                  "InputField",
                  "OutputField",
                  "Example.with_inputs",
                  "Module.forward",
                  "Prediction",
              ],
              "metric": {
                  "name": "local exact match",
                  "passed": passed,
                  "total": len(cases),
                  "ok": passed == len(cases),
              },
              "cases": cases,
              "llm_provider_calls": False,
              "remote_model_calls": False,
              "model_downloaded": False,
              "model_loaded": False,
              "credentials_required": False,
              "note": (
                  "The default demo intentionally avoids dspy.Predict and LM-backed optimization calls. "
                  "Configure an LM provider outside this no-secret smoke path for full DSPy programs."
              ),
          }


      def demo_result():
          try:
              return run_local_dspy_demo()
          except Exception as exc:
              return {
                  "ok": False,
                  "error": f"{type(exc).__name__}: {exc}",
                  "llm_provider_calls": False,
                  "remote_model_calls": False,
                  "credentials_required": False,
              }


      def base_payload():
          return {
              "service": "dspy-demo",
              "upstream": UPSTREAM_REPO,
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "dspy": IMPORT_STATUS,
          }


      def response_body(path):
          if path == "/healthz":
              demo = demo_result()
              ok = IMPORT_STATUS["import_ok"] and demo["ok"]
              payload = base_payload()
              payload.update(
                  {
                      "status": "ready" if ok else "unhealthy",
                      "ok": ok,
                      "demo": demo,
                  }
              )
              return HTTPStatus.OK if ok else HTTPStatus.SERVICE_UNAVAILABLE, payload

          if path == "/demo":
              demo = demo_result()
              payload = base_payload()
              payload.update(demo)
              return HTTPStatus.OK if demo["ok"] else HTTPStatus.INTERNAL_SERVER_ERROR, payload

          if path == "/v1/models":
              return HTTPStatus.OK, {
                  "object": "list",
                  "data": [
                      {
                          "id": "dspy/local-deterministic-demo",
                          "object": "model",
                          "created": 0,
                          "owned_by": "stanfordnlp",
                          "description": (
                              "Local DSPy primitives smoke endpoint. The default template "
                              "does not host, download, or call an LLM model."
                          ),
                      }
                  ],
                  "dspy": IMPORT_STATUS,
                  "llm_provider_calls": False,
              }

          if path == "/":
              return HTTPStatus.OK, {
                  "service": "dspy-demo",
                  "endpoints": ["/healthz", "/demo", "/v1/models"],
                  "upstream": UPSTREAM_REPO,
                  "dspy_import_ok": IMPORT_STATUS["import_ok"],
              }

          return HTTPStatus.NOT_FOUND, {
              "error": "not_found",
              "endpoints": ["/healthz", "/demo", "/v1/models"],
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "dspy-demo"

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      }
                  ),
                  flush=True,
              )

          def do_GET(self):
              path = urlparse(self.path).path.rstrip("/") or "/"
              status, payload = response_body(path)
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)


      if __name__ == "__main__":
          port = int(os.environ.get("PORT", "8080"))
          print(
              json.dumps(
                  {
                      "event": "startup",
                      "port": port,
                      "dspy": IMPORT_STATUS,
                      "llm_provider_calls": False,
                  }
              ),
              flush=True,
          )
          ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()
