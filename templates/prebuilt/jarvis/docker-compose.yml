services:
  jarvis:
    image: python:3.11-slim-bookworm
    container_name: jarvis-demo
    restart: unless-stopped
    init: true
    environment:
      PYTHONUNBUFFERED: "1"
      JARVIS_REF: ${JARVIS_REF:-7624cf388b47334ff8a0868e7d862dde18cfda86}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HUGGINGFACE_ACCESS_TOKEN: ${HUGGINGFACE_ACCESS_TOKEN:-}
    ports:
      - "8080:8080"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        cat >/tmp/jarvis_demo.py <<'PY'
        import hashlib
        import json
        import os
        import sys
        import time
        import urllib.error
        import urllib.request
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from urllib.parse import urlparse

        TEMPLATE_ID = "jarvis"
        UPSTREAM_REPO = "https://github.com/microsoft/JARVIS"
        PINNED_REF = "7624cf388b47334ff8a0868e7d862dde18cfda86"
        REF = os.environ.get("JARVIS_REF", PINNED_REF).strip() or PINNED_REF
        RAW_BASE = f"https://raw.githubusercontent.com/microsoft/JARVIS/{REF}"

        FILES = {
            "README.md": {
                "sha256": "0e519dc09eb1532379d1e675133d9049e2f6a1ba11e4b7a5e510606dd002cd16",
                "contains": [
                    "# JARVIS",
                    "HuggingGPT: Solving AI Tasks with ChatGPT and its Friends in HuggingFace",
                    "Task Planning",
                    "Model Selection",
                    "OPENAI_API_KEY",
                    "HUGGINGFACE_ACCESS_TOKEN",
                ],
            },
            "hugginggpt/server/configs/config.lite.yaml": {
                "sha256": "2f8923d4ee7962b3e23974e81d64eb8ca45bbf3eb13c70d4b73bd9b1844ab2b2",
                "contains": [
                    "inference_mode: huggingface",
                    "local_deployment: minimal",
                    "http_listen:",
                    "port: 8004",
                ],
            },
            "hugginggpt/server/awesome_chat.py": {
                "sha256": "9ac5a2efbcd292345c12fd077dbef82e53b7d752c1c4d0524e6b78b5f8e8eb3c",
                "contains": [
                    "from huggingface_hub.inference_api import InferenceApi",
                    "def parse_task",
                    "def choose_model",
                    "def response_results",
                    "HUGGINGFACE_ACCESS_TOKEN",
                ],
            },
            "hugginggpt/server/requirements.txt": {
                "sha256": "4444499ab37dcfff2888d13c97fef2c38229ffec64dc7752776d39ad3b09e4b4",
                "contains": [
                    "flask==2.2.3",
                    "waitress==2.1.2",
                    "gradio==3.24.1",
                    "git+https://github.com/huggingface/transformers",
                ],
            },
        }

        def fetch_text(path):
            url = f"{RAW_BASE}/{path}"
            last_error = None
            for attempt in range(1, 6):
                try:
                    req = urllib.request.Request(url, headers={"User-Agent": "phala-jarvis-template/1.0"})
                    with urllib.request.urlopen(req, timeout=20) as response:
                        data = response.read()
                    return data.decode("utf-8"), url
                except (urllib.error.URLError, TimeoutError, UnicodeDecodeError) as exc:
                    last_error = exc
                    time.sleep(min(attempt * 2, 10))
            raise RuntimeError(f"could not fetch {url}: {last_error}")

        def verify_upstream():
            strict_hashes = REF == PINNED_REF
            verified = []
            for path, checks in FILES.items():
                text, url = fetch_text(path)
                digest = hashlib.sha256(text.encode("utf-8")).hexdigest()
                missing = [needle for needle in checks["contains"] if needle not in text]
                if missing:
                    raise RuntimeError(f"{path} is missing expected JARVIS markers: {missing}")
                if strict_hashes and digest != checks["sha256"]:
                    raise RuntimeError(f"{path} hash mismatch: got {digest}, expected {checks['sha256']}")
                verified.append(
                    {
                        "path": path,
                        "url": url,
                        "sha256": digest,
                        "expected_sha256": checks["sha256"] if strict_hashes else None,
                        "bytes": len(text.encode("utf-8")),
                        "markers_checked": len(checks["contains"]),
                    }
                )
            return {
                "ok": True,
                "template_id": TEMPLATE_ID,
                "upstream": UPSTREAM_REPO,
                "ref": REF,
                "strict_hashes": strict_hashes,
                "verified_at": int(time.time()),
                "verified_files": verified,
            }

        try:
            VERIFY_RESULT = verify_upstream()
        except Exception as exc:
            print(f"JARVIS upstream verification failed: {exc}", file=sys.stderr, flush=True)
            raise

        MODEL_CARD = {
            "id": "microsoft-jarvis-upstream-verifier",
            "object": "model",
            "created": VERIFY_RESULT["verified_at"],
            "owned_by": "microsoft/JARVIS",
            "metadata": {
                "upstream": UPSTREAM_REPO,
                "ref": REF,
                "purpose": "CPU-safe source verification demo; no model inference is started.",
            },
        }

        def json_response(handler, status, payload):
            body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
            handler.send_response(status)
            handler.send_header("Content-Type", "application/json; charset=utf-8")
            handler.send_header("Content-Length", str(len(body)))
            handler.end_headers()
            handler.wfile.write(body)

        class Handler(BaseHTTPRequestHandler):
            server_version = "JarvisTemplateDemo/1.0"

            def do_GET(self):
                path = urlparse(self.path).path
                if path in ("/", "/demo"):
                    json_response(
                        self,
                        200,
                        {
                            "name": "microsoft/JARVIS",
                            "description": "HuggingGPT/JARVIS connects LLMs with Hugging Face models as tools.",
                            "upstream_verification": VERIFY_RESULT,
                            "demo": {
                                "runs_inference": False,
                                "downloads_models": False,
                                "requires_gpu": False,
                                "requires_credentials": False,
                                "real_jarvis_requires": [
                                    "OPENAI_API_KEY",
                                    "HUGGINGFACE_ACCESS_TOKEN",
                                ],
                                "workflow_stages": [
                                    "task planning",
                                    "model selection",
                                    "task execution",
                                    "response generation",
                                ],
                            },
                        },
                    )
                    return
                if path == "/healthz":
                    json_response(self, 200, {"ok": True, "verified": True, "ref": REF})
                    return
                if path == "/v1/models":
                    json_response(self, 200, {"object": "list", "data": [MODEL_CARD]})
                    return
                json_response(self, 404, {"error": "not found", "paths": ["/healthz", "/demo", "/v1/models"]})

            def log_message(self, fmt, *args):
                print("%s - %s" % (self.address_string(), fmt % args), flush=True)

        server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
        print(f"JARVIS demo verified {len(VERIFY_RESULT['verified_files'])} upstream files at {REF}", flush=True)
        server.serve_forever()
        PY
        exec python /tmp/jarvis_demo.py
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
