services:
  app:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    environment:
      APP_PORT: "${APP_PORT:-8000}"
      COGNEE_PACKAGE_VERSION: "${COGNEE_PACKAGE_VERSION:-1.1.0}"
      COGNEE_DEMO_TOP_K: "${COGNEE_DEMO_TOP_K:-2}"
      DATA_ROOT_DIRECTORY: "/data/cognee/data"
      SYSTEM_ROOT_DIRECTORY: "/data/cognee/system"
      CACHE_ROOT_DIRECTORY: "/data/cognee/cache"
      HOME: "/data/home"
      LOG_LEVEL: "${LOG_LEVEL:-WARNING}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-true}"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      UV_SYSTEM_PYTHON: "1"
    volumes:
      - cognee-data:/data
    configs:
      - source: cognee_demo_app
        target: /opt/cognee-demo/main.py
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        uv pip install --system --no-cache "cognee==$${COGNEE_PACKAGE_VERSION}"
        exec python /opt/cognee-demo/main.py
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, sys, urllib.request; port = os.environ.get('APP_PORT', '8000'); response = urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=5); sys.exit(0 if response.status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 420s
    networks:
      - internal

  proxy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "8080:80"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          encode zstd gzip
          header {
              X-Content-Type-Options "nosniff"
              Referrer-Policy "no-referrer"
              -Server
          }
          reverse_proxy app:8000
      }

  cognee_demo_app:
    content: |
      import importlib
      import importlib.metadata
      import json
      import os
      import platform
      import re
      import sys
      import time
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import parse_qs, urlparse


      STARTED_AT = time.time()
      PACKAGE_NAME = "cognee"
      DATA_DIRS = (
          os.environ.get("DATA_ROOT_DIRECTORY"),
          os.environ.get("SYSTEM_ROOT_DIRECTORY"),
          os.environ.get("CACHE_ROOT_DIRECTORY"),
          os.environ.get("HOME"),
      )

      for directory in DATA_DIRS:
          if directory:
              os.makedirs(directory, exist_ok=True)


      DEMO_MEMORIES = [
          {
              "id": "demo-001",
              "type": "decision",
              "text": "Cognee turns documents, decisions, and workflows into graph-backed memory for agents.",
              "links": ["knowledge-graph", "agent-context"],
          },
          {
              "id": "demo-002",
              "type": "deployment",
              "text": "This Phala Cloud demo imports the official cognee package without calling an LLM provider.",
              "links": ["phala-cloud", "no-provider-credentials"],
          },
          {
              "id": "demo-003",
              "type": "production-note",
              "text": "Real Cognee remember and recall pipelines need configured LLM and embedding providers.",
              "links": ["llm-provider", "embedding-provider"],
          },
      ]


      DEMO_EDGES = [
          {"source": "demo-001", "target": "knowledge-graph", "relationship": "uses"},
          {"source": "demo-001", "target": "agent-context", "relationship": "improves"},
          {"source": "demo-002", "target": "phala-cloud", "relationship": "runs_on"},
          {"source": "demo-003", "target": "llm-provider", "relationship": "requires_for_real_pipelines"},
      ]


      def tokenize(value):
          return set(re.findall(r"[a-z0-9]+", value.lower()))


      def import_checks():
          result = {
              "package": PACKAGE_NAME,
              "distribution_version": None,
              "module_version": None,
              "import_ok": False,
              "checks": {},
              "error": None,
          }
          try:
              result["distribution_version"] = importlib.metadata.version(PACKAGE_NAME)
              cognee = importlib.import_module(PACKAGE_NAME)
              result["module_version"] = getattr(cognee, "__version__", None)
              for symbol in ("remember", "recall", "forget", "improve", "add", "search", "config"):
                  result["checks"][symbol] = hasattr(cognee, symbol)
              result["import_ok"] = bool(result["distribution_version"]) and all(result["checks"].values())
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"
          return result


      IMPORT_STATUS = import_checks()


      def search_demo(query):
          query_terms = tokenize(query)
          results = []
          for item in DEMO_MEMORIES:
              haystack = " ".join([item["text"], item["type"], " ".join(item["links"])])
              score = len(query_terms & tokenize(haystack))
              if query_terms and score == 0:
                  continue
              results.append({**item, "score": score})
          results.sort(key=lambda item: (-item["score"], item["id"]))
          try:
              top_k = max(1, int(os.environ.get("COGNEE_DEMO_TOP_K", "2")))
          except ValueError:
              top_k = 2
          return results[:top_k]


      def base_payload():
          return {
              "service": "cognee-demo",
              "upstream": "https://github.com/topoteretes/cognee",
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "cpu_safe": True,
              "external_credentials_required": False,
              "llm_provider_calls": False,
              "model_downloads": False,
              "real_cognee_operations_enabled": False,
              "cognee": IMPORT_STATUS,
          }


      def response_body(path, query_string):
          if path in ("/", "/healthz"):
              payload = base_payload()
              payload.update(
                  {
                      "ok": IMPORT_STATUS["import_ok"],
                      "status": "ready" if IMPORT_STATUS["import_ok"] else "import_failed",
                      "endpoints": ["/healthz", "/demo", "/v1/models"],
                  }
              )
              status = HTTPStatus.OK if IMPORT_STATUS["import_ok"] else HTTPStatus.SERVICE_UNAVAILABLE
              return status, payload

          if path == "/demo":
              params = parse_qs(query_string)
              query = params.get("q", ["agent memory graph"])[0]
              payload = base_payload()
              payload.update(
                  {
                      "ok": IMPORT_STATUS["import_ok"],
                      "mode": "deterministic-local-memory-graph",
                      "query": query,
                      "results": search_demo(query),
                      "graph": {"nodes": DEMO_MEMORIES, "edges": DEMO_EDGES},
                      "note": (
                          "The official cognee package imported successfully. This endpoint uses "
                          "deterministic local data so smoke tests do not need LLM credentials, "
                          "embedding providers, model downloads, GPU devices, or external databases."
                      ),
                  }
              )
              status = HTTPStatus.OK if IMPORT_STATUS["import_ok"] else HTTPStatus.SERVICE_UNAVAILABLE
              return status, payload

          if path == "/v1/models":
              return HTTPStatus.OK, {
                  "object": "list",
                  "data": [
                      {
                          "id": "cognee/no-llm-demo",
                          "object": "model",
                          "created": 0,
                          "owned_by": "topoteretes",
                          "description": (
                              "Metadata-only model-list endpoint for API-client smoke checks. "
                              "The default template does not host or call a model."
                          ),
                      }
                  ],
              }

          return HTTPStatus.NOT_FOUND, {
              "error": "not_found",
              "endpoints": ["/healthz", "/demo", "/v1/models"],
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "cognee-demo"

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      }
                  ),
                  flush=True,
              )

          def do_GET(self):
              parsed = urlparse(self.path)
              path = parsed.path.rstrip("/") or "/"
              status, payload = response_body(path, parsed.query)
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)


      if __name__ == "__main__":
          port = int(os.environ.get("APP_PORT", "8000"))
          print(
              json.dumps(
                  {
                      "event": "startup",
                      "port": port,
                      "cognee": IMPORT_STATUS,
                      "llm_provider_calls": False,
                      "external_credentials_required": False,
                  }
              ),
              flush=True,
          )
          ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()

volumes:
  cognee-data:

networks:
  internal:
    driver: bridge
