services:
  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    init: true
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_HOST: 0.0.0.0
      PHOENIX_PORT: "6006"
      PHOENIX_GRPC_PORT: "4317"
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_TELEMETRY_ENABLED: ${PHOENIX_TELEMETRY_ENABLED:-false}
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: ${PHOENIX_ALLOW_EXTERNAL_RESOURCES:-true}
    volumes:
      - phoenix_data:/mnt/data

volumes:
  phoenix_data:
