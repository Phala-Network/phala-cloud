services:
  app:
    image: python:3.12-slim-bookworm
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    environment:
      TRIVY_VERSION: ${TRIVY_VERSION:-0.71.0}
      TRIVY_CACHE_DIR: /tmp/trivy-cache
      TRIVY_NO_PROGRESS: "true"
      PYTHONUNBUFFERED: "1"
      APP_PORT: "8000"
    configs:
      - source: trivy_demo_app
        target: /opt/trivy-demo/main.py
    command:
      - /bin/sh
      - -lc
      - |
        set -eu

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl tar
        rm -rf /var/lib/apt/lists/*

        arch="$$(uname -m)"
        case "$$arch" in
          x86_64|amd64)
            trivy_arch="64bit"
            ;;
          aarch64|arm64)
            trivy_arch="ARM64"
            ;;
          *)
            echo "unsupported architecture: $$arch" >&2
            exit 1
            ;;
        esac

        tmp_dir="$$(mktemp -d)"
        trap 'rm -rf "$$tmp_dir"' EXIT
        url="https://github.com/aquasecurity/trivy/releases/download/v$${TRIVY_VERSION}/trivy_$${TRIVY_VERSION}_Linux-$${trivy_arch}.tar.gz"
        curl -fsSL "$$url" -o "$$tmp_dir/trivy.tar.gz"
        tar -xzf "$$tmp_dir/trivy.tar.gz" -C "$$tmp_dir" trivy
        cp "$$tmp_dir/trivy" /usr/local/bin/trivy
        chmod 0755 /usr/local/bin/trivy
        trivy --version

        exec python /opt/trivy-demo/main.py
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5); sys.exit(0 if response.status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    networks:
      - internal

  proxy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "8080:80"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          encode zstd gzip
          header {
              X-Content-Type-Options "nosniff"
              Referrer-Policy "no-referrer"
              -Server
          }
          reverse_proxy app:8000
      }

  trivy_demo_app:
    content: |
      import json
      import os
      import platform
      import shutil
      import subprocess
      import sys
      import tempfile
      import time
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from pathlib import Path
      from urllib.parse import urlparse


      STARTED_AT = time.time()
      TRIVY_VERSION = os.environ.get("TRIVY_VERSION", "0.71.0")
      CACHE_DIR = os.environ.get("TRIVY_CACHE_DIR", "/tmp/trivy-cache")
      ENDPOINTS = ["/healthz", "/demo", "/v1/models", "/upstream"]


      def run_command(args, cwd=None, timeout=60):
          try:
              completed = subprocess.run(
                  args,
                  cwd=cwd,
                  check=False,
                  capture_output=True,
                  text=True,
                  timeout=timeout,
                  env={
                      **os.environ,
                      "TRIVY_CACHE_DIR": CACHE_DIR,
                      "TRIVY_NO_PROGRESS": "true",
                  },
              )
              return {
                  "ok": completed.returncode == 0,
                  "exit_code": completed.returncode,
                  "stdout": completed.stdout.strip(),
                  "stderr": completed.stderr.strip(),
                  "error": None,
              }
          except Exception as exc:
              return {
                  "ok": False,
                  "exit_code": None,
                  "stdout": "",
                  "stderr": "",
                  "error": f"{type(exc).__name__}: {exc}",
              }


      def parse_trivy_version(output):
          for line in output.splitlines():
              if line.startswith("Version:"):
                  return line.split(":", 1)[1].strip()
          return None


      def verify_trivy():
          binary = shutil.which("trivy")
          version_result = run_command(["trivy", "--version"], timeout=15) if binary else {
              "ok": False,
              "exit_code": None,
              "stdout": "",
              "stderr": "",
              "error": "trivy binary was not found on PATH",
          }
          return {
              "ok": bool(binary and version_result["ok"]),
              "binary": binary,
              "requested_version": TRIVY_VERSION,
              "reported_version": parse_trivy_version(version_result["stdout"]),
              "version_command": {
                  "command": "trivy --version",
                  "ok": version_result["ok"],
                  "exit_code": version_result["exit_code"],
                  "stdout": version_result["stdout"],
                  "stderr": version_result["stderr"],
                  "error": version_result["error"],
              },
          }


      STARTUP_STATUS = verify_trivy()


      def base_payload():
          return {
              "service": "trivy-local-security-verifier",
              "upstream": "https://github.com/aquasecurity/trivy",
              "docs": "https://trivy.dev/latest/docs/",
              "filesystem_docs": "https://trivy.dev/latest/docs/target/filesystem/",
              "client_server_docs": "https://trivy.dev/latest/docs/references/modes/client-server/",
              "release": f"https://github.com/aquasecurity/trivy/releases/tag/v{TRIVY_VERSION}",
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "cpu_only": True,
              "credentials_required": False,
              "provider_calls": False,
              "model_downloads": False,
              "trivy": STARTUP_STATUS,
          }


      def write_demo_project(root):
          sample = Path(root) / ".env"
          github_token = "ghp_" + "abcdefghijklmnopqrstuvwxyz" + "ABCDEF1234"
          slack_token = (
              "xoxb-"
              + "123456789012"
              + "-"
              + "123456789012"
              + "-"
              + "abcdefghijklmnopqrstuvwx"
          )
          sample.write_text(
              "\n".join(
                  [
                      "service = trivy-template-demo",
                      "GITHUB_TOKEN=" + github_token,
                      "SLACK_BOT_TOKEN=" + slack_token,
                      "note = values are public dummy tokens for local scanner verification",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          readme = Path(root) / "README.md"
          readme.write_text(
              "# Trivy demo project\n\nThis temporary project is generated by the Phala Cloud template verifier.\n",
              encoding="utf-8",
          )
          return sample


      def summarize_secret_results(parsed):
          findings = []
          for result in parsed.get("Results", []) or []:
              target = result.get("Target")
              for secret in result.get("Secrets", []) or []:
                  findings.append(
                      {
                          "target": target,
                          "rule_id": secret.get("RuleID"),
                          "category": secret.get("Category"),
                          "severity": secret.get("Severity"),
                          "title": secret.get("Title"),
                          "start_line": secret.get("StartLine"),
                          "end_line": secret.get("EndLine"),
                      }
                  )
          return findings


      def run_demo():
          with tempfile.TemporaryDirectory(prefix="trivy-demo-") as temp_dir:
              sample = write_demo_project(temp_dir)
              command = [
                  "trivy",
                  "fs",
                  "--scanners",
                  "secret",
                  "--skip-db-update",
                  "--offline-scan",
                  "--quiet",
                  "--format",
                  "json",
                  "--exit-code",
                  "0",
                  temp_dir,
              ]
              execution = run_command(command, timeout=90)
              parsed = None
              parse_error = None
              if execution["stdout"]:
                  try:
                      parsed = json.loads(execution["stdout"])
                  except Exception as exc:
                      parse_error = f"{type(exc).__name__}: {exc}"
              findings = summarize_secret_results(parsed or {})
              return {
                  "ok": execution["ok"] and parsed is not None and len(findings) > 0,
                  "command": " ".join(command[:-1] + ["/tmp/trivy-demo-*"]),
                  "execution": {
                      "ok": execution["ok"],
                      "exit_code": execution["exit_code"],
                      "stderr": execution["stderr"],
                      "error": execution["error"],
                  },
                  "scanner": {
                      "target": "filesystem",
                      "scanners": ["secret"],
                      "skip_db_update": True,
                      "offline_scan": True,
                      "sample_file": sample.name,
                  },
                  "results": {
                      "json_parse_ok": parsed is not None,
                      "json_parse_error": parse_error,
                      "result_count": len((parsed or {}).get("Results", []) or []),
                      "secret_findings": findings,
                      "secret_findings_count": len(findings),
                  },
                  "safety": {
                      "credentials_required": False,
                      "credentials_used": False,
                      "network_model_calls": False,
                      "model_downloads": False,
                      "gpu_required": False,
                      "cpu_only": True,
                      "real_secrets_returned": False,
                  },
              }


      def response_for(path):
          if path == "/healthz":
              status = HTTPStatus.OK if STARTUP_STATUS["ok"] else HTTPStatus.SERVICE_UNAVAILABLE
              payload = base_payload()
              payload["status"] = "ok" if STARTUP_STATUS["ok"] else "unhealthy"
              return status, payload

          if path == "/demo":
              payload = base_payload()
              payload["demo"] = run_demo()
              payload["ok"] = payload["demo"]["ok"]
              return HTTPStatus.OK if payload["ok"] else HTTPStatus.INTERNAL_SERVER_ERROR, payload

          if path == "/v1/models":
              return HTTPStatus.OK, {
                  "object": "list",
                  "data": [
                      {
                          "id": "trivy/local-secret-scan",
                          "object": "model",
                          "created": 0,
                          "owned_by": "aquasecurity",
                          "description": "Metadata endpoint for the local Trivy filesystem secret-scan verifier. No LLM model is hosted.",
                      },
                      {
                          "id": "trivy/filesystem-scanner",
                          "object": "model",
                          "created": 0,
                          "owned_by": "aquasecurity",
                          "description": "Trivy filesystem scanner metadata covering vulnerabilities, misconfigurations, secrets, licenses, and SBOM workflows.",
                      },
                  ],
              }

          if path == "/upstream":
              return HTTPStatus.OK, {
                  "repository": "https://github.com/aquasecurity/trivy",
                  "documentation": "https://trivy.dev/latest/docs/",
                  "filesystem_scan_docs": "https://trivy.dev/latest/docs/target/filesystem/",
                  "client_server_docs": "https://trivy.dev/latest/docs/references/modes/client-server/",
                  "release": f"https://github.com/aquasecurity/trivy/releases/tag/v{TRIVY_VERSION}",
                  "icon_source": "https://github.com/aquasecurity/trivy/blob/main/docs/imgs/logo.png",
                  "default_template_scope": "HTTP verifier for local Trivy CLI secret scanning",
              }

          if path == "/":
              payload = base_payload()
              payload["endpoints"] = ENDPOINTS
              return HTTPStatus.OK, payload

          return HTTPStatus.NOT_FOUND, {
              "error": "not_found",
              "endpoints": ENDPOINTS,
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "trivy-demo"

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      }
                  ),
                  flush=True,
              )

          def do_GET(self):
              path = urlparse(self.path).path.rstrip("/") or "/"
              status, payload = response_for(path)
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)


      if __name__ == "__main__":
          port = int(os.environ.get("APP_PORT", "8000"))
          print(
              json.dumps(
                  {
                      "event": "startup",
                      "port": port,
                      "trivy": STARTUP_STATUS,
                      "credentials_required": False,
                  }
              ),
              flush=True,
          )
          ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()

networks:
  internal:
    driver: bridge
