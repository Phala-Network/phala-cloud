services:
  app:
    image: python:3.11-slim-bookworm
    ports:
      - "8080:8080"
    environment:
      - OPENLLM_PYTHON_VERSION=${OPENLLM_PYTHON_VERSION:-0.6.30}
      - BENTOML_DO_NOT_TRACK=true
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_NO_CACHE_DIR=1
      - PIP_ROOT_USER_ACTION=ignore
      - PYTHONUNBUFFERED=1
    command:
      - /bin/sh
      - -lc
      - |
        python -m pip install --no-cache-dir "openllm==$${OPENLLM_PYTHON_VERSION}"
        exec python /server.py
    configs:
      - source: server_py
        target: /server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped

configs:
  server_py:
    content: |
      import importlib.metadata
      import json
      import os
      import platform
      import shutil
      import sys
      import time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import urlparse

      STARTED_AT = time.time()
      IMPORT_ERROR = None
      PACKAGE = {}

      try:
          import bentoml
          import openai
          import openllm
          import openllm.__main__ as openllm_cli
          import openllm.local as openllm_local

          PACKAGE = {
              "distribution": "openllm",
              "version": importlib.metadata.version("openllm"),
              "module": openllm.__name__,
              "cli_module": openllm_cli.__name__,
              "local_module": openllm_local.__name__,
              "bentoml_version": importlib.metadata.version("bentoml"),
              "bentoml_module": bentoml.__name__,
              "openai_version": importlib.metadata.version("openai"),
              "openai_module": openai.__name__,
              "openllm_cli": shutil.which("openllm"),
          }
      except Exception as exc:
          IMPORT_ERROR = f"{type(exc).__name__}: {exc}"


      def base_payload():
          return {
              "service": "openllm-demo",
              "upstream": "https://github.com/bentoml/OpenLLM",
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "package": PACKAGE,
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "openllm-demo/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              path = urlparse(self.path).path

              if path in ("/", "/healthz"):
                  payload = base_payload()
                  payload.update({
                      "ok": IMPORT_ERROR is None,
                      "status": "ready" if IMPORT_ERROR is None else "import_failed",
                      "smoke_test": (
                          "Imports openllm CLI/local modules plus BentoML and OpenAI client dependencies. "
                          "No model weights are downloaded and no inference server is started."
                      ),
                  })
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              if path == "/demo":
                  payload = base_payload()
                  payload.update({
                      "ok": IMPORT_ERROR is None,
                      "check": "import openllm.__main__, openllm.local, bentoml, openai",
                      "cpu_only": True,
                      "model_downloaded": False,
                      "model_loaded": False,
                      "inference_started": False,
                      "message": (
                          "OpenLLM package and serving-related Python modules loaded successfully. "
                          "Real openllm serve runs require a selected model and may require GPU, "
                          "larger memory, large downloads, and model-provider credentials."
                      ),
                  })
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              if path == "/v1/models":
                  payload = {
                      "object": "list",
                      "data": [],
                      "demo": "No OpenLLM model server is running in this CPU-safe template.",
                  }
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
      print("openllm demo server listening on 0.0.0.0:8080", flush=True)
      server.serve_forever()
