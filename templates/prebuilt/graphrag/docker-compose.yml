services:
  app:
    build:
      context: .
      args:
        GRAPHRAG_PACKAGE_VERSION: ${GRAPHRAG_PACKAGE_VERSION:-3.0.9}
      dockerfile_inline: |
        # syntax=docker/dockerfile:1.9
        FROM python:3.12-slim-bookworm

        ARG GRAPHRAG_PACKAGE_VERSION=3.0.9

        ENV PIP_DISABLE_PIP_VERSION_CHECK=1 \
            PIP_NO_CACHE_DIR=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONUNBUFFERED=1

        RUN python -m pip install --upgrade pip \
            && python -m pip install "graphrag==$${GRAPHRAG_PACKAGE_VERSION}" \
            && python - <<'PY'
        import importlib
        import importlib.metadata

        importlib.import_module("graphrag")
        print("Installed graphrag", importlib.metadata.version("graphrag"))
        PY

        WORKDIR /app

        RUN groupadd --system app \
            && useradd --system --create-home --home-dir /app --gid app app \
            && chown -R app:app /app

        USER app

        EXPOSE 8080
    image: phala-graphrag-demo:3.0.9
    pull_policy: build
    restart: unless-stopped
    environment:
      GRAPHRAG_DEMO_TITLE: ${GRAPHRAG_DEMO_TITLE:-GraphRAG CPU demo}
    ports:
      - "8080:8080"
    configs:
      - source: server_py
        target: /app/server.py
        mode: 0444
    command:
      - python
      - /app/server.py
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; data = json.load(urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5)); assert data["ok"] is True
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

configs:
  server_py:
    content: |
      import importlib
      import importlib.metadata
      import json
      import os
      import platform
      import re
      import sys
      import time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import parse_qs, urlparse

      STARTED_AT = time.time()
      UPSTREAM = "https://github.com/microsoft/graphrag"
      DEFAULT_QUERY = "How does GraphRAG use graph structure for retrieval?"

      IMPORT_ERROR = None
      PACKAGE = {}

      try:
          graphrag = importlib.import_module("graphrag")
          metadata = importlib.metadata.metadata("graphrag")
          PACKAGE = {
              "distribution": "graphrag",
              "version": importlib.metadata.version("graphrag"),
              "module": graphrag.__name__,
              "summary": metadata.get("Summary", ""),
              "requires_python": metadata.get("Requires-Python", ""),
          }
      except Exception as exc:
          IMPORT_ERROR = f"{type(exc).__name__}: {exc}"

      DOCUMENTS = [
          {
              "id": "doc-graph",
              "title": "Knowledge graph extraction",
              "text": (
                  "GraphRAG extracts entities and relationships from source text, "
                  "then organizes them into a knowledge graph for retrieval."
              ),
          },
          {
              "id": "doc-community",
              "title": "Community summaries",
              "text": (
                  "Graph communities summarize related entities so broad questions "
                  "can retrieve connected context instead of isolated chunks."
              ),
          },
          {
              "id": "doc-query",
              "title": "Query workflow",
              "text": (
                  "A query can combine lexical matches with graph neighbors to produce "
                  "deterministic local context before any language model is called."
              ),
          },
          {
              "id": "doc-production",
              "title": "Production indexing",
              "text": (
                  "Real GraphRAG indexing usually needs input data, model configuration, "
                  "and OpenAI, Azure OpenAI, or another LLM provider credential."
              ),
          },
      ]

      EDGES = [
          ("GraphRAG", "extracts", "entities"),
          ("GraphRAG", "extracts", "relationships"),
          ("entities", "form", "knowledge graph"),
          ("relationships", "form", "knowledge graph"),
          ("knowledge graph", "supports", "retrieval"),
          ("retrieval", "uses", "community summaries"),
          ("query", "expands_with", "graph neighbors"),
          ("production indexing", "requires", "provider credentials"),
      ]


      def tokenize(text):
          return set(re.findall(r"[a-z0-9]+", text.lower()))


      DOC_TOKENS = {
          document["id"]: tokenize(
              f"{document['title']} {document['text']}"
          )
          for document in DOCUMENTS
      }


      def run_demo(query):
          query_tokens = tokenize(query)
          scored = []

          for document in DOCUMENTS:
              matches = sorted(query_tokens & DOC_TOKENS[document["id"]])
              score = len(matches)
              if "graphrag" in query_tokens and "GraphRAG" in document["text"]:
                  score += 2
              if "graph" in query_tokens and "knowledge graph" in document["text"]:
                  score += 2
              scored.append((score, matches, document))

          scored.sort(key=lambda item: (-item[0], item[2]["id"]))
          best_score, matches, best_document = scored[0]
          neighbors = sorted(
              {
                  target
                  for source, _relation, target in EDGES
                  if source in {"GraphRAG", "knowledge graph", "retrieval"}
              }
          )

          return {
              "query": query,
              "selected_document": {
                  "id": best_document["id"],
                  "title": best_document["title"],
                  "score": best_score,
                  "matched_terms": matches,
              },
              "graph": {
                  "nodes": sorted({node for edge in EDGES for node in (edge[0], edge[2])}),
                  "edges": [
                      {"source": source, "relation": relation, "target": target}
                      for source, relation, target in EDGES
                  ],
                  "expanded_neighbors": neighbors,
              },
              "deterministic_answer": (
                  "The bundled demo ranks local documents, expands the GraphRAG node "
                  "through knowledge-graph relationships, and returns connected context "
                  "without calling an LLM provider."
              ),
          }


      def base_payload():
          return {
              "ok": IMPORT_ERROR is None,
              "service": "graphrag-demo",
              "title": os.environ.get("GRAPHRAG_DEMO_TITLE", "GraphRAG CPU demo"),
              "upstream": UPSTREAM,
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "package": PACKAGE,
              "external_calls": False,
              "credentials_used": False,
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "graphrag-demo/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              parsed = urlparse(self.path)

              if parsed.path in ("/", "/healthz"):
                  payload = base_payload()
                  payload["status"] = "ready" if IMPORT_ERROR is None else "import_failed"
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              if parsed.path == "/demo":
                  query = parse_qs(parsed.query).get("q", [DEFAULT_QUERY])[0]
                  payload = base_payload()
                  payload["demo"] = run_demo(query)
                  if IMPORT_ERROR:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              if parsed.path == "/v1/models":
                  payload = {
                      "object": "list",
                      "data": [
                          {
                              "id": "graphrag-local-demo",
                              "object": "model",
                              "created": 0,
                              "owned_by": "microsoft/graphrag",
                              "metadata": {
                                  "package": PACKAGE,
                                  "llm_provider": "none",
                                  "external_calls": False,
                              },
                          }
                      ],
                  }
                  self.respond_json(200, payload)
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      port = int(os.environ.get("PORT", "8080"))
      server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
      print(f"GraphRAG demo server listening on 0.0.0.0:{port}", flush=True)
      server.serve_forever()
