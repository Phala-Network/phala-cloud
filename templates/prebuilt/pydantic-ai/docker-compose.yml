services:
  app:
    image: python:3.12-slim-bookworm
    ports:
      - "8080:8080"
    environment:
      - PYDANTIC_AI_VERSION=${PYDANTIC_AI_VERSION:-1.103.0}
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_NO_CACHE_DIR=1
      - PIP_ROOT_USER_ACTION=ignore
      - PORT=8080
      - PYTHONUNBUFFERED=1
    command:
      - /bin/sh
      - -lc
      - |
        python -m pip install --no-cache-dir "pydantic-ai-slim==$${PYDANTIC_AI_VERSION}"
        exec python /server.py
    configs:
      - source: server_py
        target: /server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

configs:
  server_py:
    content: |
      import importlib.metadata
      import json
      import os
      import platform
      import sys
      import time
      from dataclasses import dataclass
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from typing import Any
      from urllib.parse import parse_qs, urlparse

      STARTED_AT = time.time()
      IMPORT_ERROR = None
      PACKAGE = {}

      try:
          import pydantic_ai
          from pydantic import BaseModel, Field
          from pydantic_ai import Agent, RunContext, capture_run_messages, models
          from pydantic_ai.models.function import AgentInfo, FunctionModel
          from pydantic_ai import ModelMessage, ModelResponse, TextPart, ToolCallPart

          models.ALLOW_MODEL_REQUESTS = False
          PACKAGE = {
              "module": "pydantic_ai",
              "module_version": getattr(pydantic_ai, "__version__", "unknown"),
              "source_distribution": "pydantic-ai-slim",
              "distributions": {
                  "pydantic-ai-slim": importlib.metadata.version("pydantic-ai-slim"),
                  "pydantic": importlib.metadata.version("pydantic"),
              },
          }
      except Exception as exc:
          IMPORT_ERROR = f"{type(exc).__name__}: {exc}"


      def package_version(name):
          try:
              return importlib.metadata.version(name)
          except Exception as exc:
              return f"unavailable: {type(exc).__name__}: {exc}"


      def base_payload():
          return {
              "service": "pydantic-ai-local-agent-demo",
              "upstream": "https://github.com/pydantic/pydantic-ai",
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "package": PACKAGE,
              "package_versions": {
                  "pydantic-ai-slim": package_version("pydantic-ai-slim"),
                  "pydantic": package_version("pydantic"),
              },
          }


      if IMPORT_ERROR is None:
          @dataclass
          class DemoDeps:
              deployment_target: str
              baseline_score: int = 40


          class DemoOutput(BaseModel):
              framework: str
              summary: str
              deployment_target: str
              confidence: int = Field(ge=0, le=100)
              checks: list[str]


          DEMO_AGENT = Agent(
              deps_type=DemoDeps,
              output_type=DemoOutput,
              instructions="Return deterministic JSON for the Phala Cloud Pydantic AI smoke demo.",
              name="pydantic_ai_template_agent",
          )


          @DEMO_AGENT.instructions
          async def add_deployment_target(ctx: RunContext[DemoDeps]) -> str:
              return f"Deployment target: {ctx.deps.deployment_target}"


          @DEMO_AGENT.tool
          async def inspect_runtime(
              ctx: RunContext[DemoDeps],
              framework: str,
              include_cloud: bool,
          ) -> dict[str, Any]:
              checks = [
                  "typed agent",
                  "dependency injection",
                  "function tool",
                  "structured output",
              ]
              if include_cloud:
                  checks.append("cpu-only phala template")

              return {
                  "framework": framework,
                  "target": ctx.deps.deployment_target,
                  "score": ctx.deps.baseline_score + len(checks) * 10,
                  "checks": checks,
              }


          def deterministic_model(messages: list[ModelMessage], info: AgentInfo) -> ModelResponse:
              if len(messages) == 1:
                  tool_names = [tool.name for tool in info.function_tools]
                  if "inspect_runtime" not in tool_names:
                      return ModelResponse(
                          parts=[TextPart(json.dumps({
                              "framework": "pydantic-ai",
                              "summary": "Expected inspect_runtime tool was not registered.",
                              "deployment_target": "Phala Cloud tdx.small",
                              "confidence": 0,
                              "checks": tool_names,
                          }))],
                          model_name="pydantic-ai-local-function-model",
                      )

                  return ModelResponse(
                      parts=[ToolCallPart(
                          "inspect_runtime",
                          {"framework": "pydantic-ai", "include_cloud": True},
                      )],
                      model_name="pydantic-ai-local-function-model",
                  )

              tool_return = messages[-1].parts[0]
              report = getattr(tool_return, "content", {})
              if isinstance(report, str):
                  report = json.loads(report)

              payload = {
                  "framework": report["framework"],
                  "summary": (
                      "Pydantic AI agent primitives executed locally with a "
                      "deterministic FunctionModel."
                  ),
                  "deployment_target": report["target"],
                  "confidence": min(int(report["score"]), 100),
                  "checks": report["checks"],
              }
              return ModelResponse(
                  parts=[TextPart(json.dumps(payload))],
                  model_name="pydantic-ai-local-function-model",
              )


      DEFAULT_PROMPT = "Verify the template runtime without provider credentials."


      def safe_usage_dict(usage):
          if callable(usage):
              usage = usage()
          if hasattr(usage, "model_dump"):
              return {
                  key: value
                  for key, value in usage.model_dump().items()
                  if not key.startswith("_")
              }
          if hasattr(usage, "__dict__"):
              return {
                  key: value
                  for key, value in usage.__dict__.items()
                  if not key.startswith("_")
              }
          return {"repr": repr(usage)}


      def run_demo(prompt):
          if IMPORT_ERROR is not None:
              raise RuntimeError(IMPORT_ERROR)

          with capture_run_messages() as messages:
              result = DEMO_AGENT.run_sync(
                  prompt,
                  deps=DemoDeps("Phala Cloud tdx.small"),
                  model=FunctionModel(
                      deterministic_model,
                      model_name="pydantic-ai-local-function-model",
                  ),
              )

          return {
              "prompt": prompt,
              "model": "FunctionModel",
              "output": result.output.model_dump(),
              "usage": safe_usage_dict(result.usage),
              "captured_messages": [
                  {
                      "kind": type(message).__name__,
                      "parts": [
                          getattr(part, "part_kind", type(part).__name__)
                          for part in message.parts
                      ],
                  }
                  for message in messages
              ],
              "allow_model_requests": models.ALLOW_MODEL_REQUESTS,
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "pydantic-ai-demo/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              parsed = urlparse(self.path)
              path = parsed.path
              params = parse_qs(parsed.query)

              if path in ("/", "/healthz"):
                  payload = base_payload()
                  payload.update({
                      "ok": IMPORT_ERROR is None,
                      "status": "ready" if IMPORT_ERROR is None else "import_failed",
                      "credentials_required": False,
                      "remote_model_calls": False,
                      "model_downloaded": False,
                      "checks": [
                          "import pydantic_ai",
                          "from pydantic_ai import Agent, RunContext",
                          "from pydantic_ai.models.function import FunctionModel",
                          "models.ALLOW_MODEL_REQUESTS = False",
                      ],
                  })
                  if IMPORT_ERROR is not None:
                      payload["error"] = IMPORT_ERROR
                  self.respond_json(200 if IMPORT_ERROR is None else 500, payload)
                  return

              if path == "/demo":
                  payload = base_payload()
                  payload.update({
                      "ok": IMPORT_ERROR is None,
                      "cpu_only": True,
                      "credentials_required": False,
                      "remote_model_calls": False,
                      "model_downloaded": False,
                      "check": "Pydantic AI Agent with typed deps, tool call, FunctionModel, and structured output",
                  })
                  if IMPORT_ERROR is not None:
                      payload["error"] = IMPORT_ERROR
                      self.respond_json(500, payload)
                      return

                  prompt = params.get("prompt", [DEFAULT_PROMPT])[0][:300] or DEFAULT_PROMPT
                  try:
                      payload["demo"] = run_demo(prompt)
                  except Exception as exc:
                      payload["ok"] = False
                      payload["error"] = f"{type(exc).__name__}: {exc}"
                      self.respond_json(500, payload)
                      return

                  self.respond_json(200, payload)
                  return

              if path == "/v1/models":
                  payload = {
                      "object": "list",
                      "data": [
                          {
                              "id": "pydantic-ai-local-function-model",
                              "object": "model",
                              "created": 1704067200,
                              "owned_by": "pydantic-ai-template",
                              "description": (
                                  "Local deterministic Pydantic AI FunctionModel smoke endpoint; "
                                  "no hosted LLM or model weights are loaded."
                              ),
                          }
                      ],
                      "package_versions": base_payload()["package_versions"],
                  }
                  self.respond_json(200, payload)
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      def main():
          port = int(os.environ.get("PORT", "8080"))
          server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
          print(f"pydantic-ai demo listening on 0.0.0.0:{port}", flush=True)
          server.serve_forever()


      if __name__ == "__main__":
          main()
