services:
  app:
    build:
      context: .
      args:
        MARKITDOWN_PACKAGE_VERSION: ${MARKITDOWN_PACKAGE_VERSION:-0.1.6}
      dockerfile_inline: |
        FROM python:3.12-slim-bookworm
        ARG MARKITDOWN_PACKAGE_VERSION=0.1.6
        ENV PIP_DISABLE_PIP_VERSION_CHECK=1 \
            PIP_NO_CACHE_DIR=1 \
            PIP_ROOT_USER_ACTION=ignore \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONUNBUFFERED=1
        RUN python -m pip install --no-cache-dir --upgrade pip \
            && python -m pip install --no-cache-dir "markitdown[docx,xlsx,pptx,pdf]==$${MARKITDOWN_PACKAGE_VERSION}"
        RUN useradd --create-home --uid 10001 app
        WORKDIR /app
        USER app
        EXPOSE 8000
        CMD ["python", "/app/server.py"]
    image: phala-markitdown-demo:${MARKITDOWN_PACKAGE_VERSION:-0.1.6}
    pull_policy: build
    restart: unless-stopped
    init: true
    environment:
      APP_PORT: "8000"
      MARKITDOWN_PACKAGE_VERSION: ${MARKITDOWN_PACKAGE_VERSION:-0.1.6}
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    configs:
      - source: markitdown_demo_app
        target: /app/server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - internal

  proxy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "8080:80"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          encode zstd gzip
          header {
              X-Content-Type-Options "nosniff"
              Referrer-Policy "no-referrer"
              -Server
          }
          reverse_proxy app:8000
      }

  markitdown_demo_app:
    content: |
      import hashlib
      import importlib
      import importlib.metadata
      import io
      import json
      import os
      import platform
      import sys
      import tempfile
      import time
      import traceback
      import zipfile
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from pathlib import Path
      from urllib.parse import urlparse


      STARTED_AT = time.time()
      PACKAGE_NAME = "markitdown"
      UPSTREAM_REPO = "https://github.com/microsoft/markitdown"
      REQUESTED_VERSION = os.environ.get("MARKITDOWN_PACKAGE_VERSION", "0.1.6")


      def make_docx(path):
          files = {
              "[Content_Types].xml": """<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>""",
              "_rels/.rels": """<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>""",
              "word/document.xml": """<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>Quarterly demo memo</w:t></w:r></w:p><w:p><w:r><w:t>MarkItDown converts this DOCX locally.</w:t></w:r></w:p></w:body></w:document>""",
          }
          with zipfile.ZipFile(path, "w", zipfile.ZIP_DEFLATED) as archive:
              for name, content in files.items():
                  archive.writestr(name, content)


      def make_xlsx(path):
          from openpyxl import Workbook

          workbook = Workbook()
          sheet = workbook.active
          sheet.title = "Metrics"
          sheet.append(["metric", "value"])
          sheet.append(["documents", 4])
          sheet.append(["external_calls", 0])
          workbook.save(path)


      def make_pptx(path):
          from pptx import Presentation
          from pptx.util import Inches

          presentation = Presentation()
          slide = presentation.slides.add_slide(presentation.slide_layouts[5])
          slide.shapes.title.text = "MarkItDown demo deck"
          textbox = slide.shapes.add_textbox(Inches(1), Inches(2), Inches(8), Inches(1))
          textbox.text = "No hosted model provider calls are made."
          presentation.save(path)


      def markdown_text(result):
          return getattr(result, "markdown", getattr(result, "text_content", str(result)))


      def package_status():
          status = {
              "package": PACKAGE_NAME,
              "requested_version": REQUESTED_VERSION,
              "distribution_version": None,
              "module_version": None,
              "import_ok": False,
              "health_conversion_ok": False,
              "symbols": {},
              "converter_count": 0,
              "error": None,
          }
          try:
              markitdown = importlib.import_module("markitdown")
              status["distribution_version"] = importlib.metadata.version(PACKAGE_NAME)
              status["module_version"] = getattr(markitdown, "__version__", None)
              for symbol in (
                  "MarkItDown",
                  "DocumentConverterResult",
                  "StreamInfo",
                  "UnsupportedFormatException",
              ):
                  status["symbols"][symbol] = hasattr(markitdown, symbol)

              md = markitdown.MarkItDown(enable_plugins=False)
              status["converter_count"] = len(getattr(md, "_converters", []))
              stream = io.BytesIO(b"MarkItDown health check\n")
              stream_info = markitdown.StreamInfo(
                  extension=".txt",
                  mimetype="text/plain",
                  charset="utf-8",
                  filename="health.txt",
              )
              converted = markdown_text(md.convert_stream(stream, stream_info=stream_info))
              status["health_conversion_ok"] = "MarkItDown health check" in converted
              status["import_ok"] = (
                  bool(status["distribution_version"])
                  and all(status["symbols"].values())
                  and status["health_conversion_ok"]
              )
          except Exception as exc:
              status["error"] = f"{type(exc).__name__}: {exc}"
          return status


      PACKAGE_STATUS = package_status()


      def base_payload():
          return {
              "service": "markitdown-local-converter-demo",
              "upstream": UPSTREAM_REPO,
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "markitdown": PACKAGE_STATUS,
          }


      def convert_file(md, path, expected_text):
          result = md.convert_local(path)
          markdown = markdown_text(result)
          source = Path(path).read_bytes()
          return {
              "file": Path(path).name,
              "source_bytes": len(source),
              "source_sha256": hashlib.sha256(source).hexdigest(),
              "markdown_chars": len(markdown),
              "contains_expected_text": expected_text in markdown,
              "markdown_preview": markdown[:500],
          }


      def run_demo():
          if not PACKAGE_STATUS["import_ok"]:
              raise RuntimeError(PACKAGE_STATUS["error"] or "markitdown import failed")

          markitdown = importlib.import_module("markitdown")
          md = markitdown.MarkItDown(enable_plugins=False)
          with tempfile.TemporaryDirectory() as tmpdir:
              root = Path(tmpdir)
              html = root / "sample.html"
              csv = root / "sample.csv"
              docx = root / "sample.docx"
              xlsx = root / "sample.xlsx"
              pptx = root / "sample.pptx"

              html.write_text(
                  "<html><body><h1>Demo Brief</h1><p>HTML converted locally.</p></body></html>",
                  encoding="utf-8",
              )
              csv.write_text("name,score\nalpha,1\nbeta,2\n", encoding="utf-8")
              make_docx(docx)
              make_xlsx(xlsx)
              make_pptx(pptx)

              conversions = {
                  "html": convert_file(md, html, "Demo Brief"),
                  "csv": convert_file(md, csv, "alpha"),
                  "docx": convert_file(md, docx, "Quarterly demo memo"),
                  "xlsx": convert_file(md, xlsx, "documents"),
                  "pptx": convert_file(md, pptx, "MarkItDown demo deck"),
              }

          return {
              "ok": all(item["contains_expected_text"] for item in conversions.values()),
              "cpu_only": True,
              "credentials_required": False,
              "hosted_model_call_attempted": False,
              "remote_url_conversion_attempted": False,
              "plugins_enabled": False,
              "azure_document_intelligence_used": False,
              "azure_content_understanding_used": False,
              "formats": conversions,
          }


      def response_body(path):
          if path == "/healthz":
              status = HTTPStatus.OK if PACKAGE_STATUS["import_ok"] else HTTPStatus.SERVICE_UNAVAILABLE
              payload = base_payload()
              payload["status"] = "ok" if PACKAGE_STATUS["import_ok"] else "unhealthy"
              return status, payload

          if path == "/demo":
              payload = base_payload()
              try:
                  payload["demo"] = run_demo()
                  payload["ok"] = payload["demo"]["ok"]
                  return HTTPStatus.OK if payload["ok"] else HTTPStatus.INTERNAL_SERVER_ERROR, payload
              except Exception as exc:
                  payload.update(
                      {
                          "ok": False,
                          "error": f"{type(exc).__name__}: {exc}",
                          "traceback": traceback.format_exc(limit=3),
                      }
                  )
                  return HTTPStatus.INTERNAL_SERVER_ERROR, payload

          if path == "/v1/models":
              return HTTPStatus.OK, {
                  "object": "list",
                  "data": [
                      {
                          "id": "markitdown/local-converter",
                          "object": "model",
                          "created": 0,
                          "owned_by": "microsoft",
                          "description": (
                              "Metadata endpoint for the local MarkItDown converter demo. "
                              "It does not host or call an LLM model."
                          ),
                      }
                  ],
              }

          if path == "/upstream":
              payload = base_payload()
              payload.update(
                  {
                      "package_index": "https://pypi.org/project/markitdown/",
                      "icon_source": "GitHub owner avatar fallback: https://github.com/microsoft.png",
                      "endpoints": ["/healthz", "/demo", "/v1/models", "/upstream"],
                      "default_extras": ["docx", "xlsx", "pptx", "pdf"],
                  }
              )
              return HTTPStatus.OK, payload

          if path == "/":
              return HTTPStatus.OK, {
                  "service": "markitdown-local-converter-demo",
                  "endpoints": ["/healthz", "/demo", "/v1/models", "/upstream"],
                  "credentials_required": False,
                  "hosted_model_call_attempted": False,
              }

          return HTTPStatus.NOT_FOUND, {
              "error": "not_found",
              "endpoints": ["/healthz", "/demo", "/v1/models", "/upstream"],
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "markitdown-demo"

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      }
                  ),
                  flush=True,
              )

          def do_GET(self):
              path = urlparse(self.path).path.rstrip("/") or "/"
              status, payload = response_body(path)
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_POST(self):
              self.send_response(HTTPStatus.METHOD_NOT_ALLOWED)
              self.send_header("Allow", "GET")
              self.end_headers()


      if __name__ == "__main__":
          port = int(os.environ.get("APP_PORT", "8000"))
          print(
              json.dumps(
                  {
                      "event": "startup",
                      "port": port,
                      "markitdown": PACKAGE_STATUS,
                      "credentials_required": False,
                      "hosted_model_call_attempted": False,
                  }
              ),
              flush=True,
          )
          ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()

networks:
  internal:
    driver: bridge
