services:
  genkit:
    image: node:22-bookworm-slim
    container_name: genkit
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
      PORT: "8000"
    ports:
      - "18080:8000"
    command:
      - sh
      - -lc
      - |
        set -eu

        cat > package.json <<'JSON'
        {
          "name": "phala-genkit-demo",
          "private": true,
          "type": "module",
          "scripts": {
            "start": "node server.mjs"
          },
          "dependencies": {
            "@genkit-ai/express": "1.35.0",
            "express": "4.21.2",
            "genkit": "1.35.0"
          }
        }
        JSON

        cat > server.mjs <<'NODE'
        import express from 'express';
        import { expressHandler } from '@genkit-ai/express';
        import { genkit, z } from 'genkit';

        const PORT = Number(process.env.PORT || '8000');
        const HOST = '0.0.0.0';
        const GENKIT_VERSION = '1.35.0';
        const ai = genkit({ name: 'phala-genkit-demo' });

        const normalizeTopic = (value) => {
          const topic = typeof value === 'string' ? value.trim() : '';
          return topic.length > 0 ? topic.slice(0, 160) : 'phala cloud genkit';
        };

        const scoreTopic = ai.defineTool(
          {
            name: 'scoreTopic',
            description: 'Scores topic text deterministically without calling an external model.',
            inputSchema: z.object({
              topic: z.string().optional()
            }),
            outputSchema: z.object({
              words: z.array(z.string()),
              wordCount: z.number(),
              characterCount: z.number(),
              checksum: z.number()
            })
          },
          async ({ topic }) => {
            const text = normalizeTopic(topic);
            const words = text.toLowerCase().match(/[a-z0-9]+/g) || [];
            const checksum = Array.from(text).reduce(
              (total, character) => (total + character.charCodeAt(0)) % 9973,
              0
            );

            return {
              words,
              wordCount: words.length,
              characterCount: text.length,
              checksum
            };
          }
        );

        const demoFlow = ai.defineFlow(
          {
            name: 'localDemoFlow',
            inputSchema: z.object({
              topic: z.string().optional()
            }),
            outputSchema: z.object({
              framework: z.literal('Genkit'),
              mode: z.string(),
              input: z.string(),
              message: z.string(),
              tool: z.object({
                words: z.array(z.string()),
                wordCount: z.number(),
                characterCount: z.number(),
                checksum: z.number()
              }),
              endpoints: z.array(z.string())
            })
          },
          async ({ topic }) => {
            const input = normalizeTopic(topic);
            const tool = await scoreTopic({ topic: input });

            return {
              framework: 'Genkit',
              mode: 'local-deterministic-no-provider',
              input,
              message:
                'Genkit flow ran locally without LLM credentials. Deterministic checksum ' +
                String(tool.checksum) +
                ' was computed from ' +
                String(tool.wordCount) +
                ' words.',
              tool,
              endpoints: ['/healthz', '/demo', '/v1/models', '/flows/localDemoFlow']
            };
          }
        );

        const app = express();
        app.disable('x-powered-by');
        app.use(express.json({ limit: '64kb' }));

        app.get('/', (_request, response) => {
          response.json({
            name: 'Phala Genkit demo',
            upstream: 'https://github.com/genkit-ai/genkit',
            endpoints: ['/healthz', '/demo', '/v1/models', '/flows/localDemoFlow']
          });
        });

        app.get('/healthz', async (_request, response) => {
          try {
            const [genkitModule, expressModule] = await Promise.all([
              import('genkit'),
              import('@genkit-ai/express')
            ]);

            response.json({
              status: 'ok',
              imports: {
                genkit: typeof genkitModule.genkit === 'function',
                genkitZod: typeof genkitModule.z.object === 'function',
                genkitExpress: typeof expressModule.expressHandler === 'function'
              },
              packages: {
                genkit: GENKIT_VERSION,
                '@genkit-ai/express': GENKIT_VERSION
              }
            });
          } catch (error) {
            response.status(500).json({
              status: 'error',
              message: error instanceof Error ? error.message : String(error)
            });
          }
        });

        app.get('/v1/models', (_request, response) => {
          response.json({
            object: 'list',
            data: [
              {
                id: 'local-deterministic-flow',
                object: 'model',
                created: 0,
                owned_by: 'phala-template',
                provider: 'none',
                capabilities: ['genkit-flow', 'genkit-tool', 'no-llm-credentials']
              }
            ]
          });
        });

        app.get('/demo', async (request, response, next) => {
          try {
            const result = await demoFlow({ topic: request.query.topic });
            response.json(result);
          } catch (error) {
            next(error);
          }
        });

        app.post('/demo', async (request, response, next) => {
          try {
            const result = await demoFlow({ topic: request.body?.topic });
            response.json(result);
          } catch (error) {
            next(error);
          }
        });

        app.post('/flows/localDemoFlow', expressHandler(demoFlow));

        app.use((request, response) => {
          response.status(404).json({
            error: 'not_found',
            path: request.path,
            endpoints: ['/healthz', '/demo', '/v1/models', '/flows/localDemoFlow']
          });
        });

        app.use((error, _request, response, _next) => {
          response.status(500).json({
            error: 'internal_error',
            message: error instanceof Error ? error.message : String(error)
          });
        });

        app.listen(PORT, HOST, () => {
          console.log('Genkit demo listening on port ' + String(PORT));
        });
        NODE

        npm install --omit=dev --no-audit --no-fund
        exec node server.mjs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
