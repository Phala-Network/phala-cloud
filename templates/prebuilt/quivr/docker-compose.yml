services:
  app:
    image: python:3.12-slim-bookworm
    ports:
      - "8000:8000"
    environment:
      QUIVR_UPSTREAM: "https://github.com/QuivrHQ/quivr"
      QUIVR_REF_NAME: "main"
      QUIVR_REF: "947a785415c6c35ab2ae8157222b4720b0710b4d"
      QUIVR_LATEST_RELEASE: "core-0.0.33"
      QUIVR_LATEST_RELEASE_PUBLISHED_AT: "2025-02-04T10:18:50Z"
      VERIFY_TIMEOUT_SECONDS: "15"
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - /server.py
    configs:
      - source: server_py
        target: /server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

configs:
  server_py:
    content: |
      import hashlib
      import json
      import os
      import platform
      import sys
      import threading
      import time
      import urllib.error
      import urllib.parse
      import urllib.request
      from datetime import datetime, timezone
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      STARTED_AT = time.time()
      SERVICE = "quivr-source-runtime-verifier"
      UPSTREAM = os.environ.get("QUIVR_UPSTREAM", "https://github.com/QuivrHQ/quivr")
      REF_NAME = os.environ.get("QUIVR_REF_NAME", "main")
      REF = os.environ.get("QUIVR_REF", "947a785415c6c35ab2ae8157222b4720b0710b4d")
      LATEST_RELEASE = os.environ.get("QUIVR_LATEST_RELEASE", "core-0.0.33")
      LATEST_RELEASE_PUBLISHED_AT = os.environ.get("QUIVR_LATEST_RELEASE_PUBLISHED_AT", "2025-02-04T10:18:50Z")
      TIMEOUT_SECONDS = float(os.environ.get("VERIFY_TIMEOUT_SECONDS", "15"))

      FILES = [
          {
              "path": "README.md",
              "sha256": "2f0bf20867dd76414c7bca04ec1642bbee8ea314edae70998985426412d0c878",
              "checks": [
                  ("second_brain_positioning", "Your Second Brain"),
                  ("quivr_core_install", "pip install quivr-core"),
                  ("rag_description", "Opiniated RAG"),
                  ("provider_support", "OpenAI, Anthropic, Mistral"),
                  ("ollama_support", "Ollama"),
              ],
          },
          {
              "path": "core/pyproject.toml",
              "sha256": "2d51bb743b37880bd0ac6f3818543cfdad70c59ed9cb57fee28af3ac63455377",
              "checks": [
                  ("package_name", 'name = "quivr-core"'),
                  ("package_version", 'version = "0.0.33"'),
                  ("python_requires", 'requires-python = ">= 3.11"'),
                  ("langchain_dependency", '"langchain>=0.3.9,<0.4"'),
                  ("faiss_cpu_dependency", '"faiss-cpu>=1.8.0.post1"'),
                  ("openai_dependency", '"langchain-openai>=0.3.0"'),
                  ("anthropic_dependency", '"langchain-anthropic>=0.1.23"'),
                  ("mistral_dependency", '"langchain-mistralai>=0.2.3"'),
                  ("google_dependency", '"langchain-google-genai>=2.1.3"'),
              ],
          },
          {
              "path": "docs/docs/quickstart.md",
              "sha256": "0fd0ac934e0f22866897299012ae15b698aaa24f3e325e9e15ce8cc52f569836",
              "checks": [
                  ("api_keys_step", "Add your API Keys"),
                  ("openai_env_example", "OPENAI_API_KEY"),
                  ("provider_support", "supports APIs from Anthropic, OpenAI, and Mistral"),
                  ("ollama_support", "Ollama"),
                  ("brain_from_files", "Brain.from_files"),
              ],
          },
          {
              "path": "core/quivr_core/brain/brain_defaults.py",
              "sha256": "1e88f1eef65025f583c89bf4b5044c8fc4c055f58638cd73139f53dbe35dc086",
              "checks": [
                  ("default_faiss_vector_store", "FAISS.afrom_documents"),
                  ("default_openai_embeddings", "OpenAIEmbeddings"),
                  ("default_llm_supplier", "DefaultModelSuppliers.OPENAI"),
                  ("default_llm_model", 'model="gpt-4o"'),
              ],
          },
          {
              "path": "examples/chatbot/README.md",
              "sha256": "8a5d56808e64b559899285eb034a062231f97a9127e8b7f7d64119c83c4c2286",
              "checks": [
                  ("chainlit_example", "Chainlit"),
                  ("requires_openai_key", "export OPENAI_API_KEY"),
                  ("upload_text_file", "upload a text file"),
              ],
          },
      ]

      VERIFY_LOCK = threading.Lock()
      VERIFY_RESULT = {
          "status": "starting",
          "ok": None,
          "message": "verification has not completed yet",
      }


      def iso_now():
          return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


      def set_result(result):
          global VERIFY_RESULT
          with VERIFY_LOCK:
              VERIFY_RESULT = result


      def get_result():
          with VERIFY_LOCK:
              return json.loads(json.dumps(VERIFY_RESULT))


      def raw_url(path):
          quoted_path = urllib.parse.quote(path, safe="/")
          return f"https://raw.githubusercontent.com/QuivrHQ/quivr/{REF}/{quoted_path}"


      def fetch_bytes(url):
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "phala-quivr-template-verifier/1.0"},
          )
          with urllib.request.urlopen(request, timeout=TIMEOUT_SECONDS) as response:
              return response.read()


      def verify_file(spec):
          url = raw_url(spec["path"])
          item = {
              "path": spec["path"],
              "url": url,
              "expected_sha256": spec["sha256"],
          }
          try:
              body = fetch_bytes(url)
              text = body.decode("utf-8", errors="replace")
              actual = hashlib.sha256(body).hexdigest()
              checks = []
              checks_ok = True
              for name, needle in spec.get("checks", []):
                  ok = needle in text
                  checks.append({"name": name, "ok": ok})
                  checks_ok = checks_ok and ok

              item.update({
                  "ok": actual == spec["sha256"] and checks_ok,
                  "bytes": len(body),
                  "sha256": actual,
                  "sha256_ok": actual == spec["sha256"],
                  "checks": checks,
              })
          except (urllib.error.URLError, TimeoutError, OSError) as exc:
              item.update({
                  "ok": False,
                  "error": f"{type(exc).__name__}: {exc}",
              })
          return item


      def verify_upstream():
          set_result({
              "status": "running",
              "ok": None,
              "started_at": iso_now(),
              "ref": REF,
              "ref_name": REF_NAME,
          })

          files = [verify_file(spec) for spec in FILES]
          files_ok = all(item.get("ok") is True for item in files)
          runtime = {
              "python": sys.version.split()[0],
              "implementation": platform.python_implementation(),
              "platform": platform.platform(),
              "quivr_requires_python": ">= 3.11",
              "compatible_with_upstream_range": sys.version_info[:2] >= (3, 11),
          }

          result = {
              "status": "complete",
              "ok": files_ok and runtime["compatible_with_upstream_range"],
              "verified_at": iso_now(),
              "upstream": UPSTREAM,
              "ref_name": REF_NAME,
              "ref": REF,
              "source_url": f"{UPSTREAM}/tree/{REF}",
              "latest_release": LATEST_RELEASE,
              "latest_release_published_at": LATEST_RELEASE_PUBLISHED_AT,
              "latest_release_url": f"{UPSTREAM}/releases/tag/{LATEST_RELEASE}",
              "runtime": runtime,
              "files": files,
              "upstream_characteristics": {
                  "project_shape": "quivr-core Python RAG package with docs and Chainlit examples",
                  "root_docker_compose_present": False,
                  "default_vector_store": "FAISS CPU",
                  "default_embedder": "OpenAIEmbeddings",
                  "default_llm": "OpenAI gpt-4o",
                  "documented_providers": ["OpenAI", "Anthropic", "Mistral", "Ollama"],
                  "example_ui": "Chainlit chatbot example",
              },
              "template_mode": "cpu-safe source/runtime verifier demo",
              "limitations": [
                  "quivr-core is not installed in this container",
                  "no Chainlit UI is started",
                  "no documents are uploaded, parsed, embedded, indexed, or stored",
                  "no vector database or managed database service is started",
                  "no LLM, embedding provider, reranker, or local Ollama runtime is called",
                  "no model weights or tokenizer assets are downloaded",
              ],
              "full_stack_started": False,
              "model_weights_downloaded": False,
              "provider_credentials_required": False,
              "gpu_required": False,
              "safe_for_tdx_small_smoke": True,
          }
          set_result(result)


      def start_verifier():
          thread = threading.Thread(target=verify_upstream, name="verify-upstream", daemon=True)
          thread.start()


      def base_payload():
          return {
              "service": SERVICE,
              "ok": True,
              "status": "ready",
              "upstream": UPSTREAM,
              "ref_name": REF_NAME,
              "ref": REF,
              "template_mode": "cpu-safe source/runtime verifier demo",
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "quivr-verifier/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              path = urllib.parse.urlparse(self.path).path

              if path in ("/", "/healthz"):
                  payload = base_payload()
                  payload["verifier"] = get_result()
                  self.respond_json(200, payload)
                  return

              if path == "/demo":
                  payload = base_payload()
                  payload.update({
                      "verifier": get_result(),
                      "demo": {
                          "mode": "cpu-safe Quivr source and runtime verifier",
                          "full_stack_started": False,
                          "model_weights_downloaded": False,
                          "gpu_required": False,
                          "provider_credentials_required": False,
                          "safe_for_tdx_small_smoke": True,
                          "limitations": [
                              "This template verifies pinned upstream source facts only.",
                              "It does not run the Quivr RAG package, Chainlit example, LLM calls, embeddings, reranking, or document ingestion.",
                              "Use the upstream repository and configure provider keys or local model runtimes for production Quivr.",
                          ],
                      },
                  })
                  self.respond_json(200, payload)
                  return

              if path == "/v1/models":
                  payload = {
                      "object": "list",
                      "data": [],
                      "template_mode": "cpu-safe source/runtime verifier demo",
                      "reason": "No Quivr model runtime, provider-backed LLM, embedding service, or local inference server is started by this template.",
                      "source_ok": get_result().get("ok"),
                  }
                  self.respond_json(200, payload)
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      if __name__ == "__main__":
          start_verifier()
          server = ThreadingHTTPServer(("0.0.0.0", 8000), Handler)
          print(f"{SERVICE} listening on 0.0.0.0:8000", flush=True)
          server.serve_forever()
