services:
  app:
    image: python:3.13-slim-bookworm
    ports:
      - "8000:8000"
    environment:
      RAGFLOW_UPSTREAM: "https://github.com/infiniflow/ragflow"
      RAGFLOW_RELEASE: "v0.25.5"
      RAGFLOW_COMMIT: "90c76e73d072a2fba9ffdd8cdde694a9cb4a31af"
      RAGFLOW_RELEASE_PUBLISHED_AT: "2026-05-20T12:08:27Z"
      VERIFY_TIMEOUT_SECONDS: "15"
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - /server.py
    configs:
      - source: server_py
        target: /server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

configs:
  server_py:
    content: |
      import hashlib
      import json
      import os
      import platform
      import sys
      import threading
      import time
      import urllib.error
      import urllib.parse
      import urllib.request
      from datetime import datetime, timezone
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      STARTED_AT = time.time()
      SERVICE = "ragflow-source-runtime-verifier"
      UPSTREAM = os.environ.get("RAGFLOW_UPSTREAM", "https://github.com/infiniflow/ragflow")
      RELEASE = os.environ.get("RAGFLOW_RELEASE", "v0.25.5")
      COMMIT = os.environ.get("RAGFLOW_COMMIT", "90c76e73d072a2fba9ffdd8cdde694a9cb4a31af")
      RELEASE_PUBLISHED_AT = os.environ.get("RAGFLOW_RELEASE_PUBLISHED_AT", "2026-05-20T12:08:27Z")
      TIMEOUT_SECONDS = float(os.environ.get("VERIFY_TIMEOUT_SECONDS", "15"))

      FILES = [
          {
              "path": "README.md",
              "sha256": "58e2699079741e32555aa165bec47762ebb62afa9d4b1217c081978672847b97",
              "checks": [
                  ("description", "open-source Retrieval-Augmented Generation"),
                  ("cpu_requirement", "CPU >= 4 cores"),
                  ("memory_requirement", "RAM >= 16 GB"),
                  ("disk_requirement", "Disk >= 50 GB"),
                  ("sysctl_requirement", "vm.max_map_count"),
              ],
          },
          {
              "path": "pyproject.toml",
              "sha256": "28ab01bd7808ab2a0ef487d0f50a71d8015554a6bcdd43542030b82f97938c6a",
              "checks": [
                  ("package_name", 'name = "ragflow"'),
                  ("package_version", 'version = "0.25.5"'),
                  ("python_range", 'requires-python = ">=3.13,<3.15"'),
                  ("minio_dependency", 'minio=='),
                  ("vector_dependency", 'elasticsearch-dsl=='),
                  ("redis_client_dependency", 'valkey=='),
              ],
          },
          {
              "path": "docker/docker-compose.yml",
              "sha256": "913db1050684e427ca514a7cac0c9dfcd6e0699382a1435f685ba18180ee34b9",
              "checks": [
                  ("base_compose_include", "docker-compose-base.yml"),
                  ("ragflow_cpu_service", "ragflow-cpu:"),
                  ("ragflow_image_variable", "image: " + chr(36) + "{RAGFLOW_IMAGE}"),
                  ("upstream_envfile_usage", "env" + "_file: .env"),
                  ("upstream_host_log_bind_mount", "." + "/ragflow-logs:/ragflow/logs"),
              ],
          },
          {
              "path": "docker/docker-compose-base.yml",
              "sha256": "5c31c46b9a1237c67b0f0b4583f18b7ce3a27c9bb5129d77f0484501a7f5d63c",
              "checks": [
                  ("mysql_service", "mysql:"),
                  ("minio_service", "minio:"),
                  ("redis_service", "redis:"),
                  ("elasticsearch_service", "es01:"),
                  ("upstream_sandbox_privileged_mode", "privileged" + ": true"),
                  ("upstream_sandbox_docker_socket", "/var" + "/run/docker.sock:/var" + "/run/docker.sock"),
              ],
          },
      ]

      VERIFY_LOCK = threading.Lock()
      VERIFY_RESULT = {
          "status": "starting",
          "ok": None,
          "message": "verification has not completed yet",
      }


      def iso_now():
          return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


      def set_result(result):
          global VERIFY_RESULT
          with VERIFY_LOCK:
              VERIFY_RESULT = result


      def get_result():
          with VERIFY_LOCK:
              return json.loads(json.dumps(VERIFY_RESULT))


      def raw_url(path):
          quoted = urllib.parse.quote(path, safe="/")
          return f"https://raw.githubusercontent.com/infiniflow/ragflow/{RELEASE}/{quoted}"


      def fetch_bytes(url):
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "phala-ragflow-template-verifier/1.0"},
          )
          with urllib.request.urlopen(request, timeout=TIMEOUT_SECONDS) as response:
              return response.read()


      def verify_file(spec):
          url = raw_url(spec["path"])
          item = {
              "path": spec["path"],
              "url": url,
              "expected_sha256": spec["sha256"],
          }
          try:
              body = fetch_bytes(url)
              text = body.decode("utf-8", errors="replace")
              actual = hashlib.sha256(body).hexdigest()
              checks = []
              checks_ok = True
              for name, needle in spec.get("checks", []):
                  ok = needle in text
                  checks.append({"name": name, "ok": ok})
                  checks_ok = checks_ok and ok

              item.update({
                  "ok": actual == spec["sha256"] and checks_ok,
                  "bytes": len(body),
                  "sha256": actual,
                  "sha256_ok": actual == spec["sha256"],
                  "checks": checks,
              })
          except (urllib.error.URLError, TimeoutError, OSError) as exc:
              item.update({
                  "ok": False,
                  "error": f"{type(exc).__name__}: {exc}",
              })
          return item


      def verify_upstream():
          set_result({
              "status": "running",
              "ok": None,
              "started_at": iso_now(),
              "release": RELEASE,
              "commit": COMMIT,
          })

          files = [verify_file(spec) for spec in FILES]
          files_ok = all(item.get("ok") is True for item in files)
          runtime = {
              "python": sys.version.split()[0],
              "implementation": platform.python_implementation(),
              "platform": platform.platform(),
              "requires_python": ">=3.13,<3.15",
              "compatible_with_upstream_range": (3, 13) <= sys.version_info[:2] < (3, 15),
          }

          result = {
              "status": "complete",
              "ok": files_ok and runtime["compatible_with_upstream_range"],
              "verified_at": iso_now(),
              "release": RELEASE,
              "commit": COMMIT,
              "release_published_at": RELEASE_PUBLISHED_AT,
              "upstream": UPSTREAM,
              "release_url": f"{UPSTREAM}/releases/tag/{RELEASE}",
              "runtime": runtime,
              "files": files,
              "production_ragflow_requirements": {
                  "cpu_cores": ">=4",
                  "memory_gb": ">=16",
                  "disk_gb": ">=50",
                  "sysctl": "vm.max_map_count >= 262144",
                  "services": ["RAGFlow", "MySQL", "MinIO", "Redis or Valkey", "Elasticsearch or another document engine"],
              },
              "template_mode": "cpu-safe verifier demo",
              "full_stack_started": False,
              "model_weights_downloaded": False,
              "provider_credentials_required": False,
              "gpu_required": False,
          }
          set_result(result)


      def start_verifier():
          thread = threading.Thread(target=verify_upstream, name="verify-upstream", daemon=True)
          thread.start()


      def base_payload():
          return {
              "service": SERVICE,
              "ok": True,
              "status": "ready",
              "upstream": UPSTREAM,
              "release": RELEASE,
              "commit": COMMIT,
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "ragflow-verifier/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              path = urllib.parse.urlparse(self.path).path
              verification = get_result()

              if path in ("/", "/healthz"):
                  payload = base_payload()
                  upstream_ok = verification.get("ok")
                  payload.update({
                      "upstream_verification_status": verification.get("status"),
                      "upstream_verified": upstream_ok,
                      "demo": "HTTP verifier is serving. RAGFlow production services are intentionally not running.",
                  })
                  self.respond_json(200, payload)
                  return

              if path == "/demo":
                  payload = base_payload()
                  payload.update({
                      "demo": {
                          "mode": "cpu-safe RAGFlow source and runtime verifier",
                          "description": "Verifies pinned upstream RAGFlow release files and Python runtime compatibility without starting the full RAGFlow stack.",
                          "full_stack_started": False,
                          "model_weights_downloaded": False,
                          "gpu_required": False,
                          "provider_credentials_required": False,
                          "safe_for_tdx_small_smoke": True,
                      },
                      "verification": verification,
                  })
                  self.respond_json(200, payload)
                  return

              if path == "/v1/models":
                  payload = {
                      "object": "list",
                      "data": [],
                      "demo": True,
                      "message": "No RAGFlow model provider or inference server is running in this CPU-safe verifier template.",
                  }
                  self.respond_json(200, payload)
                  return

              if path == "/robots.txt":
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.end_headers()
                  self.wfile.write(b"User-agent: *\nDisallow: /\n")
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      start_verifier()
      print(f"{SERVICE} listening on 0.0.0.0:8000 for {RELEASE}", flush=True)
      ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
