services:
  app:
    image: python:3.12-slim-bookworm
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      TOLARIA_REF: ${TOLARIA_REF:-b92d0c7db24cab0461cd81f36c21511cff243c3d}
      TOLARIA_FETCH_TIMEOUT_SECONDS: ${TOLARIA_FETCH_TIMEOUT_SECONDS:-120}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - tolaria-source:/opt/tolaria
    configs:
      - source: tolaria_server
        target: /opt/tolaria-server/server.py
        mode: 0444
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        mkdir -p /opt/tolaria
        exec python /opt/tolaria-server/server.py
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, sys, urllib.request; port = os.environ.get('PORT', '8080'); response = urllib.request.urlopen('http://127.0.0.1:' + port + '/healthz', timeout=5); sys.exit(0 if response.status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    security_opt:
      - no-new-privileges:true

volumes:
  tolaria-source:

configs:
  tolaria_server:
    content: |
      import io
      import json
      import os
      import platform
      import re
      import shutil
      import sys
      import tarfile
      import time
      import urllib.parse
      import urllib.request
      from collections import Counter
      from datetime import datetime, timezone
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from pathlib import Path
      from urllib.parse import urlparse


      STARTED_AT = time.time()
      UPSTREAM = "https://github.com/refactoringhq/tolaria"
      DEFAULT_REF = "b92d0c7db24cab0461cd81f36c21511cff243c3d"
      ROOT = Path("/opt/tolaria")
      SOURCE_DIR = ROOT / "source"
      STATE_FILE = ROOT / "state.json"
      REF_FILE = ROOT / ".source-ref"
      PUBLIC_ENDPOINTS = ["/healthz", "/demo", "/v1/models", "/upstream"]

      REQUIRED_FILES = [
          "README.md",
          "package.json",
          "pnpm-lock.yaml",
          "src-tauri/tauri.conf.json",
          "src/assets/tolaria-icon.svg",
          "docs/GETTING-STARTED.md",
          "docs/ARCHITECTURE.md",
          "site/start/install.md",
          "site/start/first-launch.md",
          "demo-vault-v2/.fixture-manifest.json",
      ]

      RUNTIME_GUARDS = {
          "cpu_only": True,
          "credentials_required": False,
          "llm_provider_calls": False,
          "browser_auth_required": False,
          "model_downloaded": False,
          "model_loaded": False,
          "gpu_required": False,
          "host_mounts_required": False,
      }


      def log(event, **fields):
          print(json.dumps({"event": event, **fields}, sort_keys=True), flush=True)


      def current_ref():
          return os.environ.get("TOLARIA_REF", DEFAULT_REF).strip() or DEFAULT_REF


      def fetch_timeout():
          try:
              return max(5.0, float(os.environ.get("TOLARIA_FETCH_TIMEOUT_SECONDS", "120")))
          except ValueError:
              return 120.0


      def source_path(relative):
          return SOURCE_DIR / relative


      def read_text(relative, limit=None):
          data = source_path(relative).read_text(encoding="utf-8", errors="replace")
          if limit is not None:
              return data[:limit]
          return data


      def load_json(relative):
          return json.loads(read_text(relative))


      def source_is_ready(ref):
          return (
              REF_FILE.is_file()
              and REF_FILE.read_text(encoding="utf-8").strip() == ref
              and all(source_path(path).is_file() for path in REQUIRED_FILES)
          )


      def safe_extract(data, destination):
          tmp_dir = ROOT / ".source-tmp"
          shutil.rmtree(tmp_dir, ignore_errors=True)
          tmp_dir.mkdir(parents=True, exist_ok=True)
          top_dir = None

          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              for member in archive.getmembers():
                  parts = Path(member.name).parts
                  if len(parts) < 2:
                      if parts:
                          top_dir = top_dir or parts[0]
                      continue

                  top_dir = top_dir or parts[0]
                  relative = Path(*parts[1:])
                  if relative.is_absolute() or ".." in relative.parts:
                      raise RuntimeError(f"unsafe tar path: {member.name}")

                  target = tmp_dir / relative
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  elif member.isfile():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      src = archive.extractfile(member)
                      if src is None:
                          raise RuntimeError(f"cannot read tar member: {member.name}")
                      with src, open(target, "wb") as dst:
                          shutil.copyfileobj(src, dst)
                      if member.mode:
                          target.chmod(member.mode & 0o777)

          shutil.rmtree(destination, ignore_errors=True)
          tmp_dir.rename(destination)
          return top_dir


      def download_source(ref):
          encoded_ref = urllib.parse.quote(ref, safe="")
          url = f"https://api.github.com/repos/refactoringhq/tolaria/tarball/{encoded_ref}"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "phala-cloud-tolaria-template/1.0"},
          )
          started = time.time()
          log("download_source", ref=ref, url=url)
          with urllib.request.urlopen(request, timeout=fetch_timeout()) as response:
              data = response.read()
          top_dir = safe_extract(data, SOURCE_DIR)
          REF_FILE.write_text(ref + "\n", encoding="utf-8")
          return {
              "source_ref": ref,
              "source_url": url,
              "source_tree": top_dir,
              "downloaded_bytes": len(data),
              "download_seconds": round(time.time() - started, 3),
          }


      def bootstrap_source():
          ROOT.mkdir(parents=True, exist_ok=True)
          ref = current_ref()
          state = {}
          if STATE_FILE.is_file():
              try:
                  state = json.loads(STATE_FILE.read_text(encoding="utf-8"))
              except Exception:
                  state = {}

          if source_is_ready(ref):
              log("source_cached", ref=ref, source_dir=str(SOURCE_DIR))
              state.update({"source_ref": ref, "source_dir": str(SOURCE_DIR), "cached": True})
          else:
              state.update(download_source(ref))
              state["cached"] = False

          state.update(
              {
                  "upstream": UPSTREAM,
                  "source_dir": str(SOURCE_DIR),
                  "bootstrapped_at": datetime.now(timezone.utc).isoformat(),
                  "required_files": REQUIRED_FILES,
              }
          )
          STATE_FILE.write_text(json.dumps(state, indent=2, sort_keys=True), encoding="utf-8")
          log("bootstrap_complete", ref=ref, source_dir=str(SOURCE_DIR))
          return state


      def clean_markdown(value):
          value = re.sub(r"`([^`]+)`", r"\1", value)
          value = re.sub(r"\*\*([^*]+)\*\*", r"\1", value)
          value = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", value)
          value = re.sub(r"<[^>]+>", "", value)
          return value.strip(" -")


      def markdown_headings(markdown, limit=12):
          headings = []
          for line in markdown.splitlines():
              match = re.match(r"^(#{1,4})\s+(.+)$", line)
              if match:
                  headings.append({"level": len(match.group(1)), "text": clean_markdown(match.group(2))})
              if len(headings) >= limit:
                  break
          return headings


      def principle_names(readme):
          names = []
          for line in readme.splitlines():
              match = re.search(r"\*\*([^*]+)\*\*", line)
              if line.startswith("- ") and match:
                  names.append(clean_markdown(match.group(1)))
          return names[:12]


      def package_summary():
          package = load_json("package.json")
          dependencies = package.get("dependencies", {})
          dev_dependencies = package.get("devDependencies", {})
          selected_dependencies = [
              "@tauri-apps/api",
              "@blocknote/core",
              "@codemirror/lang-markdown",
              "react",
              "vite",
              "mermaid",
              "@modelcontextprotocol/sdk",
              "@anthropic-ai/sdk",
          ]
          selected_dev_dependencies = [
              "@tauri-apps/cli",
              "@playwright/test",
              "typescript",
              "vitest",
              "vitepress",
          ]
          script_names = [
              "dev",
              "build",
              "tauri",
              "docs:build",
              "playwright:smoke",
              "test",
          ]
          return {
              "name": package.get("name"),
              "version": package.get("version"),
              "license": package.get("license"),
              "type": package.get("type"),
              "private": package.get("private"),
              "scripts": {name: package.get("scripts", {}).get(name) for name in script_names},
              "dependencies": {
                  name: dependencies.get(name)
                  for name in selected_dependencies
                  if name in dependencies
              },
              "dev_dependencies": {
                  name: dev_dependencies.get(name)
                  for name in selected_dev_dependencies
                  if name in dev_dependencies
              },
              "pnpm_overrides_count": len(package.get("pnpm", {}).get("overrides", {})),
              "patched_dependencies_count": len(package.get("pnpm", {}).get("patchedDependencies", {})),
          }


      def tauri_summary():
          config = load_json("src-tauri/tauri.conf.json")
          windows = config.get("app", {}).get("windows", [])
          bundle = config.get("bundle", {})
          plugins = config.get("plugins", {})
          return {
              "product_name": config.get("productName"),
              "version": config.get("version"),
              "identifier": config.get("identifier"),
              "build": {
                  "dev_url": config.get("build", {}).get("devUrl"),
                  "before_dev_command": config.get("build", {}).get("beforeDevCommand"),
                  "before_build_command": config.get("build", {}).get("beforeBuildCommand"),
              },
              "window": windows[0] if windows else {},
              "bundle": {
                  "active": bundle.get("active"),
                  "targets": bundle.get("targets"),
                  "category": bundle.get("category"),
                  "icons": bundle.get("icon", []),
                  "resource_keys": sorted(bundle.get("resources", {}).keys()),
              },
              "deep_link_schemes": plugins.get("deep-link", {}).get("desktop", {}).get("schemes", []),
              "updater_configured": bool(plugins.get("updater", {}).get("endpoints")),
          }


      def parse_frontmatter(markdown):
          if not markdown.startswith("---\n"):
              return {}, markdown
          parts = markdown.split("---", 2)
          if len(parts) < 3:
              return {}, markdown
          fields = {}
          for line in parts[1].splitlines():
              match = re.match(r"^([A-Za-z0-9_-]+):\s*(.*)$", line)
              if match:
                  fields[match.group(1)] = match.group(2).strip().strip('"')
          return fields, parts[2]


      def first_heading(markdown):
          for line in markdown.splitlines():
              match = re.match(r"^#\s+(.+)$", line)
              if match:
                  return clean_markdown(match.group(1))
          return None


      def demo_vault_summary():
          vault = SOURCE_DIR / "demo-vault-v2"
          markdown_files = sorted(vault.rglob("*.md"))
          field_counter = Counter()
          type_counter = Counter()
          wikilinks = 0
          samples = []

          for path in markdown_files:
              relative = path.relative_to(SOURCE_DIR).as_posix()
              text = path.read_text(encoding="utf-8", errors="replace")
              fields, body = parse_frontmatter(text)
              field_counter.update(fields.keys())
              note_type = fields.get("type")
              if note_type:
                  type_counter.update([note_type])
              wikilinks += len(re.findall(r"\[\[([^\]]+)\]\]", text))
              if len(samples) < 6:
                  samples.append(
                      {
                          "path": relative,
                          "title": first_heading(body) or path.stem,
                          "frontmatter_keys": sorted(fields.keys()),
                          "bytes": path.stat().st_size,
                      }
                  )

          attachment_count = len([path for path in (vault / "attachments").rglob("*") if path.is_file()]) if (vault / "attachments").exists() else 0
          view_count = len(list((vault / "views").glob("*.yml"))) + len(list((vault / "views").glob("*.yaml"))) if (vault / "views").exists() else 0

          return {
              "path": "demo-vault-v2",
              "markdown_file_count": len(markdown_files),
              "type_document_count": len(list((vault / "type").glob("*.md"))) if (vault / "type").exists() else 0,
              "attachment_count": attachment_count,
              "saved_view_count": view_count,
              "wikilink_count": wikilinks,
              "frontmatter_keys": dict(field_counter.most_common(12)),
              "type_counts": dict(type_counter.most_common(12)),
              "sample_notes": samples,
          }


      def docs_summary():
          readme = read_text("README.md")
          getting_started = read_text("docs/GETTING-STARTED.md")
          architecture = read_text("docs/ARCHITECTURE.md")
          install = read_text("site/start/install.md")
          first_launch = read_text("site/start/first-launch.md")
          env_example = read_text(".env.example") if source_path(".env.example").exists() else ""
          env_names = []
          for line in env_example.splitlines():
              match = re.match(r"^([A-Z0-9_]+)=", line)
              if match:
                  env_names.append(match.group(1))

          return {
              "inspected": [
                  "README.md",
                  "docs/GETTING-STARTED.md",
                  "docs/ARCHITECTURE.md",
                  "site/start/install.md",
                  "site/start/first-launch.md",
                  "src-tauri/tauri.conf.json",
                  "package.json",
                  ".env.example",
              ],
              "readme_headings": markdown_headings(readme),
              "principles": principle_names(readme),
              "getting_started_mentions": {
                  "browser_mock_mode": "pnpm dev" in getting_started and "localhost:5173" in getting_started,
                  "tauri_dev": "pnpm tauri dev" in getting_started,
                  "linux_webkitgtk_dependencies": "webkit2gtk" in getting_started.lower(),
                  "git_cli_required": "git" in getting_started.lower(),
              },
              "architecture_markers": {
                  "filesystem_single_source_of_truth": "Filesystem as the single source of truth" in architecture,
                  "markdown_frontmatter": "YAML frontmatter" in architecture,
                  "git_integration": "Git" in architecture,
                  "ai_workspace": "AiWorkspace" in architecture,
              },
              "install_markers": {
                  "homebrew": "brew install --cask tolaria" in install,
                  "github_releases": "github.com/refactoringhq/tolaria/releases" in install,
                  "linux_builds": "Linux" in install,
              },
              "first_launch_markers": {
                  "getting_started_vault": "Getting Started vault" in first_launch,
                  "existing_local_vault": "existing local vault" in first_launch,
                  "empty_vault": "empty vault" in first_launch,
              },
              "upstream_env_placeholders": env_names,
          }


      def source_checks():
          required = {
              path: {
                  "exists": source_path(path).is_file(),
                  "bytes": source_path(path).stat().st_size if source_path(path).is_file() else 0,
              }
              for path in REQUIRED_FILES
          }
          package = package_summary()
          tauri = tauri_summary()
          vault = demo_vault_summary()
          checks = {
              "required_files": required,
              "package_name_is_tolaria": package.get("name") == "tolaria",
              "package_license_is_agpl": package.get("license") == "AGPL-3.0-or-later",
              "tauri_product_is_tolaria": tauri.get("product_name") == "Tolaria",
              "tauri_identifier_present": bool(tauri.get("identifier")),
              "browser_mock_script_present": package.get("scripts", {}).get("dev") == "vite",
              "tauri_script_present": package.get("scripts", {}).get("tauri") == "tauri",
              "upstream_icon_present": source_path("src/assets/tolaria-icon.svg").is_file(),
              "demo_vault_has_markdown": vault.get("markdown_file_count", 0) > 0,
          }
          ok = all(item["exists"] for item in required.values()) and all(
              value for key, value in checks.items() if key != "required_files"
          )
          return {"ok": ok, **checks}


      def load_state():
          if not STATE_FILE.is_file():
              return {}
          try:
              return json.loads(STATE_FILE.read_text(encoding="utf-8"))
          except Exception:
              return {}


      def base_payload():
          return {
              "service": "tolaria-source-verifier",
              "upstream": UPSTREAM,
              "source_ref": current_ref(),
              "state": load_state(),
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "endpoints": PUBLIC_ENDPOINTS,
              "runtime_guards": RUNTIME_GUARDS,
          }


      def demo_payload():
          return {
              "ok": True,
              "demo_type": "deterministic Tolaria source and demo-vault verifier",
              "description": (
                  "This endpoint inspects the real upstream Tolaria source artifact, "
                  "including its Tauri config, React package metadata, docs, and bundled "
                  "Markdown demo vault. It does not run the desktop app or call AI providers."
              ),
              "package": package_summary(),
              "tauri": tauri_summary(),
              "docs": docs_summary(),
              "demo_vault": demo_vault_summary(),
              "runtime_guards": RUNTIME_GUARDS,
          }


      def upstream_payload():
          return {
              "upstream_repository": UPSTREAM,
              "default_ref": DEFAULT_REF,
              "source_ref": current_ref(),
              "source_artifact": "GitHub repository tarball",
              "icon_source": "src/assets/tolaria-icon.svg",
              "inspected_runtime_docs": [
                  "README.md",
                  "docs/GETTING-STARTED.md",
                  "docs/ARCHITECTURE.md",
                  "site/start/install.md",
                  "site/start/first-launch.md",
                  "package.json",
                  "src-tauri/tauri.conf.json",
                  ".env.example",
              ],
              "production_notes": [
                  "Tolaria is a native Tauri desktop app for Markdown vaults, not an official containerized server.",
                  "Use upstream desktop releases or run pnpm tauri dev/build for full local filesystem and Git workflows.",
                  "The browser mock mode from pnpm dev is useful for development, but it is not a production web app.",
                  "AI agent and provider workflows should be configured on the desktop runtime with real user credentials.",
              ],
              "runtime_guards": RUNTIME_GUARDS,
          }


      BOOTSTRAP_ERROR = None
      try:
          BOOTSTRAP_STATE = bootstrap_source()
      except Exception as exc:
          BOOTSTRAP_STATE = {}
          BOOTSTRAP_ERROR = f"{type(exc).__name__}: {exc}"
          log("bootstrap_error", error=BOOTSTRAP_ERROR)


      class Handler(BaseHTTPRequestHandler):
          server_version = "tolaria-verifier/1.0"

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      }
                  ),
                  flush=True,
              )

          def respond_json(self, status, payload):
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              path = urlparse(self.path).path.rstrip("/") or "/"

              if path in ("/", "/healthz"):
                  payload = base_payload()
                  if BOOTSTRAP_ERROR:
                      payload.update({"ok": False, "status": "unhealthy", "error": BOOTSTRAP_ERROR})
                      self.respond_json(HTTPStatus.SERVICE_UNAVAILABLE, payload)
                      return

                  checks = source_checks()
                  payload.update(
                      {
                          "ok": checks["ok"],
                          "status": "ready" if checks["ok"] else "unhealthy",
                          "checks": checks,
                      }
                  )
                  self.respond_json(HTTPStatus.OK if checks["ok"] else HTTPStatus.SERVICE_UNAVAILABLE, payload)
                  return

              if path == "/demo":
                  if BOOTSTRAP_ERROR:
                      payload = base_payload()
                      payload.update({"ok": False, "error": BOOTSTRAP_ERROR})
                      self.respond_json(HTTPStatus.SERVICE_UNAVAILABLE, payload)
                      return
                  payload = base_payload()
                  payload.update(demo_payload())
                  self.respond_json(HTTPStatus.OK, payload)
                  return

              if path == "/v1/models":
                  self.respond_json(
                      HTTPStatus.OK,
                      {
                          "object": "list",
                          "data": [
                              {
                                  "id": "tolaria/local-source-verifier",
                                  "object": "model",
                                  "created": 0,
                                  "owned_by": "refactoringhq",
                                  "description": (
                                      "OpenAI-style metadata endpoint for the Tolaria "
                                      "source verifier. No LLM model is hosted or called."
                                  ),
                              }
                          ],
                          "runtime_guards": RUNTIME_GUARDS,
                      },
                  )
                  return

              if path == "/upstream":
                  payload = base_payload()
                  payload.update(upstream_payload())
                  self.respond_json(HTTPStatus.OK, payload)
                  return

              self.respond_json(
                  HTTPStatus.NOT_FOUND,
                  {
                      "error": "not_found",
                      "endpoints": PUBLIC_ENDPOINTS,
                  },
              )


      if __name__ == "__main__":
          port = int(os.environ.get("PORT", "8080"))
          log("startup", port=port, bootstrap_error=BOOTSTRAP_ERROR)
          ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()
