services:
  context7:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-alpine
        RUN npm install -g @upstash/context7-mcp@2.3.0
        USER node
        WORKDIR /home/node
        EXPOSE 3000
        CMD ["context7-mcp", "--transport", "http", "--port", "3000"]
    image: context7-mcp:2.3.0
    pull_policy: build
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      CONTEXT7_API_URL: ${CONTEXT7_API_URL:-https://context7.com/api}
      RESOURCE_URL: ${RESOURCE_URL:-https://mcp.context7.com}
      AUTH_SERVER_URL: ${AUTH_SERVER_URL:-https://context7.com}
    ports:
      - "18080:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/ping').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
