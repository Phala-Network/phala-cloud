services:
  app:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    environment:
      OPENMED_VERSION: ${OPENMED_VERSION:-1.5.5}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_ROOT_USER_ACTION: ignore
      PYTHONUNBUFFERED: "1"
      UV_SYSTEM_PYTHON: "1"
    configs:
      - source: openmed_demo_app
        target: /opt/openmed-demo/main.py
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        uv pip install --system --no-cache "openmed==$${OPENMED_VERSION}"
        exec python /opt/openmed-demo/main.py
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5); sys.exit(0 if response.status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - internal

  proxy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "8080:80"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          encode zstd gzip
          header {
              X-Content-Type-Options "nosniff"
              Referrer-Policy "no-referrer"
              -Server
          }
          reverse_proxy app:8000
      }

  openmed_demo_app:
    content: |
      import importlib.metadata
      import json
      import os
      import platform
      import re
      import sys
      import time
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import parse_qs, urlparse


      SERVICE = "openmed-local-verifier"
      UPSTREAM = "https://github.com/maziyarpanahi/openmed"
      STARTED_AT = time.time()
      REQUESTED_VERSION = os.environ.get("OPENMED_VERSION", "1.5.5")
      DEFAULT_TEXT = (
          "Patient email jane.doe@example.com, DOB 1970-01-15, "
          "phone (415) 555-2671, SSN 123-45-6789."
      )
      DEFAULT_MODEL_ALIASES = (
          "disease_detection_superclinical",
          "pharma_detection_superclinical",
          "pii_detection",
      )

      openmed = None


      def load_openmed():
          global openmed
          result = {
              "package": "openmed",
              "requested_version": REQUESTED_VERSION,
              "distribution_version": None,
              "module_version": None,
              "import_ok": False,
              "registry_ok": False,
              "model_count": 0,
              "category_count": 0,
              "pii_pattern_count": 0,
              "supported_languages": [],
              "error": None,
          }

          try:
              import openmed as module

              openmed = module
              result["distribution_version"] = importlib.metadata.version("openmed")
              result["module_version"] = getattr(module, "__version__", None)
              models = module.get_all_models()
              categories = module.list_model_categories()
              result["model_count"] = len(models)
              result["category_count"] = len(categories)
              result["pii_pattern_count"] = len(getattr(module, "PII_PATTERNS", []))
              result["supported_languages"] = sorted(getattr(module, "SUPPORTED_LANGUAGES", []))
              result["import_ok"] = True
              result["registry_ok"] = result["model_count"] > 0 and result["category_count"] > 0
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"

          return result


      IMPORT_STATUS = load_openmed()


      def base_payload():
          return {
              "service": SERVICE,
              "upstream": UPSTREAM,
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "openmed": IMPORT_STATUS,
              "cpu_only": True,
              "credentials_required": False,
              "model_weights_downloaded": False,
              "model_provider_calls": False,
          }


      def model_summary(alias):
          if openmed is None:
              return {"id": alias, "error": IMPORT_STATUS.get("error") or "openmed unavailable"}

          try:
              info = openmed.get_model_info(alias)
          except Exception as exc:
              return {"id": alias, "error": f"{type(exc).__name__}: {exc}"}

          if info is None:
              return {"id": alias, "error": "not found"}

          return {
              "id": info.model_id,
              "alias": alias,
              "display_name": info.display_name,
              "category": info.category,
              "specialization": info.specialization,
              "entity_types": list(info.entity_types),
              "size_category": info.size_category,
              "recommended_confidence": info.recommended_confidence,
              "metadata_only": True,
              "loaded": False,
          }


      def pattern_context_hit(pattern, text, start, end):
          context_words = [word.lower() for word in getattr(pattern, "context_words", [])]
          if not context_words:
              return False

          window = text[max(0, start - 72):min(len(text), end + 72)].lower()
          return any(word in window for word in context_words)


      def scan_pii_patterns(text, lang="en"):
          if openmed is None:
              raise RuntimeError(IMPORT_STATUS.get("error") or "openmed unavailable")

          try:
              patterns = openmed.get_patterns_for_language(lang)
          except Exception:
              patterns = getattr(openmed, "PII_PATTERNS", [])

          candidates = []
          for pattern in patterns:
              try:
                  matches = re.finditer(pattern.pattern, text, pattern.flags)
              except Exception:
                  continue

              for match in matches:
                  value = match.group(0)
                  validator = getattr(pattern, "validator", None)
                  validator_ok = None
                  if validator is not None:
                      try:
                          validator_ok = bool(validator(value))
                      except Exception:
                          validator_ok = False
                      if not validator_ok:
                          continue

                  has_context = pattern_context_hit(pattern, text, match.start(), match.end())
                  score = float(getattr(pattern, "base_score", 0.5))
                  if has_context:
                      score += float(getattr(pattern, "context_boost", 0.0))

                  candidates.append(
                      {
                          "text": value,
                          "entity_type": getattr(pattern, "entity_type", "pii").upper(),
                          "start": match.start(),
                          "end": match.end(),
                          "confidence": round(min(score, 0.99), 3),
                          "priority": int(getattr(pattern, "priority", 0)),
                          "context_boosted": has_context,
                          "validator_ok": validator_ok,
                      }
                  )

          selected = []
          occupied = []
          for item in sorted(
              candidates,
              key=lambda value: (
                  value["start"],
                  -value["confidence"],
                  -value["priority"],
                  -(value["end"] - value["start"]),
              ),
          ):
              overlaps = any(item["start"] < end and item["end"] > start for start, end in occupied)
              if overlaps:
                  continue
              selected.append(item)
              occupied.append((item["start"], item["end"]))

          redacted = text
          for item in sorted(selected, key=lambda value: value["start"], reverse=True):
              redacted = redacted[:item["start"]] + f"[{item['entity_type']}]" + redacted[item["end"]:]

          return {
              "language": lang,
              "input_text": text,
              "redacted_text": redacted,
              "entities": selected,
              "entity_count": len(selected),
              "method": "OpenMed bundled PII regex patterns and validators",
          }


      def run_demo(text=None, lang="en"):
          if openmed is None:
              raise RuntimeError(IMPORT_STATUS.get("error") or "openmed unavailable")

          input_text = (text or DEFAULT_TEXT).strip() or DEFAULT_TEXT
          normalized_text = openmed.preprocess_text(input_text)
          pii_scan = scan_pii_patterns(normalized_text, lang=lang)
          categories = openmed.list_model_categories()
          models = openmed.get_all_models()

          return {
              "name": "OpenMed CPU-safe local verifier",
              "description": (
                  "Imports the real OpenMed Python package, reads the bundled model registry, "
                  "and runs deterministic PII pattern checks without loading model weights."
              ),
              "sample_model_aliases": [model_summary(alias) for alias in DEFAULT_MODEL_ALIASES],
              "registry_summary": {
                  "model_count": len(models),
                  "categories": categories,
                  "supported_pii_languages": sorted(getattr(openmed, "SUPPORTED_LANGUAGES", [])),
              },
              "text_processing": {
                  "input_text": input_text,
                  "normalized_text": normalized_text,
              },
              "pii_pattern_demo": pii_scan,
              "not_performed": [
                  "No Hugging Face model download",
                  "No torch or GPU inference",
                  "No OpenMed analyze_text call",
                  "No OpenMed extract_pii or deidentify model-backed call",
                  "No external provider API call",
              ],
          }


      def response_for(path, query):
          if path in ("/", "/health", "/healthz"):
              payload = base_payload()
              payload["status"] = "ok" if IMPORT_STATUS["import_ok"] and IMPORT_STATUS["registry_ok"] else "unhealthy"
              payload["endpoints"] = ["/healthz", "/health", "/demo", "/v1/models"]
              status = HTTPStatus.OK if payload["status"] == "ok" else HTTPStatus.SERVICE_UNAVAILABLE
              return status, payload

          if path == "/demo":
              payload = base_payload()
              lang = (query.get("lang", ["en"])[0] or "en").strip().lower()
              text = query.get("text", [None])[0]
              try:
                  payload["demo"] = run_demo(text=text, lang=lang)
                  payload["status"] = "ok"
                  return HTTPStatus.OK, payload
              except Exception as exc:
                  payload["status"] = "error"
                  payload["error"] = f"{type(exc).__name__}: {exc}"
                  return HTTPStatus.INTERNAL_SERVER_ERROR, payload

          if path == "/v1/models":
              return HTTPStatus.OK, {
                  "object": "list",
                  "data": [
                      {
                          "id": "openmed/no-model-verifier",
                          "object": "model",
                          "created": 0,
                          "owned_by": "maziyarpanahi/openmed",
                          "description": (
                              "Default Phala verifier endpoint. It imports OpenMed and runs "
                              "registry and PII-pattern checks, but does not host a model."
                          ),
                      },
                      *[
                          {
                              "id": item["id"],
                              "object": "model",
                              "created": 0,
                              "owned_by": "OpenMed",
                              "description": item.get("specialization", "OpenMed registry model"),
                              "metadata_only": True,
                              "loaded": False,
                          }
                          for item in [model_summary(alias) for alias in DEFAULT_MODEL_ALIASES]
                          if "error" not in item
                      ],
                  ],
              }

          return HTTPStatus.NOT_FOUND, {
              "error": "not_found",
              "endpoints": ["/healthz", "/health", "/demo", "/v1/models"],
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = SERVICE

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      }
                  ),
                  flush=True,
              )

          def do_GET(self):
              parsed = urlparse(self.path)
              path = parsed.path.rstrip("/") or "/"
              query = parse_qs(parsed.query, keep_blank_values=True)
              status, payload = response_for(path, query)
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)


      if __name__ == "__main__":
          print(
              json.dumps(
                  {
                      "event": "startup",
                      "service": SERVICE,
                      "port": 8000,
                      "openmed": IMPORT_STATUS,
                      "model_weights_downloaded": False,
                      "credentials_required": False,
                  }
              ),
              flush=True,
          )
          ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()

networks:
  internal:
    driver: bridge
