services:
  app:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      COMPOSIO_VERSION: ${COMPOSIO_VERSION:-0.13.1}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      UV_SYSTEM_PYTHON: "1"
    configs:
      - source: composio_demo_server
        target: /opt/composio-demo/server.py
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        uv pip install --system --no-cache "composio==$${COMPOSIO_VERSION}"
        exec python /opt/composio-demo/server.py
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

configs:
  composio_demo_server:
    content: |
      import hashlib
      import importlib
      import importlib.metadata
      import inspect
      import json
      import os
      import platform
      import sys
      import time
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import urlparse


      STARTED_AT = time.time()
      PACKAGE_NAME = "composio"
      LOCAL_MODEL_ID = "composio/local-tool-demo"
      UPSTREAM_REPO = "https://github.com/ComposioHQ/composio"
      UPSTREAM_DOCS = "https://docs.composio.dev/"
      UPSTREAM_PACKAGE = "https://pypi.org/project/composio/0.13.1/"
      ICON_SOURCE = (
          "https://raw.githubusercontent.com/ComposioHQ/composio/next/"
          "docs/public/Composio%20Logo.svg"
      )

      IMPORT_ERROR = None
      composio_module = None
      Composio = None
      CustomTool = None
      ApiKeyNotProvidedError = None
      ENV_COMPOSIO_API_KEY = "COMPOSIO_API_KEY"
      BaseModel = None
      Field = None

      try:
          composio_module = importlib.import_module(PACKAGE_NAME)
          from composio import Composio, CustomTool
          from composio.exceptions import ApiKeyNotProvidedError, ENV_COMPOSIO_API_KEY
          from pydantic import BaseModel, Field
      except Exception as exc:
          IMPORT_ERROR = f"{type(exc).__name__}: {exc}"


      def package_version():
          try:
              return importlib.metadata.version(PACKAGE_NAME)
          except Exception as exc:
              return f"unavailable: {type(exc).__name__}: {exc}"


      def package_metadata():
          result = {
              "distribution": PACKAGE_NAME,
              "distribution_version": package_version(),
              "module_version": None,
              "import_ok": IMPORT_ERROR is None,
              "required_exports": {
                  "Composio": False,
                  "CustomTool": False,
                  "ApiKeyNotProvidedError": False,
              },
              "metadata": {},
              "error": IMPORT_ERROR,
          }
          if IMPORT_ERROR is not None:
              return result

          try:
              metadata = importlib.metadata.metadata(PACKAGE_NAME)
              result["metadata"] = {
                  "name": metadata.get("Name"),
                  "summary": metadata.get("Summary"),
                  "home_page": metadata.get("Home-page"),
              }
          except Exception as exc:
              result["metadata_error"] = f"{type(exc).__name__}: {exc}"

          result["module_version"] = getattr(composio_module, "__version__", None)
          result["required_exports"] = {
              "Composio": hasattr(composio_module, "Composio"),
              "CustomTool": hasattr(composio_module, "CustomTool"),
              "ApiKeyNotProvidedError": ApiKeyNotProvidedError is not None,
          }
          result["import_ok"] = all(result["required_exports"].values())
          return result


      def model_schema(model):
          if hasattr(model, "model_json_schema"):
              return model.model_json_schema()
          return model.schema()


      def model_dump(instance):
          if hasattr(instance, "model_dump"):
              return instance.model_dump()
          return instance.dict()


      if IMPORT_ERROR is None:
          class LocalToolInput(BaseModel):
              message: str = Field(
                  ...,
                  min_length=1,
                  description="Message to normalize and echo locally.",
              )
              repeat: int = Field(
                  default=2,
                  ge=1,
                  le=5,
                  description="Number of deterministic local repetitions.",
              )


          def execute_local_tool(params):
              normalized = " ".join(params.message.split()).lower()
              repeated = [normalized for _ in range(params.repeat)]
              digest_input = "|".join(repeated).encode("utf-8")
              digest = hashlib.sha256(digest_input).hexdigest()[:16]
              return {
                  "normalized": normalized,
                  "repeated": repeated,
                  "digest": digest,
                  "remote_calls": False,
              }


      def hosted_credential_policy():
          result = {
              "credentials_required_for_hosted_calls": False,
              "hosted_client_constructed": False,
              "composio_without_api_key_instantiated": False,
              "constructor": "Composio",
              "api_key_env_var": ENV_COMPOSIO_API_KEY,
              "exception": "ApiKeyNotProvidedError",
              "verification_method": "source inspection of Composio.__init__; no hosted client is constructed",
              "ok": False,
          }
          if IMPORT_ERROR is not None or Composio is None or ApiKeyNotProvidedError is None:
              result["error"] = IMPORT_ERROR or "Composio credential classes unavailable"
              return result

          try:
              source = inspect.getsource(Composio.__init__)
              signature = str(inspect.signature(Composio))
              requires_key = (
                  "ApiKeyNotProvidedError" in source
                  and ("COMPOSIO_API_KEY" in source or ENV_COMPOSIO_API_KEY in source)
              )
              result.update(
                  {
                      "credentials_required_for_hosted_calls": requires_key,
                      "constructor_signature": signature,
                      "raises_without_api_key": "ApiKeyNotProvidedError" if requires_key else None,
                      "ok": requires_key,
                  }
              )
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"
          return result


      def run_custom_tool_smoke():
          if IMPORT_ERROR is not None:
              return {
                  "ok": False,
                  "error": IMPORT_ERROR,
                  "remote_calls": False,
              }

          try:
              tool = CustomTool(
                  slug="local_tool_demo",
                  name="Local Tool Demo",
                  description="Deterministic local Composio CustomTool smoke test.",
                  input_schema=model_schema(LocalToolInput),
                  input_params=LocalToolInput,
                  execute=execute_local_tool,
                  output_schema={
                      "type": "object",
                      "properties": {
                          "normalized": {"type": "string"},
                          "repeated": {
                              "type": "array",
                              "items": {"type": "string"},
                          },
                          "digest": {"type": "string"},
                          "remote_calls": {"type": "boolean"},
                      },
                      "required": ["normalized", "repeated", "digest", "remote_calls"],
                  },
                  preload=True,
              )
              input_payload = {
                  "message": "Phala Cloud Composio CustomTool smoke",
                  "repeat": 2,
              }
              validated_input = tool.input_params(**input_payload)
              output = tool.execute(validated_input)
              expected_digest = hashlib.sha256(
                  "phala cloud composio customtool smoke|phala cloud composio customtool smoke".encode(
                      "utf-8"
                  )
              ).hexdigest()[:16]
              ok = (
                  tool.slug == "local_tool_demo"
                  and output.get("digest") == expected_digest
                  and output.get("remote_calls") is False
              )
              return {
                  "ok": ok,
                  "tool": {
                      "slug": tool.slug,
                      "name": tool.name,
                      "description": tool.description,
                      "input_model": tool.input_params.__name__,
                      "input_schema": tool.input_schema,
                      "output_schema": tool.output_schema,
                      "preload": tool.preload,
                  },
                  "input": model_dump(validated_input),
                  "output": output,
                  "expected_digest": expected_digest,
                  "remote_calls": False,
              }
          except Exception as exc:
              return {
                  "ok": False,
                  "error": f"{type(exc).__name__}: {exc}",
                  "remote_calls": False,
              }


      PACKAGE_STATUS = package_metadata()
      CUSTOM_TOOL_SMOKE = run_custom_tool_smoke()
      CREDENTIAL_POLICY = hosted_credential_policy()


      def verifier_ok():
          return bool(PACKAGE_STATUS["import_ok"] and CUSTOM_TOOL_SMOKE["ok"])


      def base_payload():
          return {
              "service": "composio-local-tool-demo",
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "package": PACKAGE_STATUS,
              "remote_calls": False,
              "cpu_only": True,
          }


      def response_body(path):
          if path in ("/", "/healthz"):
              ok = verifier_ok()
              payload = base_payload()
              payload.update(
                  {
                      "ok": ok,
                      "status": "ok" if ok else "unhealthy",
                      "custom_tool_smoke_passed": CUSTOM_TOOL_SMOKE["ok"],
                      "credentials_required_for_hosted_calls": CREDENTIAL_POLICY[
                          "credentials_required_for_hosted_calls"
                      ],
                  }
              )
              if not ok:
                  payload["custom_tool_smoke"] = CUSTOM_TOOL_SMOKE
              return HTTPStatus.OK if ok else HTTPStatus.SERVICE_UNAVAILABLE, payload

          if path == "/demo":
              ok = verifier_ok()
              payload = base_payload()
              payload.update(
                  {
                      "ok": ok,
                      "status": "ok" if ok else "unhealthy",
                      "credentials_required_for_hosted_calls": True,
                      "remote_calls": False,
                      "cpu_only": True,
                      "model_downloaded": False,
                      "model_loaded": False,
                      "hosted_client": CREDENTIAL_POLICY,
                      "custom_tool_smoke": CUSTOM_TOOL_SMOKE,
                  }
              )
              return HTTPStatus.OK if ok else HTTPStatus.INTERNAL_SERVER_ERROR, payload

          if path == "/v1/models":
              return HTTPStatus.OK, {
                  "object": "list",
                  "data": [
                      {
                          "id": LOCAL_MODEL_ID,
                          "object": "model",
                          "created": 1704067200,
                          "owned_by": "ComposioHQ",
                          "description": (
                              "Compatibility entry for the local Composio CustomTool demo. "
                              "This endpoint does not host or call an LLM model."
                          ),
                      }
                  ],
                  "remote_calls": False,
                  "cpu_only": True,
              }

          if path == "/upstream":
              payload = base_payload()
              payload.update(
                  {
                      "repo": {
                          "url": UPSTREAM_REPO,
                          "default_branch": "next",
                          "icon_source": ICON_SOURCE,
                      },
                      "docs": {
                          "url": UPSTREAM_DOCS,
                          "notes": "Composio documentation for hosted integrations, auth, and tool execution.",
                      },
                      "package": {
                          "distribution": PACKAGE_NAME,
                          "pypi": UPSTREAM_PACKAGE,
                          "installed_version": PACKAGE_STATUS["distribution_version"],
                          "import_name": "composio",
                      },
                      "phala_template": (
                          "https://github.com/Phala-Network/phala-cloud/tree/main/"
                          "templates/prebuilt/composio"
                      ),
                      "credentials_required_for_hosted_calls": CREDENTIAL_POLICY[
                          "credentials_required_for_hosted_calls"
                      ],
                  }
              )
              return HTTPStatus.OK, payload

          return HTTPStatus.NOT_FOUND, {
              "error": "not_found",
              "endpoints": ["/healthz", "/demo", "/v1/models", "/upstream"],
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "composio-local-tool-demo"

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      }
                  ),
                  flush=True,
              )

          def do_GET(self):
              path = urlparse(self.path).path.rstrip("/") or "/"
              status, payload = response_body(path)
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)


      if __name__ == "__main__":
          port = int(os.environ.get("APP_PORT", "8080"))
          print(
              json.dumps(
                  {
                      "event": "startup",
                      "port": port,
                      "package": PACKAGE_STATUS,
                      "custom_tool_smoke_ok": CUSTOM_TOOL_SMOKE["ok"],
                      "remote_calls": False,
                  }
              ),
              flush=True,
          )
          ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()
