services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supabase_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-demo-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    configs:
      - source: init_sql
        target: /docker-entrypoint-initdb.d/01-supabase-pgvector-demo.sql
    healthcheck:
      test:
        - CMD-SHELL
        - |
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U postgres -d "$${POSTGRES_DB}" -tAc "SELECT 1 FROM pg_extension WHERE extname = 'vector'" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  rest:
    image: postgrest/postgrest:v14.8
    restart: unless-stopped
    environment:
      PGRST_DB_URI: host=db port=5432 dbname=${POSTGRES_DB:-supabase_demo} user=postgres password=${POSTGRES_PASSWORD:-change-this-demo-password} sslmode=disable
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_LOG_LEVEL: info
      PGRST_SERVER_PORT: "3000"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  proxy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "8080:80"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      - rest
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          encode zstd gzip
          header {
              X-Content-Type-Options "nosniff"
              Referrer-Policy "no-referrer"
              -Server
          }

          handle /healthz {
              rewrite * /
              reverse_proxy rest:3000
          }

          handle_path /rest/v1/* {
              reverse_proxy rest:3000
          }

          handle {
              respond "{\"ok\":true,\"service\":\"supabase-pgvector-demo\",\"endpoints\":[\"/healthz\",\"/rest/v1/documents\",\"/rest/v1/rpc/match_documents\"]}" 200
          }
      }

  init_sql:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;

      DO '
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = ''anon'') THEN
          CREATE ROLE anon NOLOGIN;
        END IF;
      END;
      ';

      CREATE TABLE IF NOT EXISTS public.documents (
        id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        title text NOT NULL,
        content text NOT NULL,
        embedding vector(3) NOT NULL,
        metadata jsonb NOT NULL DEFAULT '{}'::jsonb,
        created_at timestamptz NOT NULL DEFAULT now()
      );

      INSERT INTO public.documents (id, title, content, embedding, metadata)
      VALUES
        (
          1,
          'Confidential Postgres on Phala Cloud',
          'Phala Cloud can run a Postgres data service inside a confidential VM and expose a small HTTP endpoint for application smoke tests.',
          '[0.96,0.16,0.08]',
          '{"topic":"confidential-compute","source":"template-seed"}'::jsonb
        ),
        (
          2,
          'Supabase REST APIs',
          'Supabase uses PostgREST to provide auto-generated REST APIs on top of Postgres schemas.',
          '[0.14,0.95,0.12]',
          '{"topic":"postgrest","source":"template-seed"}'::jsonb
        ),
        (
          3,
          'pgvector similarity search',
          'The pgvector extension stores embeddings in Postgres and supports vector distance operators for AI retrieval workloads.',
          '[0.08,0.18,0.97]',
          '{"topic":"pgvector","source":"template-seed"}'::jsonb
        )
      ON CONFLICT (id) DO UPDATE
      SET
        title = EXCLUDED.title,
        content = EXCLUDED.content,
        embedding = EXCLUDED.embedding,
        metadata = EXCLUDED.metadata;

      SELECT setval(pg_get_serial_sequence('public.documents', 'id'), (SELECT max(id) FROM public.documents));

      CREATE INDEX IF NOT EXISTS documents_embedding_hnsw_idx
        ON public.documents
        USING hnsw (embedding vector_cosine_ops);

      CREATE OR REPLACE FUNCTION public.match_documents(
        query_embedding text DEFAULT '[0.95,0.12,0.05]',
        match_count integer DEFAULT 3
      )
      RETURNS TABLE (
        id integer,
        title text,
        content text,
        similarity double precision
      )
      LANGUAGE sql
      STABLE
      AS '
        SELECT
          documents.id,
          documents.title,
          documents.content,
          round((1 - (documents.embedding <=> query_embedding::vector))::numeric, 6)::double precision AS similarity
        FROM public.documents
        ORDER BY documents.embedding <=> query_embedding::vector
        LIMIT greatest(1, least(coalesce(match_count, 3), 10))
      ';

      GRANT USAGE ON SCHEMA public TO anon;
      GRANT SELECT ON public.documents TO anon;
      GRANT EXECUTE ON FUNCTION public.match_documents(text, integer) TO anon;

networks:
  internal:
    driver: bridge

volumes:
  db_data:
