services:
  app:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      VIMAX_REF: ${VIMAX_REF:-d653f20483907e0aec6e4f20554eca222486294d}
      PYTHONUNBUFFERED: "1"
      UV_SYSTEM_PYTHON: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
    volumes:
      - vimax-cache:/opt/vimax
    configs:
      - source: vimax_bootstrap
        target: /opt/vimax-demo/bootstrap.py
      - source: vimax_server
        target: /opt/vimax-demo/server.py
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        python /opt/vimax-demo/bootstrap.py
        uv pip install --system --no-cache \
          "pydantic>=2.8,<3" \
          "Pillow>=10,<13" \
          "PyYAML>=6,<7" \
          "requests>=2.31,<3" \
          "tenacity>=8,<10" \
          "opencv-python-headless>=4.9,<5"
        exec python /opt/vimax-demo/server.py
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, sys, urllib.request; port = os.environ.get('PORT', '8080'); response = urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=5); sys.exit(0 if response.status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

configs:
  vimax_bootstrap:
    content: |
      import io
      import json
      import os
      import shutil
      import sys
      import tarfile
      import time
      import urllib.parse
      import urllib.request
      from datetime import datetime, timezone
      from pathlib import Path


      ROOT = Path("/opt/vimax")
      SOURCE_DIR = ROOT / "source"
      STATE_FILE = ROOT / "state.json"
      REF_FILE = ROOT / ".source-ref"
      UPSTREAM = "https://github.com/HKUDS/ViMax"
      DEFAULT_REF = "d653f20483907e0aec6e4f20554eca222486294d"


      def log(event, **fields):
          print(json.dumps({"event": event, **fields}, sort_keys=True), flush=True)


      def current_ref():
          return os.environ.get("VIMAX_REF", DEFAULT_REF).strip() or DEFAULT_REF


      def source_is_ready(ref):
          required = [
              "readme.md",
              "pyproject.toml",
              "assets/vimax.png",
              "interfaces/scene.py",
              "interfaces/character.py",
              "interfaces/environment.py",
              "interfaces/shot_description.py",
              "interfaces/camera.py",
              "utils/provider_presets.py",
              "configs/idea2video.yaml",
              "configs/script2video.yaml",
          ]
          return (
              REF_FILE.is_file()
              and REF_FILE.read_text(encoding="utf-8").strip() == ref
              and all(SOURCE_DIR.joinpath(path).is_file() for path in required)
          )


      def safe_extract(data, destination):
          tmp_dir = ROOT / ".source-tmp"
          shutil.rmtree(tmp_dir, ignore_errors=True)
          tmp_dir.mkdir(parents=True, exist_ok=True)
          top_dir = None

          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              for member in archive.getmembers():
                  parts = Path(member.name).parts
                  if len(parts) < 2:
                      if parts:
                          top_dir = top_dir or parts[0]
                      continue
                  top_dir = top_dir or parts[0]
                  relative = Path(*parts[1:])
                  if relative.is_absolute() or ".." in relative.parts:
                      raise RuntimeError(f"unsafe tar path: {member.name}")
                  target = tmp_dir / relative
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  elif member.isfile():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      src = archive.extractfile(member)
                      if src is None:
                          raise RuntimeError(f"cannot read tar member: {member.name}")
                      with src, open(target, "wb") as dst:
                          shutil.copyfileobj(src, dst)
                      if member.mode:
                          target.chmod(member.mode & 0o777)

          shutil.rmtree(destination, ignore_errors=True)
          tmp_dir.rename(destination)
          return top_dir


      def download_source(ref):
          encoded_ref = urllib.parse.quote(ref, safe="")
          url = f"https://api.github.com/repos/HKUDS/ViMax/tarball/{encoded_ref}"
          request = urllib.request.Request(url, headers={"User-Agent": "phala-cloud-template-vimax"})
          started = time.time()
          log("download_source", ref=ref, url=url)
          with urllib.request.urlopen(request, timeout=120) as response:
              data = response.read()
          top_dir = safe_extract(data, SOURCE_DIR)
          REF_FILE.write_text(ref + "\n", encoding="utf-8")
          return {
              "source_ref": ref,
              "source_url": url,
              "source_tree": top_dir,
              "downloaded_bytes": len(data),
              "download_seconds": round(time.time() - started, 3),
          }


      def main():
          ROOT.mkdir(parents=True, exist_ok=True)
          ref = current_ref()
          state = {}
          if STATE_FILE.is_file():
              try:
                  state = json.loads(STATE_FILE.read_text(encoding="utf-8"))
              except Exception:
                  state = {}

          if not source_is_ready(ref):
              state.update(download_source(ref))
          else:
              log("source_cached", ref=ref, source_dir=str(SOURCE_DIR))
              state.update({"source_ref": ref, "source_dir": str(SOURCE_DIR)})

          state.update({
              "upstream": UPSTREAM,
              "source_dir": str(SOURCE_DIR),
              "bootstrapped_at": datetime.now(timezone.utc).isoformat(),
              "python": sys.version.split()[0],
          })
          STATE_FILE.write_text(json.dumps(state, indent=2, sort_keys=True), encoding="utf-8")
          log("bootstrap_complete", ref=ref, source_dir=str(SOURCE_DIR))


      if __name__ == "__main__":
          main()

  vimax_server:
    content: |
      import hashlib
      import importlib
      import json
      import os
      import platform
      import sys
      import time
      import tomllib
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from pathlib import Path
      from urllib.parse import urlparse

      import yaml
      from PIL import Image


      STARTED_AT = time.time()
      ROOT = Path("/opt/vimax")
      SOURCE_DIR = ROOT / "source"
      STATE_FILE = ROOT / "state.json"
      UPSTREAM = "https://github.com/HKUDS/ViMax"

      if str(SOURCE_DIR) not in sys.path:
          sys.path.insert(0, str(SOURCE_DIR))


      def load_state():
          try:
              return json.loads(STATE_FILE.read_text(encoding="utf-8"))
          except Exception as exc:
              return {"error": f"{type(exc).__name__}: {exc}"}


      def read_pyproject():
          result = {
              "name": None,
              "version": None,
              "description": None,
              "requires_python": None,
              "dependency_count": 0,
              "selected_dependencies": [],
              "readme": None,
              "error": None,
          }
          try:
              with SOURCE_DIR.joinpath("pyproject.toml").open("rb") as fp:
                  data = tomllib.load(fp)
              project = data.get("project", {})
              dependencies = project.get("dependencies", [])
              result.update({
                  "name": project.get("name"),
                  "version": project.get("version"),
                  "description": project.get("description"),
                  "requires_python": project.get("requires-python"),
                  "dependency_count": len(dependencies),
                  "selected_dependencies": dependencies[:10],
                  "readme": project.get("readme"),
              })
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"
          return result


      def read_config_summary(name):
          result = {
              "file": name,
              "present": False,
              "working_dir": None,
              "sections": {},
              "provider_credentials_present": False,
              "error": None,
          }
          try:
              path = SOURCE_DIR / "configs" / name
              result["present"] = path.is_file()
              data = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              result["working_dir"] = data.get("working_dir")
              for section_name in ("chat_model", "image_generator", "video_generator"):
                  section = data.get(section_name, {}) or {}
                  init_args = dict(section.get("init_args", {}) or {})
                  result["sections"][section_name] = {
                      "class_path": section.get("class_path"),
                      "model": init_args.get("model"),
                      "model_provider": init_args.get("model_provider"),
                      "base_url": init_args.get("base_url"),
                      "api_key_configured": bool(init_args.get("api_key")),
                      "max_requests_per_minute": section.get("max_requests_per_minute"),
                      "max_requests_per_day": section.get("max_requests_per_day"),
                  }
                  result["provider_credentials_present"] = (
                      result["provider_credentials_present"] or bool(init_args.get("api_key"))
                  )
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"
          return result


      def runtime_guards():
          return {
              "credentials_required": False,
              "chat_model_calls": False,
              "image_generation_calls": False,
              "video_generation_calls": False,
              "hosted_model_calls": False,
              "model_downloaded": False,
              "model_loaded": False,
              "gpu_or_cuda_required": False,
              "browser_auth": False,
              "browser_automation": False,
              "training_started": False,
          }


      def build_demo():
          interfaces = importlib.import_module("interfaces")
          environment_module = importlib.import_module("interfaces.environment")
          provider_presets = importlib.import_module("utils.provider_presets")

          environment = environment_module.EnvironmentInScene(
              slugline="INT. PHALA CLOUD STAGE - DAY",
              description=(
                  "A small local verifier stage with a storyboard wall, a script table, "
                  "and a monitor showing that no provider keys or generated media are in use."
              ),
          )
          characters = [
              interfaces.CharacterInScene(
                  idx=0,
                  identifier_in_scene="Director",
                  is_visible=True,
                  static_features="Focused creative lead with short dark hair and rectangular glasses.",
                  dynamic_features="Wearing a slate jacket and holding a printed shot list.",
              ),
              interfaces.CharacterInScene(
                  idx=1,
                  identifier_in_scene="Producer",
                  is_visible=True,
                  static_features="Calm coordinator with tied-back hair and a compact production headset.",
                  dynamic_features="Carrying a tablet with a local smoke-test checklist.",
              ),
          ]
          scene = interfaces.Scene(
              idx=0,
              is_last=True,
              environment=environment,
              characters=characters,
              script=(
                  "<Director> reviews a deterministic storyboard fixture.\n"
                  "<Producer>: The local source primitives are ready, and no model call was made."
              ),
          )
          shot_brief = interfaces.ShotBriefDescription(
              idx=0,
              is_last=True,
              cam_idx=0,
              visual_desc=(
                  "A steady medium shot frames <Director> and <Producer> beside the storyboard wall "
                  "while a status monitor reads local source verifier."
              ),
              audio_desc="[Sound Effect] quiet server-room hum",
          )
          shot = interfaces.ShotDescription(
              idx=0,
              is_last=True,
              cam_idx=0,
              visual_desc=shot_brief.visual_desc,
              variation_type="small",
              variation_reason="The shot only verifies local planning metadata and has no generated frames.",
              ff_desc="First frame: the storyboard wall and status monitor are visible.",
              ff_vis_char_idxs=[0, 1],
              lf_desc="Last frame: the producer marks the smoke check complete on the tablet.",
              lf_vis_char_idxs=[0, 1],
              motion_desc="The camera stays fixed while the producer nods once.",
              audio_desc=shot_brief.audio_desc,
          )
          camera = interfaces.Camera(
              idx=0,
              active_shot_idxs=[0],
              parent_cam_idx=None,
              parent_shot_idx=None,
              reason="Single local camera fixture for source verification.",
              is_parent_fully_covers_child=None,
              missing_info=None,
          )
          event = interfaces.Event(
              index=0,
              is_last=True,
              description="A deterministic ViMax source verifier builds local scene, shot, camera, and event objects.",
              process_chain=[
                  "Download the pinned upstream source tarball.",
                  "Import ViMax interface and provider-preset modules locally.",
                  "Instantiate Pydantic scene-planning objects without provider calls.",
              ],
          )
          preset = provider_presets.resolve_chat_model_config({
              "model_provider": "minimax",
              "model": "",
              "api_key": "",
              "temperature": 0.7,
          })
          asset_path = SOURCE_DIR / "assets" / "vimax.png"
          with Image.open(asset_path) as image:
              asset = {
                  "path": "assets/vimax.png",
                  "format": image.format,
                  "width": image.size[0],
                  "height": image.size[1],
                  "mode": image.mode,
              }

          payload = {
              "scene": scene.model_dump(mode="json"),
              "shot_brief": shot_brief.model_dump(mode="json"),
              "shot_description": shot.model_dump(mode="json"),
              "camera": camera.model_dump(mode="json"),
              "event": event.model_dump(mode="json"),
              "provider_preset_without_secret": {
                  "model_provider": preset.get("model_provider"),
                  "model": preset.get("model"),
                  "base_url": preset.get("base_url"),
                  "temperature": preset.get("temperature"),
                  "api_key_configured": bool(preset.get("api_key")),
                  "known_presets": sorted(provider_presets.PROVIDER_PRESETS.keys()),
              },
              "asset": asset,
          }
          digest = hashlib.sha256(json.dumps(payload, sort_keys=True).encode("utf-8")).hexdigest()
          payload["sha256_16"] = digest[:16]
          return payload


      def import_checks():
          result = {
              "ok": False,
              "source_path": str(SOURCE_DIR),
              "imports": {},
              "checks": {},
              "demo": None,
              "error": None,
          }
          try:
              interfaces = importlib.import_module("interfaces")
              provider_presets = importlib.import_module("utils.provider_presets")
              demo = build_demo()
              result["imports"] = {
                  "interfaces": sorted(getattr(interfaces, "__all__", [])),
                  "utils.provider_presets": sorted(provider_presets.PROVIDER_PRESETS.keys()),
              }
              result["checks"] = {
                  "source_readme_present": SOURCE_DIR.joinpath("readme.md").is_file(),
                  "pyproject_present": SOURCE_DIR.joinpath("pyproject.toml").is_file(),
                  "vimax_asset_present": SOURCE_DIR.joinpath("assets", "vimax.png").is_file(),
                  "scene_model_constructed": demo["scene"]["idx"] == 0,
                  "shot_model_constructed": demo["shot_description"]["variation_type"] == "small",
                  "camera_model_constructed": demo["camera"]["active_shot_idxs"] == [0],
                  "provider_preset_resolved": demo["provider_preset_without_secret"]["model_provider"] == "openai",
                  "provider_key_absent": demo["provider_preset_without_secret"]["api_key_configured"] is False,
              }
              result["demo"] = demo
              result["ok"] = all(result["checks"].values())
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"
          return result


      BOOTSTRAP_STATE = load_state()
      PYPROJECT = read_pyproject()
      CONFIGS = [
          read_config_summary("idea2video.yaml"),
          read_config_summary("script2video.yaml"),
          read_config_summary("idea2video_minimax.yaml"),
          read_config_summary("script2video_minimax.yaml"),
      ]
      IMPORT_STATUS = import_checks()


      def base_payload():
          return {
              "service": "vimax-source-verifier",
              "upstream": UPSTREAM,
              "source": BOOTSTRAP_STATE,
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "runtime_guards": runtime_guards(),
          }


      def response_body(path):
          ok = bool(IMPORT_STATUS.get("ok")) and PYPROJECT.get("name") == "autolongvideogeneration"
          if path == "/healthz":
              payload = base_payload()
              payload.update({
                  "status": "ok" if ok else "unhealthy",
                  "ok": ok,
                  "pyproject": PYPROJECT,
                  "imports": IMPORT_STATUS,
              })
              return HTTPStatus.OK if ok else HTTPStatus.SERVICE_UNAVAILABLE, payload

          if path == "/demo":
              payload = base_payload()
              payload.update({
                  "ok": ok,
                  "purpose": "CPU-safe deterministic ViMax source verifier",
                  "pyproject": PYPROJECT,
                  "upstream_configs": CONFIGS,
                  "imports": IMPORT_STATUS,
                  "production_inputs_not_used": [
                      "chat model API key",
                      "image generation API key",
                      "video generation API key",
                      "model weights",
                      "GPU or CUDA runtime",
                      "browser authentication",
                  ],
              })
              return HTTPStatus.OK if ok else HTTPStatus.SERVICE_UNAVAILABLE, payload

          if path == "/v1/models":
              return HTTPStatus.OK, {
                  "object": "list",
                  "data": [
                      {
                          "id": "vimax/no-provider-source-verifier",
                          "object": "model",
                          "created": 0,
                          "owned_by": "HKUDS",
                          "description": (
                              "Metadata placeholder for the ViMax source verifier. "
                              "The default template does not host, download, or call a generation model."
                          ),
                      }
                  ],
              }

          if path == "/":
              payload = base_payload()
              payload.update({
                  "ok": ok,
                  "endpoints": ["/healthz", "/demo", "/v1/models"],
                  "display_name": "HKUDS/ViMax",
              })
              return HTTPStatus.OK if ok else HTTPStatus.SERVICE_UNAVAILABLE, payload

          return HTTPStatus.NOT_FOUND, {
              "error": "not_found",
              "endpoints": ["/healthz", "/demo", "/v1/models"],
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "vimax-verifier"

          def log_message(self, fmt, *args):
              print(
                  json.dumps({
                      "ts": time.time(),
                      "client": self.client_address[0],
                      "request": self.requestline,
                      "message": fmt % args,
                  }),
                  flush=True,
              )

          def do_GET(self):
              path = urlparse(self.path).path
              status, payload = response_body(path)
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("X-Content-Type-Options", "nosniff")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)


      def main():
          port = int(os.environ.get("PORT", "8080"))
          server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
          print(json.dumps({"event": "server_start", "port": port, "ok": IMPORT_STATUS.get("ok")}), flush=True)
          server.serve_forever()


      if __name__ == "__main__":
          main()

volumes:
  vimax-cache:
