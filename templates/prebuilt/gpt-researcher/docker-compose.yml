services:
  app:
    image: python:3.12-slim-bookworm
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GPTR_UPSTREAM: https://github.com/assafelovic/gpt-researcher
      GPTR_RELEASE: v3.4.4
      GPTR_COMMIT: 27abde0bd9c682853f09754cc8172e3b516b95f2
      GPTR_RELEASE_PUBLISHED_AT: "2026-04-16T17:40:28Z"
      GPTR_PYPI_VERSION: "0.14.8"
      GPTR_DEMO_MAX_SOURCES: ${GPTR_DEMO_MAX_SOURCES:-3}
      VERIFY_TIMEOUT_SECONDS: ${VERIFY_TIMEOUT_SECONDS:-8}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    configs:
      - source: server_py
        target: /server.py
        mode: 0444
    command:
      - python
      - /server.py
    working_dir: /tmp
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; data = json.load(urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5)); assert data["ok"] is True
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

configs:
  server_py:
    content: |
      import hashlib
      import json
      import os
      import platform
      import re
      import sys
      import threading
      import time
      import urllib.error
      import urllib.request
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import parse_qs, urlparse

      STARTED_AT = time.time()
      UPSTREAM = os.environ.get("GPTR_UPSTREAM", "https://github.com/assafelovic/gpt-researcher")
      RELEASE = os.environ.get("GPTR_RELEASE", "v3.4.4")
      COMMIT = os.environ.get("GPTR_COMMIT", "27abde0bd9c682853f09754cc8172e3b516b95f2")
      PYPI_VERSION = os.environ.get("GPTR_PYPI_VERSION", "0.14.8")
      RELEASE_PUBLISHED_AT = os.environ.get("GPTR_RELEASE_PUBLISHED_AT", "2026-04-16T17:40:28Z")

      FILES = {
          "README.md": {
              "sha256": "e4f3eab5141810da9167ddfa89844b10f9286acac4dc46bbc6f89cda0f649572",
              "markers": [
                  "GPT Researcher is an open deep research agent",
                  "OPENAI_API_KEY",
                  "TAVILY_API_KEY",
                  "Run with Docker",
              ],
          },
          "pyproject.toml": {
              "sha256": "ce1d4ce6a8d86e6c760f490004e23682a069c1911dcdc188da4366758659ae5e",
              "markers": [
                  'name = "gpt-researcher"',
                  'python = ">=3.11"',
                  "langchain-openai",
                  "duckduckgo_search",
              ],
          },
          "docker-compose.yml": {
              "sha256": "c8a50ba7d10d7ffabf29869d0fb75460d16fb11a02cbfa0784690457c4a07c25",
              "markers": [
                  "OPENAI_API_KEY",
                  "TAVILY_API_KEY",
                  "gptresearcher/gpt-researcher",
                  "gptr-nextjs",
              ],
          },
          ".env.example": {
              "sha256": "91e5c5babe4154b22c432d835fe07df21a1554a888bb73b48299387905e02884",
              "markers": [
                  "OPENAI_API_KEY=",
                  "TAVILY_API_KEY=",
                  "DOC_PATH=./my-docs",
                  "LANGCHAIN_TRACING_V2",
              ],
          },
          "setup.py": {
              "sha256": "924ddea9700c9906175f11dfea173d8b2949909aec5a2b942620744519687db1",
              "markers": [
                  'name="gpt-researcher"',
                  'author="Assaf Elovic"',
                  "python_requires='>=3.11'",
                  'license="MIT"',
              ],
          },
      }

      DOCS = [
          {
              "id": "architecture",
              "title": "Research workflow",
              "text": (
                  "GPT Researcher organizes research as planning, source gathering, "
                  "summarization, citation tracking, and report publishing."
              ),
          },
          {
              "id": "providers",
              "title": "Provider configuration",
              "text": (
                  "Full web research normally needs an LLM provider key such as "
                  "OPENAI_API_KEY and a search retriever key such as TAVILY_API_KEY."
              ),
          },
          {
              "id": "phala-demo",
              "title": "Phala Cloud demo mode",
              "text": (
                  "This template exposes health, demo, and model-list endpoints "
                  "without calling model APIs, browser automation, or search providers."
              ),
          },
          {
              "id": "upstream-docker",
              "title": "Upstream Docker shape",
              "text": (
                  "The upstream Docker Compose stack includes backend and NextJS "
                  "services, host bind mounts for documents and outputs, and real "
                  "credential environment variables."
              ),
          },
          {
              "id": "local-documents",
              "title": "Local document research",
              "text": (
                  "GPT Researcher can research local documents when DOC_PATH is "
                  "configured and the full application stack is enabled."
              ),
          },
      ]

      VERIFY_LOCK = threading.Lock()
      VERIFY_STATE = {
          "status": "starting",
          "checked_at": None,
          "files": {},
          "pypi": {},
          "errors": [],
      }


      def now_iso():
          return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


      def timeout_seconds():
          try:
              return max(1.0, float(os.environ.get("VERIFY_TIMEOUT_SECONDS", "8")))
          except ValueError:
              return 8.0


      def fetch_bytes(url):
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "phala-cloud-gpt-researcher-template/1.0"},
          )
          with urllib.request.urlopen(request, timeout=timeout_seconds()) as response:
              return response.read()


      def verify_file(name, expected):
          url = f"https://raw.githubusercontent.com/assafelovic/gpt-researcher/{RELEASE}/{name}"
          data = fetch_bytes(url)
          text = data.decode("utf-8", errors="replace")
          digest = hashlib.sha256(data).hexdigest()
          marker_results = {
              marker: marker in text
              for marker in expected["markers"]
          }
          return {
              "url": url,
              "bytes": len(data),
              "sha256": digest,
              "sha256_expected": expected["sha256"],
              "sha256_ok": digest == expected["sha256"],
              "markers_ok": marker_results,
              "ok": digest == expected["sha256"] and all(marker_results.values()),
          }


      def verify_pypi():
          url = f"https://pypi.org/pypi/gpt-researcher/{PYPI_VERSION}/json"
          data = json.loads(fetch_bytes(url).decode("utf-8"))
          info = data.get("info", {})
          urls = data.get("urls", [])
          wheel = next(
              (item for item in urls if item.get("packagetype") == "bdist_wheel"),
              urls[0] if urls else {},
          )
          return {
              "url": url,
              "name": info.get("name"),
              "version": info.get("version"),
              "requires_python": info.get("requires_python"),
              "license": info.get("license"),
              "author": info.get("author"),
              "home_page": info.get("home_page"),
              "wheel": wheel.get("filename"),
              "wheel_sha256": wheel.get("digests", {}).get("sha256"),
              "ok": (
                  info.get("name") == "gpt-researcher"
                  and info.get("version") == PYPI_VERSION
                  and info.get("requires_python") == ">=3.11"
                  and info.get("home_page") == UPSTREAM
              ),
          }


      def run_verification():
          state = {
              "status": "running",
              "checked_at": now_iso(),
              "files": {},
              "pypi": {},
              "errors": [],
          }
          with VERIFY_LOCK:
              VERIFY_STATE.update(state)

          for name, expected in FILES.items():
              try:
                  state["files"][name] = verify_file(name, expected)
              except Exception as exc:
                  state["files"][name] = {
                      "ok": False,
                      "error": f"{type(exc).__name__}: {exc}",
                  }
                  state["errors"].append(f"{name}: {type(exc).__name__}: {exc}")

          try:
              state["pypi"] = verify_pypi()
          except Exception as exc:
              state["pypi"] = {
                  "ok": False,
                  "error": f"{type(exc).__name__}: {exc}",
              }
              state["errors"].append(f"pypi: {type(exc).__name__}: {exc}")

          all_files_ok = all(item.get("ok") for item in state["files"].values())
          state["status"] = "passed" if all_files_ok and state["pypi"].get("ok") else "failed"
          with VERIFY_LOCK:
              VERIFY_STATE.update(state)


      def verification_snapshot():
          with VERIFY_LOCK:
              return json.loads(json.dumps(VERIFY_STATE))


      def tokenize(text):
          return set(re.findall(r"[a-z0-9_]+", text.lower()))


      DOC_TOKENS = {
          item["id"]: tokenize(f"{item['title']} {item['text']}")
          for item in DOCS
      }


      def max_sources():
          try:
              value = int(os.environ.get("GPTR_DEMO_MAX_SOURCES", "3"))
          except ValueError:
              value = 3
          return max(1, min(value, len(DOCS)))


      def configured_credentials():
          names = ["OPENAI_API_KEY", "TAVILY_API_KEY", "OPENAI_BASE_URL"]
          return {name: bool(os.environ.get(name)) for name in names}


      def run_demo(query, limit):
          query_tokens = tokenize(query)
          scored = []
          for item in DOCS:
              matches = sorted(query_tokens & DOC_TOKENS[item["id"]])
              score = len(matches)
              if "research" in query_tokens and item["id"] == "architecture":
                  score += 2
              if "credential" in query_tokens and item["id"] == "providers":
                  score += 2
              if "phala" in query_tokens and item["id"] == "phala-demo":
                  score += 2
              scored.append((score, item["id"], matches, item))
          scored.sort(key=lambda value: (-value[0], value[1]))
          selected = [
              {
                  "id": item["id"],
                  "title": item["title"],
                  "score": score,
                  "matched_terms": matches,
                  "summary": item["text"],
              }
              for score, _doc_id, matches, item in scored[:limit]
          ]
          return {
              "query": query,
              "mode": "deterministic local demo",
              "planner_questions": [
                  f"What sources would GPT Researcher need for: {query}?",
                  "Which provider credentials are required for a full upstream run?",
                  "Which operations are intentionally disabled in this Phala demo?",
              ],
              "selected_sources": selected,
              "report_outline": [
                  "Scope and assumptions",
                  "Evidence gathered",
                  "Credential and runtime requirements",
                  "Limitations of demo mode",
              ],
              "deterministic_answer": (
                  "The local demo simulates GPT Researcher's plan, gather, and publish "
                  "shape using bundled metadata only. It does not browse the web, call "
                  "an LLM, invoke a retriever API, run Playwright, or download models."
              ),
              "external_llm_calls": False,
              "external_search_calls": False,
              "browser_automation": False,
              "model_downloaded": False,
              "gpu_required": False,
          }


      def base_payload():
          return {
              "service": "gpt-researcher-demo",
              "template_id": "gpt-researcher",
              "upstream": UPSTREAM,
              "release": RELEASE,
              "commit": COMMIT,
              "release_published_at": RELEASE_PUBLISHED_AT,
              "pypi_package": "gpt-researcher",
              "pypi_version": PYPI_VERSION,
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "credentials_configured": configured_credentials(),
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "gpt-researcher-demo/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              request = urlparse(self.path)
              path = request.path.rstrip("/") or "/"

              if path == "/":
                  payload = base_payload()
                  payload.update({
                      "ok": True,
                      "endpoints": ["/healthz", "/demo", "/v1/models", "/upstream"],
                  })
                  self.respond_json(200, payload)
                  return

              if path == "/healthz":
                  payload = base_payload()
                  payload.update({
                      "ok": True,
                      "status": "ready",
                      "verification_status": verification_snapshot()["status"],
                      "default_mode": "credential-free local demo",
                      "external_llm_calls": False,
                      "external_search_calls": False,
                      "browser_automation": False,
                      "model_downloaded": False,
                  })
                  self.respond_json(200, payload)
                  return

              if path == "/demo":
                  params = parse_qs(request.query)
                  query = params.get("query", ["How does GPT Researcher run safely on Phala Cloud?"])[0]
                  query = " ".join(query.split())[:240] or "GPT Researcher on Phala Cloud"
                  try:
                      limit = int(params.get("sources", [str(max_sources())])[0])
                  except ValueError:
                      limit = max_sources()
                  limit = max(1, min(limit, len(DOCS)))
                  payload = base_payload()
                  payload.update({
                      "ok": True,
                      "cpu_only": True,
                      "credential_free_by_default": True,
                      "demo": run_demo(query, limit),
                  })
                  self.respond_json(200, payload)
                  return

              if path == "/v1/models":
                  payload = base_payload()
                  payload.update({
                      "ok": True,
                      "object": "list",
                      "data": [
                          {
                              "id": "gpt-researcher-local-demo",
                              "object": "model",
                              "created": 0,
                              "owned_by": "assafelovic",
                              "description": (
                                  "Compatibility endpoint for the local deterministic "
                                  "GPT Researcher demo. It is not an inference model."
                              ),
                          }
                      ],
                  })
                  self.respond_json(200, payload)
                  return

              if path == "/upstream":
                  payload = base_payload()
                  payload.update({
                      "ok": True,
                      "verification": verification_snapshot(),
                      "notes": [
                          "Verification fetches public GitHub and PyPI metadata only.",
                          "Provider credentials are not required or used by the demo server.",
                      ],
                  })
                  self.respond_json(200, payload)
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      threading.Thread(target=run_verification, daemon=True).start()
      port = int(os.environ.get("PORT", "8080"))
      server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
      print(f"gpt-researcher demo server listening on 0.0.0.0:{port}", flush=True)
      server.serve_forever()
