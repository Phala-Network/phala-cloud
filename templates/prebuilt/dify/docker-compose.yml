services:
  app:
    image: python:3.12-slim-bookworm
    ports:
      - "8000:8000"
    environment:
      DIFY_UPSTREAM: "https://github.com/langgenius/dify"
      DIFY_RELEASE: "1.14.2"
      DIFY_COMMIT: "7f392b6950c2e6fd1b5b7f746badb3b4581d705d"
      DIFY_RELEASE_PUBLISHED_AT: "2026-05-19T05:34:25Z"
      VERIFY_TIMEOUT_SECONDS: "15"
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - /server.py
    configs:
      - source: server_py
        target: /server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

configs:
  server_py:
    content: |
      import hashlib
      import json
      import os
      import platform
      import sys
      import threading
      import time
      import urllib.error
      import urllib.parse
      import urllib.request
      from datetime import datetime, timezone
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      STARTED_AT = time.time()
      SERVICE = "dify-source-runtime-verifier"
      UPSTREAM = os.environ.get("DIFY_UPSTREAM", "https://github.com/langgenius/dify")
      RELEASE = os.environ.get("DIFY_RELEASE", "1.14.2")
      COMMIT = os.environ.get("DIFY_COMMIT", "7f392b6950c2e6fd1b5b7f746badb3b4581d705d")
      RELEASE_PUBLISHED_AT = os.environ.get("DIFY_RELEASE_PUBLISHED_AT", "2026-05-19T05:34:25Z")
      TIMEOUT_SECONDS = float(os.environ.get("VERIFY_TIMEOUT_SECONDS", "15"))

      FILES = [
          {
              "path": "README.md",
              "sha256": "7ed3935fcbeda83b1b82fb4a11832baf2978c8fbc1c0f08c9b7c93d0392c82da",
              "checks": [
                  ("description", "Dify is an open-source LLM app development platform"),
                  ("workflow_feature", "AI workflow"),
                  ("rag_feature", "RAG pipeline"),
                  ("agent_feature", "agent capabilities"),
                  ("minimum_cpu", "CPU >= 2 Core"),
                  ("minimum_memory", "RAM >= 4 GiB"),
                  ("docker_compose_quickstart", "docker/docker-compose.yaml"),
              ],
          },
          {
              "path": "api/pyproject.toml",
              "sha256": "c2008ad792df363accc5a394d20b48a998ec6d4b77128c632c9f462b52d142d4",
              "checks": [
                  ("api_package_name", 'name = "dify-api"'),
                  ("api_version", 'version = "1.14.2"'),
                  ("python_runtime", 'requires-python = "~=3.12.0"'),
                  ("flask_dependency", "flask>=3.1.3"),
                  ("celery_dependency", "celery>=5.6.3"),
                  ("postgres_dependency", "psycopg2-binary>=2.9.12"),
              ],
          },
          {
              "path": "web/package.json",
              "sha256": "667fc28118e2b39411bc7c4cb57e13f9cf2c13dc2ae720eb35542a9c04ca45a2",
              "checks": [
                  ("web_package_name", '"name": "dify-web"'),
                  ("web_version", '"version": "1.14.2"'),
                  ("next_runtime", '"next": "catalog:"'),
                  ("react_runtime", '"react": "catalog:"'),
                  ("start_script", '"start": "node ./scripts/copy-and-start.mjs"'),
              ],
          },
          {
              "path": "docker/docker-compose.yaml",
              "sha256": "2bb25e526911dd74b13ff097b6c639022faa0171f4c539230469486bd77e554c",
              "checks": [
                  ("generated_compose_notice", "This file is auto-generated by generate_docker_compose"),
                  ("upstream_environment_file_usage", "env" + "_file:"),
                  ("api_image", "langgenius/dify-api:1.14.2"),
                  ("web_image", "langgenius/dify-web:1.14.2"),
                  ("worker_service", "worker:"),
                  ("postgres_service", "db_postgres:"),
                  ("redis_service", "redis:"),
                  ("weaviate_service", "weaviate:"),
                  ("sandbox_service", "sandbox:"),
                  ("plugin_daemon_service", "plugin_daemon:"),
                  ("nginx_service", "nginx:"),
                  ("upstream_storage_bind_mount", "." + "/volumes/app/storage:/app/api/storage"),
              ],
          },
          {
              "path": "docker/.env.example",
              "sha256": "72e28d5dfa56969a695d87f25a8f2f93a2555874e4bf58587acec28d350d1639",
              "checks": [
                  ("deployment_env", "DEPLOY_ENV=PRODUCTION"),
                  ("database_default", "DB_TYPE=postgresql"),
                  ("vector_default", "VECTOR_STORE=weaviate"),
                  ("sandbox_endpoint", "CODE_EXECUTION_ENDPOINT=http://sandbox:8194"),
                  ("plugin_daemon_endpoint", "PLUGIN_DAEMON_URL=http://plugin_daemon:5002"),
                  ("marketplace_endpoint", "MARKETPLACE_API_URL=https://marketplace.dify.ai"),
                  (
                      "compose_profiles",
                      "COMPOSE_PROFILES=" + chr(36) + "{VECTOR_STORE:-weaviate}," + chr(36) + "{DB_TYPE:-postgresql},collaboration",
                  ),
              ],
          },
      ]

      VERIFY_LOCK = threading.Lock()
      VERIFY_DONE = threading.Event()
      VERIFY_RESULT = {
          "status": "starting",
          "ok": None,
          "message": "verification has not completed yet",
      }


      def iso_now():
          return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


      def set_result(result):
          global VERIFY_RESULT
          with VERIFY_LOCK:
              VERIFY_RESULT = result
          if result.get("status") in ("complete", "error"):
              VERIFY_DONE.set()


      def get_result():
          with VERIFY_LOCK:
              return json.loads(json.dumps(VERIFY_RESULT))


      def raw_url(path):
          quoted = urllib.parse.quote(path, safe="/")
          return f"https://raw.githubusercontent.com/langgenius/dify/{RELEASE}/{quoted}"


      def fetch_bytes(url):
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "phala-dify-template-verifier/1.0"},
          )
          with urllib.request.urlopen(request, timeout=TIMEOUT_SECONDS) as response:
              return response.read()


      def verify_file(spec):
          url = raw_url(spec["path"])
          item = {
              "path": spec["path"],
              "url": url,
              "expected_sha256": spec["sha256"],
          }
          try:
              body = fetch_bytes(url)
              text = body.decode("utf-8", errors="replace")
              actual = hashlib.sha256(body).hexdigest()
              checks = []
              checks_ok = True
              for name, needle in spec.get("checks", []):
                  ok = needle in text
                  checks.append({"name": name, "ok": ok})
                  checks_ok = checks_ok and ok

              item.update({
                  "ok": actual == spec["sha256"] and checks_ok,
                  "bytes": len(body),
                  "sha256": actual,
                  "sha256_ok": actual == spec["sha256"],
                  "checks": checks,
              })
          except (urllib.error.URLError, TimeoutError, OSError) as exc:
              item.update({
                  "ok": False,
                  "error": f"{type(exc).__name__}: {exc}",
              })
          return item


      def runtime_facts():
          return {
              "python": sys.version.split()[0],
              "implementation": platform.python_implementation(),
              "platform": platform.platform(),
              "dify_api_requires_python": "~=3.12.0",
              "compatible_with_upstream_api_range": sys.version_info[:2] == (3, 12),
          }


      def verify_upstream():
          try:
              set_result({
                  "status": "running",
                  "ok": None,
                  "started_at": iso_now(),
                  "release": RELEASE,
                  "commit": COMMIT,
              })

              files = [verify_file(spec) for spec in FILES]
              files_ok = all(item.get("ok") is True for item in files)
              runtime = runtime_facts()

              result = {
                  "status": "complete",
                  "ok": files_ok and runtime["compatible_with_upstream_api_range"],
                  "verified_at": iso_now(),
                  "release": RELEASE,
                  "commit": COMMIT,
                  "release_published_at": RELEASE_PUBLISHED_AT,
                  "upstream": UPSTREAM,
                  "release_url": f"{UPSTREAM}/releases/tag/{RELEASE}",
                  "runtime": runtime,
                  "files": files,
                  "production_dify_requirements": {
                      "minimum_cpu_cores_from_readme": ">=2",
                      "minimum_memory_gib_from_readme": ">=4",
                      "services_seen_in_upstream_compose": [
                          "api",
                          "worker",
                          "web",
                          "PostgreSQL or another configured database",
                          "Redis",
                          "Weaviate or another vector store",
                          "sandbox",
                          "plugin_daemon",
                          "ssrf_proxy",
                          "nginx",
                      ],
                      "uses_environment_files": True,
                      "uses_host_storage_mounts": True,
                  },
                  "template_mode": "cpu-safe Dify source and runtime verifier",
                  "full_stack_started": False,
                  "model_weights_downloaded": False,
                  "provider_credentials_required": False,
                  "gpu_required": False,
              }
              set_result(result)
          except Exception as exc:
              set_result({
                  "status": "error",
                  "ok": False,
                  "verified_at": iso_now(),
                  "release": RELEASE,
                  "commit": COMMIT,
                  "upstream": UPSTREAM,
                  "error": f"{type(exc).__name__}: {exc}",
              })


      def start_verifier():
          thread = threading.Thread(target=verify_upstream, name="dify-verifier", daemon=True)
          thread.start()


      def health_payload():
          result = get_result()
          return {
              "ok": result.get("status") in ("running", "complete") and result.get("ok") is not False,
              "service": SERVICE,
              "status": result.get("status"),
              "upstream": UPSTREAM,
              "release": RELEASE,
              "commit": COMMIT,
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "credentials_required": False,
              "remote_model_calls": False,
              "full_stack_started": False,
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "dify-template-verifier/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              path = urllib.parse.urlparse(self.path).path

              if path in ("/", "/healthz"):
                  self.respond_json(200, health_payload())
                  return

              if path == "/demo":
                  VERIFY_DONE.wait(timeout=max(1.0, TIMEOUT_SECONDS * len(FILES) + 2.0))
                  result = get_result()
                  payload = {
                      "ok": result.get("ok") is True,
                      "service": SERVICE,
                      "demo": {
                          "mode": "cpu-safe Dify source and runtime verifier",
                          "pinned_release": RELEASE,
                          "pinned_commit": COMMIT,
                          "upstream": UPSTREAM,
                          "checks": result,
                          "full_stack_started": False,
                          "model_weights_downloaded": False,
                          "model_loaded": False,
                          "provider_credentials_required": False,
                          "remote_model_calls": False,
                          "gpu_required": False,
                          "safe_for_tdx_small_smoke": True,
                      },
                  }
                  self.respond_json(200, payload)
                  return

              if path == "/v1/models":
                  payload = {
                      "object": "list",
                      "data": [
                          {
                              "id": f"dify-source-verifier-{RELEASE}",
                              "object": "model",
                              "created": 1779168865,
                              "owned_by": "langgenius-dify-template",
                              "description": "Local Dify upstream verifier endpoint; no LLM provider or model runtime is loaded.",
                          }
                      ],
                      "template_mode": "verifier-demo",
                      "upstream": UPSTREAM,
                      "release": RELEASE,
                      "model_loaded": False,
                  }
                  self.respond_json(200, payload)
                  return

              self.respond_json(404, {"ok": False, "error": "not found"})


      def main():
          start_verifier()
          port = int(os.environ.get("PORT", "8000"))
          server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
          print(f"{SERVICE} listening on 0.0.0.0:{port}", flush=True)
          server.serve_forever()


      if __name__ == "__main__":
          main()
