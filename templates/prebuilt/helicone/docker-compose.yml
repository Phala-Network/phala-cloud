services:
  app:
    image: python:3.12-slim-bookworm
    ports:
      - "8080:8080"
    environment:
      HELICONE_SOURCE_REF: ${HELICONE_SOURCE_REF:-094b210b405a3dcc4887d55bfe2d4b4c37af2f20}
      VERIFY_TIMEOUT_SECONDS: ${VERIFY_TIMEOUT_SECONDS:-15}
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - /server.py
    configs:
      - source: server_py
        target: /server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s
    restart: unless-stopped

configs:
  server_py:
    content: |
      import hashlib
      import json
      import os
      import platform
      import sys
      import threading
      import time
      import urllib.error
      import urllib.parse
      import urllib.request
      from datetime import datetime, timezone
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      STARTED_AT = time.time()
      SERVICE = "helicone-source-verifier"
      SOURCE_REPO = "Helicone/helicone"
      UPSTREAM = f"https://github.com/{SOURCE_REPO}"
      RAW_BASE = f"https://raw.githubusercontent.com/{SOURCE_REPO}"
      DEFAULT_REF = "094b210b405a3dcc4887d55bfe2d4b4c37af2f20"
      SOURCE_REF = os.environ.get("HELICONE_SOURCE_REF", DEFAULT_REF).strip() or DEFAULT_REF
      TIMEOUT_SECONDS = float(os.environ.get("VERIFY_TIMEOUT_SECONDS", "15"))
      MAX_SOURCE_BYTES = 1024 * 1024

      SOURCE_FILES = [
          {
              "path": "README.md",
              "sha256": "80c63bc9e4335ab1b4174a452b1fe77074c819d58e982279cacaea2e1efd2a6f",
              "purpose": "Project README and high-level Helicone positioning",
              "checks": [
                  ("ai_gateway_positioning", "AI Gateway"),
                  ("llm_observability_positioning", "LLM Observability"),
                  ("self_hosting_section", "Self-Hosting Open Source LLM Observability"),
                  ("architecture_section", "Helicone is comprised of five services"),
              ],
          },
          {
              "path": "package.json",
              "sha256": "d1c8f71a74565eb9f4722d409d873d93b4f447730f997c4c7502d0096c58584e",
              "purpose": "Monorepo package metadata",
              "checks": [
                  ("monorepo_name", '"name": "helicone-monorepo"'),
                  ("node_20_engine", '"node": ">=20"'),
                  ("web_workspace", '"web"'),
                  ("jawn_workspace", '"valhalla/jawn"'),
                  ("worker_workspace", '"worker"'),
              ],
          },
          {
              "path": "docker/docker-compose.yml",
              "sha256": "32c80112cb87dc90823f0b1bfd5a59e3d2715a77854a2d665d3becc9295e41df",
              "purpose": "Upstream self-host compose topology",
              "checks": [
                  ("postgres_service", "postgres:17.4"),
                  ("clickhouse_service", "clickhouse/clickhouse-server:24.3.13.40"),
                  ("minio_service", "minio/minio"),
                  ("include_helicone_profile", 'profiles: ["include-helicone"]'),
                  ("workers_profile", 'profiles: ["workers"]'),
                  ("kafka_profile", 'profiles: ["kafka"]'),
                  ("web_dockerfile", "docker/dockerfiles/dockerfile_web"),
                  ("jawn_dockerfile", "valhalla/dockerfile"),
              ],
          },
          {
              "path": "docker/helicone-compose.sh",
              "sha256": "37f6e3d3f45f24e7e1a69431bc40e6ba094dbf9f470bbe2d18e03e12212b0f3f",
              "purpose": "Upstream compose helper profile names",
              "checks": [
                  ("profile_help", "Available Profiles"),
                  ("infra_profile", "infra"),
                  ("helicone_profile", "helicone"),
                  ("workers_profile", "workers"),
                  ("all_profile", "all"),
              ],
          },
      ]

      STATIC_FACTS = {
          "display_name": "Helicone/helicone",
          "category": "LLM Gateways, Proxies & API Management",
          "upstream": UPSTREAM,
          "inspected_ref": DEFAULT_REF,
          "inspected_commit_date": "2026-05-18T23:17:54Z",
          "license": "Apache-2.0",
          "official_all_in_one_image": "helicone/helicone-all-in-one:latest",
          "official_all_in_one_image_size_bytes_inspected": 3490133731,
          "upstream_components": ["Web", "Worker", "Jawn", "Supabase", "ClickHouse", "MinIO"],
          "default_template_scope": "CPU-safe verifier and metadata demo only",
      }

      VERIFY_LOCK = threading.Lock()
      VERIFY_RESULT = {
          "status": "starting",
          "ok": False,
          "message": "verification has not completed yet",
          "ref": SOURCE_REF,
      }


      def iso_now():
          return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


      def raw_url(path):
          quoted_ref = urllib.parse.quote(SOURCE_REF, safe="")
          quoted_path = urllib.parse.quote(path, safe="/")
          return f"{RAW_BASE}/{quoted_ref}/{quoted_path}"


      def fetch_bytes(url):
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "phala-cloud-helicone-template-verifier/1.0"},
          )
          with urllib.request.urlopen(request, timeout=TIMEOUT_SECONDS) as response:
              data = response.read(MAX_SOURCE_BYTES + 1)
          if len(data) > MAX_SOURCE_BYTES:
              raise RuntimeError(f"upstream response exceeds {MAX_SOURCE_BYTES} bytes")
          return data


      def verify_file(spec):
          url = raw_url(spec["path"])
          item = {
              "path": spec["path"],
              "purpose": spec["purpose"],
              "url": url,
          }
          try:
              body = fetch_bytes(url)
              text = body.decode("utf-8", errors="replace")
              actual_sha256 = hashlib.sha256(body).hexdigest()
              expected_sha256 = spec["sha256"] if SOURCE_REF == DEFAULT_REF else None
              marker_results = []
              markers_ok = True
              for name, needle in spec["checks"]:
                  ok = needle in text
                  marker_results.append({"name": name, "ok": ok})
                  markers_ok = markers_ok and ok

              sha256_ok = None if expected_sha256 is None else actual_sha256 == expected_sha256
              item.update({
                  "ok": markers_ok and sha256_ok is not False,
                  "bytes": len(body),
                  "sha256": actual_sha256,
                  "expected_sha256": expected_sha256,
                  "sha256_ok": sha256_ok,
                  "checks": marker_results,
              })
          except (urllib.error.URLError, TimeoutError, OSError, UnicodeError, RuntimeError) as exc:
              item.update({
                  "ok": False,
                  "error": f"{type(exc).__name__}: {exc}",
              })
          return item


      def verify_source():
          result = {
              "status": "checking",
              "ok": False,
              "message": "checking selected public upstream Helicone files",
              "started_at": iso_now(),
              "completed_at": None,
              "source_repo": SOURCE_REPO,
              "upstream": UPSTREAM,
              "ref": SOURCE_REF,
              "default_ref": DEFAULT_REF,
              "pinned_sha256_enforced": SOURCE_REF == DEFAULT_REF,
              "files": [],
              "errors": [],
              "cpu_only": True,
              "full_helicone_stack_running": False,
              "dashboard_running": False,
              "llm_proxy_running": False,
              "provider_credentials_required": False,
              "llm_provider_calls": False,
              "model_downloaded": False,
              "database_started": False,
          }
          for spec in SOURCE_FILES:
              item = verify_file(spec)
              result["files"].append(item)
              if not item.get("ok"):
                  result["errors"].append({
                      "path": item["path"],
                      "error": item.get("error", "expected source markers or pinned hash did not match"),
                  })

          result["ok"] = not result["errors"]
          result["status"] = "ready" if result["ok"] else "source_check_failed"
          result["completed_at"] = iso_now()
          result["message"] = (
              "Verified selected public Helicone upstream source files and markers without "
              "starting the full dashboard, Jawn proxy, workers, databases, object storage, "
              "model downloads, or provider API calls."
              if result["ok"]
              else "The HTTP verifier is running, but one or more upstream source checks failed."
          )
          set_result(result)


      def set_result(result):
          global VERIFY_RESULT
          with VERIFY_LOCK:
              VERIFY_RESULT = result


      def get_result():
          with VERIFY_LOCK:
              return json.loads(json.dumps(VERIFY_RESULT))


      def base_payload():
          return {
              "service": SERVICE,
              "display_name": STATIC_FACTS["display_name"],
              "upstream": UPSTREAM,
              "source_ref": SOURCE_REF,
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "endpoints": ["/healthz", "/demo", "/v1/models", "/upstream"],
          }


      def health_payload():
          result = get_result()
          payload = base_payload()
          payload.update({
              "ok": result.get("ok") is True,
              "status": result.get("status", "unknown"),
              "message": result.get("message"),
              "cpu_only": True,
              "credentials_required": False,
              "full_helicone_stack_running": False,
              "dashboard_running": False,
              "llm_provider_calls": False,
              "source_check_completed": result.get("completed_at") is not None,
          })
          if result.get("errors"):
              payload["errors"] = result["errors"]
          return payload


      def demo_payload():
          result = get_result()
          payload = base_payload()
          payload.update({
              "ok": result.get("ok") is True,
              "status": result.get("status", "unknown"),
              "name": "Helicone verifier demo",
              "description": (
                  "This deployment demonstrates Helicone gateway and observability metadata. "
                  "It does not run the full Helicone Cloud dashboard or proxy requests to LLM providers."
              ),
              "credentials_required": False,
              "llm_provider_calls": False,
              "full_helicone_stack_running": False,
              "demo_request": {
                  "route_shape": "/v1/gateway/oai/v1/chat/completions",
                  "auth_placeholders": [
                      "Authorization: Bearer <provider-api-key>",
                      "Helicone-Auth: Bearer <helicone-api-key>",
                  ],
                  "observability_fields": [
                      "request_id",
                      "provider",
                      "model",
                      "latency_ms",
                      "cost_usd",
                      "custom_properties",
                  ],
                  "performed": False,
              },
              "upstream_components": STATIC_FACTS["upstream_components"],
              "source_check": {
                  "ok": result.get("ok") is True,
                  "status": result.get("status", "unknown"),
                  "verified_files": [
                      {
                          "path": item.get("path"),
                          "ok": item.get("ok"),
                          "sha256_ok": item.get("sha256_ok"),
                      }
                      for item in result.get("files", [])
                  ],
              },
          })
          return payload


      def models_payload():
          return {
              "object": "list",
              "data": [
                  {
                      "id": "helicone/verifier-demo",
                      "object": "model",
                      "created": 0,
                      "owned_by": "Helicone",
                      "description": (
                          "Metadata-only placeholder for OpenAI-compatible smoke tests. "
                          "This template does not host, route to, or download an LLM model."
                      ),
                  }
              ],
              "demo": {
                  "model_server_running": False,
                  "llm_provider_calls": False,
                  "credentials_required": False,
              },
          }


      def upstream_payload():
          result = get_result()
          payload = base_payload()
          payload.update({
              "ok": result.get("ok") is True,
              "facts": STATIC_FACTS,
              "source_check": result,
          })
          return payload


      class Handler(BaseHTTPRequestHandler):
          server_version = "helicone-source-verifier/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              path = urllib.parse.urlparse(self.path).path.rstrip("/") or "/"
              if path in ("/", "/healthz"):
                  self.respond_json(200, health_payload())
                  return
              if path == "/demo":
                  self.respond_json(200, demo_payload())
                  return
              if path == "/v1/models":
                  self.respond_json(200, models_payload())
                  return
              if path == "/upstream":
                  self.respond_json(200, upstream_payload())
                  return
              self.respond_json(404, {
                  "error": "not_found",
                  "endpoints": ["/healthz", "/demo", "/v1/models", "/upstream"],
              })


      if __name__ == "__main__":
          print(
              json.dumps({
                  "event": "startup",
                  "service": SERVICE,
                  "source_ref": SOURCE_REF,
                  "credentials_required": False,
                  "full_helicone_stack_running": False,
              }),
              flush=True,
          )
          threading.Thread(target=verify_source, daemon=True).start()
          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
