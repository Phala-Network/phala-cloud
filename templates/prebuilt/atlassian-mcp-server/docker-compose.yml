services:
  proxy:
    image: caddy:2.8
    ports:
      - "18080:80"
    environment:
      - BEARER_TOKEN=${BEARER_TOKEN}
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    restart: unless-stopped

configs:
  caddy_config:
    content: |
      :80 {
          @valid_auth {
              header X-Phala-MCP-Token "{env.BEARER_TOKEN}"
          }
          route @valid_auth {
              rewrite * /v1/mcp
              reverse_proxy https://mcp.atlassian.com {
                  header_up Host mcp.atlassian.com
              }
          }
          route {
              respond 401 {
                  body "Unauthorized"
                  close
              }
          }
      }
