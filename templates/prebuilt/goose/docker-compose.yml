services:
  app:
    image: python:3.11-slim-bookworm
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      GOOSE_VERSION: ${GOOSE_VERSION:-1.35.0}
      GOOSE_BIN_DIR: /opt/goose/bin
      GOOSE_LINUX_VARIANT: standard
      CONFIGURE: "false"
      HOME: /opt/goose-home
      XDG_CONFIG_HOME: /opt/goose-home/.config
      XDG_DATA_HOME: /opt/goose-home/.local/share
      XDG_STATE_HOME: /opt/goose-home/.local/state
      GOOSE_DISABLE_KEYRING: "1"
      GOOSE_TELEMETRY_ENABLED: "false"
      GOOSE_DISABLE_SESSION_NAMING: "true"
      GOOSE_DISABLE_TOOL_CALL_SUMMARY: "true"
      GOOSE_PROVIDER: ${GOOSE_PROVIDER:-}
      GOOSE_MODEL: ${GOOSE_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_HOST: ${OPENAI_HOST:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_HOST: ${ANTHROPIC_HOST:-}
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: "1"
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        export PATH="$$GOOSE_BIN_DIR:$$PATH"

        if ! command -v curl >/dev/null 2>&1 || ! command -v bzip2 >/dev/null 2>&1 || ! dpkg-query -W libgomp1 >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl bzip2 tar libgomp1
          rm -rf /var/lib/apt/lists/*
        fi

        mkdir -p "$$GOOSE_BIN_DIR" "$$HOME" "$$XDG_CONFIG_HOME" "$$XDG_DATA_HOME" "$$XDG_STATE_HOME"
        requested_version="$${GOOSE_VERSION:-1.35.0}"
        installed_version="$$(cat "$$GOOSE_BIN_DIR/.goose-version" 2>/dev/null || true)"

        if [ ! -x "$$GOOSE_BIN_DIR/goose" ] || [ "$$installed_version" != "$$requested_version" ]; then
          rm -f "$$GOOSE_BIN_DIR/goose"
          workdir="$$(mktemp -d)"
          cd "$$workdir"
          export GOOSE_VERSION="$$requested_version"
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | bash
          printf '%s\n' "$$requested_version" > "$$GOOSE_BIN_DIR/.goose-version"
          rm -rf "$$workdir"
        fi

        exec python /server.py
    configs:
      - source: server_py
        target: /server.py
      - source: smoke_recipe
        target: /smoke-recipe.yaml
    volumes:
      - goose_bin:/opt/goose/bin
      - goose_home:/opt/goose-home
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen("http://127.0.0.1:%s/healthz" % os.environ.get("PORT", "8080"), timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s

volumes:
  goose_bin:
  goose_home:

configs:
  smoke_recipe:
    content: |
      version: 1.0.0
      title: Phala Goose Smoke Recipe
      description: Validate Goose recipe parsing without model provider credentials.
      instructions: You are a local verifier for a Phala Cloud Goose template.
      prompt: Report the installed Goose CLI version and confirm recipe validation passed.
  server_py:
    content: |
      import json
      import os
      import platform
      import subprocess
      import time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import urlparse

      STARTED_AT = time.time()
      GOOSE_BIN = os.environ.get("GOOSE_BIN") or os.path.join(os.environ.get("GOOSE_BIN_DIR", "/opt/goose/bin"), "goose")
      RECIPE_PATH = os.environ.get("GOOSE_RECIPE_PATH", "/smoke-recipe.yaml")
      UPSTREAM = "https://github.com/block/goose"
      CURRENT_REPO = "https://github.com/aaif-goose/goose"
      COMMAND_TIMEOUT_SECONDS = 15


      def clean_text(value):
          return (value or "").replace("\x1b", "").strip()[:4000]


      def run_command(args, timeout=COMMAND_TIMEOUT_SECONDS):
          started = time.time()
          command = [GOOSE_BIN] + args
          try:
              result = subprocess.run(
                  command,
                  check=False,
                  cwd="/tmp",
                  env=os.environ.copy(),
                  text=True,
                  capture_output=True,
                  timeout=timeout,
              )
              return {
                  "ok": result.returncode == 0,
                  "command": " ".join(command),
                  "exit_code": result.returncode,
                  "stdout": clean_text(result.stdout),
                  "stderr": clean_text(result.stderr),
                  "duration_ms": int((time.time() - started) * 1000),
              }
          except Exception as exc:
              return {
                  "ok": False,
                  "command": " ".join(command),
                  "exit_code": None,
                  "stdout": "",
                  "stderr": "",
                  "error": type(exc).__name__ + ": " + str(exc),
                  "duration_ms": int((time.time() - started) * 1000),
              }


      def configured_provider_state():
          keys = [
              "GOOSE_PROVIDER",
              "GOOSE_MODEL",
              "OPENAI_API_KEY",
              "OPENAI_HOST",
              "ANTHROPIC_API_KEY",
              "ANTHROPIC_HOST",
          ]
          return {key.lower() + "_configured": bool(os.environ.get(key)) for key in keys}


      def inspect_goose():
          version = run_command(["--version"])
          info = run_command(["info"])
          recipe = run_command(["recipe", "validate", RECIPE_PATH])
          return {
              "ok": version["ok"] and info["ok"] and recipe["ok"],
              "version": version,
              "info": info,
              "recipe_validation": recipe,
          }


      def base_payload():
          return {
              "service": "goose-cli-demo",
              "upstream": UPSTREAM,
              "current_upstream_home": CURRENT_REPO,
              "goose_version_requested": os.environ.get("GOOSE_VERSION", "1.35.0"),
              "python": platform.python_version(),
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "cpu_only": True,
              "credentials_required_for_health": False,
              "remote_model_calls": False,
              "model_downloaded": False,
              "model_loaded": False,
              "configured_provider_env": configured_provider_state(),
          }


      def response_for(path):
          if path in ("/", "/healthz"):
              checks = inspect_goose()
              payload = base_payload()
              payload.update({
                  "ok": checks["ok"],
                  "status": "ready" if checks["ok"] else "unhealthy",
                  "checks": checks,
              })
              return (200 if checks["ok"] else 503), payload

          if path == "/demo":
              checks = inspect_goose()
              payload = base_payload()
              payload.update({
                  "ok": checks["ok"],
                  "name": "Goose CLI local verifier",
                  "description": "Installs the real upstream Goose CLI, checks CLI metadata, and validates a local Goose recipe without provider credentials.",
                  "what_ran": [
                      "goose --version",
                      "goose info",
                      "goose recipe validate /smoke-recipe.yaml",
                  ],
                  "verifies": [
                      "The upstream Goose CLI binary is installed and executable.",
                      "Goose can inspect its local configuration paths.",
                      "Goose recipe validation works without an LLM provider or API key.",
                      "No model provider request is made by the smoke path.",
                  ],
                  "checks": checks,
              })
              return (200 if checks["ok"] else 503), payload

          if path == "/v1/models":
              checks = inspect_goose()
              payload = {
                  "object": "list",
                  "data": [
                      {
                          "id": "goose-cli-local-verifier",
                          "object": "model",
                          "created": 1719878400,
                          "owned_by": "aaif-goose",
                          "description": "Metadata-only endpoint for the local Goose CLI verifier. No model is hosted and no provider API is called.",
                      }
                  ],
                  "goose_cli_present": checks["version"]["ok"],
                  "goose_version_output": checks["version"]["stdout"],
                  "remote_model_calls": False,
              }
              return 200, payload

          return 404, {"ok": False, "error": "not found", "endpoints": ["/healthz", "/demo", "/v1/models"]}


      class Handler(BaseHTTPRequestHandler):
          server_version = "goose-cli-demo/1.0"

          def log_message(self, fmt, *args):
              print("%s - %s" % (self.address_string(), fmt % args), flush=True)

          def write_json(self, status, payload):
              body = (json.dumps(payload, indent=2, sort_keys=True) + "\n").encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              if self.command != "GET":
                  self.write_json(405, {"ok": False, "error": "method not allowed"})
                  return

              path = urlparse(self.path).path.rstrip("/") or "/"
              try:
                  status, payload = response_for(path)
              except Exception as exc:
                  status, payload = 500, {"ok": False, "error": type(exc).__name__ + ": " + str(exc)}
              self.write_json(status, payload)


      def main():
          port = int(os.environ.get("PORT", "8080"))
          server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
          print(json.dumps({
              "event": "startup",
              "service": "goose-cli-demo",
              "port": port,
              "goose_bin": GOOSE_BIN,
              "credentials_required_for_health": False,
          }), flush=True)
          server.serve_forever()


      if __name__ == "__main__":
          main()
