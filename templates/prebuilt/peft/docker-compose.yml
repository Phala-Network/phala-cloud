services:
  app:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    environment:
      APP_PORT: ${APP_PORT:-8000}
      PEFT_PACKAGE_VERSION: ${PEFT_PACKAGE_VERSION:-0.19.1}
      TORCH_CPU_VERSION: ${TORCH_CPU_VERSION:-2.7.1+cpu}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      TRANSFORMERS_NO_ADVISORY_WARNINGS: ${TRANSFORMERS_NO_ADVISORY_WARNINGS:-1}
      PYTHONUNBUFFERED: "1"
      UV_SYSTEM_PYTHON: "1"
      HF_HOME: /tmp/huggingface
    configs:
      - source: peft_demo_app
        target: /opt/peft-demo/main.py
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        uv pip install --system --no-cache --index-url https://download.pytorch.org/whl/cpu "torch==$${TORCH_CPU_VERSION}"
        uv pip install --system --no-cache "peft==$${PEFT_PACKAGE_VERSION}"
        exec python /opt/peft-demo/main.py
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, sys, urllib.request; port = os.environ.get('APP_PORT', '8000'); response = urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=5); sys.exit(0 if response.status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - internal

  proxy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "8080:80"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          encode zstd gzip
          header {
              X-Content-Type-Options "nosniff"
              Referrer-Policy "no-referrer"
              -Server
          }
          reverse_proxy app:8000
      }

  peft_demo_app:
    content: |
      import importlib
      import importlib.metadata
      import json
      import os
      import platform
      import sys
      import time
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import urlparse


      STARTED_AT = time.time()
      PACKAGE_NAME = "peft"


      def import_checks():
          result = {
              "package": PACKAGE_NAME,
              "distribution_version": None,
              "module_version": None,
              "import_ok": False,
              "checks": {},
              "torch": {},
              "demo_config": None,
              "error": None,
          }
          try:
              result["distribution_version"] = importlib.metadata.version(PACKAGE_NAME)
              peft = importlib.import_module(PACKAGE_NAME)
              torch = importlib.import_module("torch")
              from peft import LoraConfig, PeftConfig, TaskType, get_peft_model

              config = LoraConfig(
                  r=4,
                  lora_alpha=8,
                  target_modules=["q_proj"],
                  lora_dropout=0.0,
                  task_type=TaskType.CAUSAL_LM,
              )
              result["module_version"] = getattr(peft, "__version__", None)
              result["checks"] = {
                  "LoraConfig": hasattr(peft, "LoraConfig"),
                  "PeftConfig": hasattr(peft, "PeftConfig"),
                  "TaskType": hasattr(peft, "TaskType"),
                  "get_peft_model": callable(get_peft_model),
                  "lora_config_instantiated": isinstance(config, LoraConfig),
                  "peft_config_base_present": isinstance(PeftConfig, type),
                  "task_type_causal_lm": str(config.task_type) == "TaskType.CAUSAL_LM",
              }
              result["torch"] = {
                  "version": getattr(torch, "__version__", None),
                  "cuda_available": bool(torch.cuda.is_available()),
                  "cuda_required": False,
              }
              result["demo_config"] = {
                  "adapter_type": "LoRA",
                  "r": config.r,
                  "lora_alpha": config.lora_alpha,
                  "lora_dropout": config.lora_dropout,
                  "target_modules": sorted(config.target_modules or []),
                  "task_type": str(config.task_type),
                  "inference_mode": config.inference_mode,
              }
              result["import_ok"] = (
                  bool(result["distribution_version"])
                  and bool(result["module_version"])
                  and all(result["checks"].values())
              )
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"
          return result


      IMPORT_STATUS = import_checks()


      def response_body(path):
          uptime_seconds = round(time.time() - STARTED_AT, 3)
          no_runtime_work = {
              "fine_tuning_started": False,
              "model_downloads": False,
              "model_loaded": False,
              "gpu_or_cuda_required": False,
              "provider_api_calls": False,
              "credentials_required": False,
          }

          if path == "/healthz":
              status = "ok" if IMPORT_STATUS["import_ok"] else "unhealthy"
              return HTTPStatus.OK if IMPORT_STATUS["import_ok"] else HTTPStatus.SERVICE_UNAVAILABLE, {
                  "status": status,
                  "uptime_seconds": uptime_seconds,
                  "peft": IMPORT_STATUS,
                  "runtime": no_runtime_work,
              }

          if path == "/demo":
              return HTTPStatus.OK, {
                  "name": "Hugging Face PEFT metadata demo",
                  "description": (
                      "This service imports the real PEFT Python package and verifies "
                      "safe PEFT symbols and a tiny LoRA config without loading models."
                  ),
                  "purpose": "Parameter-Efficient Fine-Tuning library verifier",
                  "runtime": no_runtime_work,
                  "building_blocks": [
                      "LoraConfig",
                      "PeftConfig",
                      "TaskType",
                      "get_peft_model",
                  ],
                  "example_adapter_config": IMPORT_STATUS["demo_config"],
                  "peft": IMPORT_STATUS,
              }

          if path == "/v1/models":
              return HTTPStatus.OK, {
                  "object": "list",
                  "data": [
                      {
                          "id": "peft/no-model-download-demo",
                          "object": "model",
                          "created": 0,
                          "owned_by": "huggingface",
                          "description": (
                              "Metadata placeholder for PEFT smoke tests. The default "
                              "template does not host, download, train, or load a model."
                          ),
                      }
                  ],
              }

          if path == "/":
              return HTTPStatus.OK, {
                  "service": "peft-demo",
                  "endpoints": ["/healthz", "/demo", "/v1/models"],
                  "python": sys.version.split()[0],
                  "platform": platform.platform(),
                  "peft_import_ok": IMPORT_STATUS["import_ok"],
                  "runtime": no_runtime_work,
              }

          return HTTPStatus.NOT_FOUND, {
              "error": "not_found",
              "endpoints": ["/healthz", "/demo", "/v1/models"],
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "peft-demo"

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      }
                  ),
                  flush=True,
              )

          def do_GET(self):
              path = urlparse(self.path).path.rstrip("/") or "/"
              status, payload = response_body(path)
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)


      if __name__ == "__main__":
          port = int(os.environ.get("APP_PORT", "8000"))
          print(
              json.dumps(
                  {
                      "event": "startup",
                      "port": port,
                      "peft": IMPORT_STATUS,
                      "fine_tuning_started": False,
                      "model_downloads": False,
                      "provider_api_calls": False,
                  }
              ),
              flush=True,
          )
          ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()

networks:
  internal:
    driver: bridge
