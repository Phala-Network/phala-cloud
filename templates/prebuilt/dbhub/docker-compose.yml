services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        WORKDIR /workspace
        EXPOSE 8000
        CMD ["sh", "-lc", "exec npx -y @bytebase/dbhub@0.21.1 --transport http --port 8000 --dsn \"$$DBHUB_DSN\""]
    image: dbhub:latest
    pull_policy: build
    environment:
      - DBHUB_DSN=${DBHUB_DSN:-}
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - internal

  proxy:
    image: caddy:2.8
    ports:
      - "18080:80"
    environment:
      - BEARER_TOKEN=${BEARER_TOKEN}
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    restart: unless-stopped
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          @valid_auth {
              header X-Phala-MCP-Token "{env.BEARER_TOKEN}"
          }
          route @valid_auth {
              reverse_proxy app:8000
          }
          route {
              respond 401 {
                  body "Unauthorized"
                  close
              }
          }
      }

networks:
  internal:
    driver: bridge
