services:
  app:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      MONEYPRINTERTURBO_REF: ${MONEYPRINTERTURBO_REF:-042deb84f01ee19936f8afc7b99ea36177502b37}
      PYTHONUNBUFFERED: "1"
      UV_SYSTEM_PYTHON: "1"
    volumes:
      - moneyprinterturbo-cache:/opt/moneyprinterturbo
    configs:
      - source: moneyprinterturbo_bootstrap
        target: /opt/moneyprinterturbo-demo/bootstrap.py
      - source: moneyprinterturbo_server
        target: /opt/moneyprinterturbo-demo/server.py
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        python /opt/moneyprinterturbo-demo/bootstrap.py
        exec python /opt/moneyprinterturbo-demo/server.py
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"PORT\", \"8080\")}/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

configs:
  moneyprinterturbo_bootstrap:
    content: |
      import io
      import json
      import os
      import shutil
      import subprocess
      import sys
      import tarfile
      import time
      import urllib.parse
      import urllib.request
      from datetime import datetime, timezone
      from pathlib import Path


      ROOT = Path("/opt/moneyprinterturbo")
      SOURCE_DIR = ROOT / "source"
      STATE_FILE = ROOT / "state.json"
      REF_FILE = ROOT / ".source-ref"
      UPSTREAM = "https://github.com/harry0703/MoneyPrinterTurbo"
      DEFAULT_REF = "042deb84f01ee19936f8afc7b99ea36177502b37"


      def log(event, **fields):
          payload = {"event": event, **fields}
          print(json.dumps(payload, sort_keys=True), flush=True)


      def run(args):
          log("run", command=args)
          subprocess.run(args, check=True)


      def current_ref():
          return os.environ.get("MONEYPRINTERTURBO_REF", DEFAULT_REF).strip() or DEFAULT_REF


      def source_is_ready(ref):
          return (
              SOURCE_DIR.joinpath("pyproject.toml").is_file()
              and SOURCE_DIR.joinpath("app", "models", "const.py").is_file()
              and REF_FILE.is_file()
              and REF_FILE.read_text(encoding="utf-8").strip() == ref
          )


      def safe_extract(data, destination):
          tmp_dir = ROOT / ".source-tmp"
          shutil.rmtree(tmp_dir, ignore_errors=True)
          tmp_dir.mkdir(parents=True, exist_ok=True)
          top_dir = None

          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              for member in archive.getmembers():
                  parts = Path(member.name).parts
                  if len(parts) < 2:
                      if parts:
                          top_dir = top_dir or parts[0]
                      continue
                  top_dir = top_dir or parts[0]
                  relative = Path(*parts[1:])
                  if relative.is_absolute() or ".." in relative.parts:
                      raise RuntimeError(f"unsafe tar path: {member.name}")
                  target = tmp_dir / relative
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  elif member.isfile():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.extractfile(member) as src, open(target, "wb") as dst:
                          if src is None:
                              raise RuntimeError(f"cannot read tar member: {member.name}")
                          shutil.copyfileobj(src, dst)
                      if member.mode:
                          target.chmod(member.mode & 0o777)

          shutil.rmtree(destination, ignore_errors=True)
          tmp_dir.rename(destination)
          return top_dir


      def download_source(ref):
          encoded_ref = urllib.parse.quote(ref, safe="")
          url = f"https://api.github.com/repos/harry0703/MoneyPrinterTurbo/tarball/{encoded_ref}"
          request = urllib.request.Request(url, headers={"User-Agent": "phala-cloud-template-verifier"})
          started = time.time()
          log("download_source", ref=ref, url=url)
          with urllib.request.urlopen(request, timeout=120) as response:
              data = response.read()
          top_dir = safe_extract(data, SOURCE_DIR)
          REF_FILE.write_text(ref + "\n", encoding="utf-8")
          return {
              "source_ref": ref,
              "source_url": url,
              "source_tree": top_dir,
              "downloaded_bytes": len(data),
              "download_seconds": round(time.time() - started, 3),
          }


      def install_package():
          run([
              "uv",
              "pip",
              "install",
              "--system",
              "--no-cache",
              "hatchling>=1.27.0",
              "toml==0.10.2",
              "loguru==0.7.3",
          ])
          run([
              "uv",
              "pip",
              "install",
              "--system",
              "--no-cache",
              "--no-deps",
              str(SOURCE_DIR),
          ])


      def main():
          ROOT.mkdir(parents=True, exist_ok=True)
          ref = current_ref()
          state = {}
          if STATE_FILE.is_file():
              try:
                  state = json.loads(STATE_FILE.read_text(encoding="utf-8"))
              except Exception:
                  state = {}

          if not source_is_ready(ref):
              state.update(download_source(ref))
          else:
              log("source_cached", ref=ref, source_dir=str(SOURCE_DIR))
              state.update({"source_ref": ref, "source_dir": str(SOURCE_DIR)})

          install_package()
          state.update({
              "upstream": UPSTREAM,
              "source_dir": str(SOURCE_DIR),
              "bootstrapped_at": datetime.now(timezone.utc).isoformat(),
              "python": sys.version.split()[0],
          })
          STATE_FILE.write_text(json.dumps(state, indent=2, sort_keys=True), encoding="utf-8")
          log("bootstrap_complete", ref=ref, source_dir=str(SOURCE_DIR))


      if __name__ == "__main__":
          main()

  moneyprinterturbo_server:
    content: |
      import ast
      import importlib.metadata
      import json
      import os
      import platform
      import sys
      import time
      import tomllib
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from pathlib import Path
      from urllib.parse import urlparse


      STARTED_AT = time.time()
      ROOT = Path("/opt/moneyprinterturbo")
      SOURCE_DIR = ROOT / "source"
      STATE_FILE = ROOT / "state.json"
      UPSTREAM = "https://github.com/harry0703/MoneyPrinterTurbo"
      HTTP_METHODS = {"get", "post", "put", "patch", "delete"}

      if str(SOURCE_DIR) not in sys.path:
          sys.path.insert(0, str(SOURCE_DIR))


      def load_state():
          try:
              return json.loads(STATE_FILE.read_text(encoding="utf-8"))
          except Exception as exc:
              return {"error": f"{type(exc).__name__}: {exc}"}


      def read_pyproject():
          result = {
              "name": None,
              "version": None,
              "description": None,
              "requires_python": None,
              "dependency_count": 0,
              "selected_dependencies": [],
              "error": None,
          }
          try:
              with SOURCE_DIR.joinpath("pyproject.toml").open("rb") as fp:
                  data = tomllib.load(fp)
              project = data.get("project", {})
              dependencies = project.get("dependencies", [])
              result.update({
                  "name": project.get("name"),
                  "version": project.get("version"),
                  "description": project.get("description"),
                  "requires_python": project.get("requires-python"),
                  "dependency_count": len(dependencies),
                  "selected_dependencies": dependencies[:8],
              })
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"
          return result


      def inspect_imports():
          result = {
              "distribution_version": None,
              "source_import_ok": False,
              "config_import_ok": False,
              "const": {},
              "config": {},
              "errors": [],
          }

          try:
              result["distribution_version"] = importlib.metadata.version("moneyprinterturbo")
          except Exception as exc:
              result["errors"].append(f"metadata: {type(exc).__name__}: {exc}")

          try:
              from app.models import const

              result["source_import_ok"] = True
              result["const"] = {
                  "file_type_videos": list(const.FILE_TYPE_VIDEOS),
                  "file_type_images": list(const.FILE_TYPE_IMAGES),
                  "task_state_complete": const.TASK_STATE_COMPLETE,
                  "punctuation_count": len(const.PUNCTUATIONS),
              }
          except Exception as exc:
              result["errors"].append(f"app.models.const: {type(exc).__name__}: {exc}")

          try:
              from app.config import config

              result["config_import_ok"] = True
              result["config"] = {
                  "project_name": config.project_name,
                  "project_version": config.project_version,
                  "listen_host": config.listen_host,
                  "listen_port": config.listen_port,
                  "configured_llm_provider": config.app.get("llm_provider", "openai"),
                  "configured_subtitle_provider": config.app.get("subtitle_provider", "edge"),
              }
          except Exception as exc:
              result["errors"].append(f"app.config.config: {type(exc).__name__}: {exc}")

          result["ok"] = bool(result["distribution_version"]) and result["source_import_ok"]
          return result


      def extract_routes():
          routes = []
          for relative_file, prefix in (
              ("app/controllers/v1/video.py", "/api/v1"),
              ("app/controllers/v1/llm.py", "/api/v1"),
          ):
              path = SOURCE_DIR / relative_file
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except Exception as exc:
                  routes.append({
                      "source": relative_file,
                      "error": f"{type(exc).__name__}: {exc}",
                  })
                  continue

              for node in ast.walk(tree):
                  if not isinstance(node, ast.FunctionDef):
                      continue
                  for decorator in node.decorator_list:
                      if not isinstance(decorator, ast.Call):
                          continue
                      func = decorator.func
                      if not isinstance(func, ast.Attribute) or func.attr not in HTTP_METHODS:
                          continue
                      if not decorator.args or not isinstance(decorator.args[0], ast.Constant):
                          continue
                      route_path = decorator.args[0].value
                      if isinstance(route_path, str):
                          routes.append({
                              "method": func.attr.upper(),
                              "path": prefix + route_path,
                              "handler": node.name,
                              "source": relative_file,
                          })
          return sorted(routes, key=lambda item: (item.get("path", ""), item.get("method", "")))


      def inspect_assets():
          return {
              "docs_images": len(list(SOURCE_DIR.joinpath("docs").glob("*.*"))),
              "sample_images": len(list(SOURCE_DIR.joinpath("test", "resources").glob("*.png"))),
              "bundled_songs": len(list(SOURCE_DIR.joinpath("resource", "songs").glob("*.mp3"))),
              "font_files": len(list(SOURCE_DIR.joinpath("resource", "fonts").glob("*"))),
          }


      IMPORT_STATUS = inspect_imports()
      PYPROJECT = read_pyproject()
      ROUTES = extract_routes()
      ASSETS = inspect_assets()


      def base_payload():
          return {
              "service": "moneyprinterturbo-verifier",
              "upstream": UPSTREAM,
              "source_ref": os.environ.get("MONEYPRINTERTURBO_REF", ""),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "python": sys.version.split()[0],
              "platform": platform.platform(),
          }


      def health_payload():
          ok = IMPORT_STATUS.get("ok", False) and PYPROJECT.get("name") == "moneyprinterturbo"
          payload = base_payload()
          payload.update({
              "ok": ok,
              "status": "ready" if ok else "unhealthy",
              "credentials_required": False,
              "llm_provider_calls": False,
              "model_downloaded": False,
              "browser_auth": False,
              "package": IMPORT_STATUS,
              "pyproject": PYPROJECT,
          })
          return ok, payload


      def demo_payload():
          payload = base_payload()
          payload.update({
              "ok": IMPORT_STATUS.get("ok", False),
              "description": "Deterministic MoneyPrinterTurbo source-package verifier.",
              "upstream_source": load_state(),
              "package": IMPORT_STATUS,
              "pyproject": PYPROJECT,
              "api_routes_discovered_from_source": ROUTES,
              "bundled_asset_counts": ASSETS,
              "sample_video_request": {
                  "video_subject": "Phala Cloud smoke test",
                  "video_aspect": "9:16",
                  "video_source": "local",
                  "subtitle_enabled": False,
                  "paragraph_number": 1,
                  "note": "This request shape is reported only; the verifier does not enqueue video generation.",
              },
              "runtime_guards": {
                  "credentials_required": False,
                  "llm_provider_calls": False,
                  "tts_provider_calls": False,
                  "material_provider_calls": False,
                  "model_downloaded": False,
                  "gpu_required": False,
                  "browser_auth": False,
              },
          })
          return payload


      def models_payload():
          return {
              "object": "list",
              "data": [
                  {
                      "id": "moneyprinterturbo/no-llm-source-verifier",
                      "object": "model",
                      "created": 0,
                      "owned_by": "harry0703",
                      "description": (
                          "Local deterministic verifier for the MoneyPrinterTurbo source package. "
                          "It does not host, load, or call an LLM model."
                      ),
                  }
              ],
              "package_version": IMPORT_STATUS.get("distribution_version"),
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "moneyprinterturbo-verifier"

          def log_message(self, fmt, *args):
              print(json.dumps({
                  "client": self.client_address[0],
                  "request": self.requestline,
                  "message": fmt % args,
              }), flush=True)

          def respond_json(self, status, payload):
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              path = urlparse(self.path).path.rstrip("/") or "/"

              if path in ("/", "/healthz"):
                  ok, payload = health_payload()
                  self.respond_json(HTTPStatus.OK if ok else HTTPStatus.SERVICE_UNAVAILABLE, payload)
                  return

              if path == "/demo":
                  self.respond_json(HTTPStatus.OK, demo_payload())
                  return

              if path == "/v1/models":
                  self.respond_json(HTTPStatus.OK, models_payload())
                  return

              self.respond_json(HTTPStatus.NOT_FOUND, {
                  "ok": False,
                  "error": "not_found",
                  "endpoints": ["/healthz", "/demo", "/v1/models"],
              })


      def main():
          port = int(os.environ.get("PORT", "8080"))
          print(json.dumps({
              "event": "startup",
              "port": port,
              "upstream": UPSTREAM,
              "import_ok": IMPORT_STATUS.get("ok", False),
          }), flush=True)
          ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()


      if __name__ == "__main__":
          main()

volumes:
  moneyprinterturbo-cache:
