services:
  app:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    environment:
      AGT_PACKAGE_VERSION: ${AGT_PACKAGE_VERSION:-3.7.0}
      APP_PORT: "8000"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_ROOT_USER_ACTION: ignore
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_SYSTEM_PYTHON: "1"
    configs:
      - source: agt_demo_app
        target: /opt/agt-demo/main.py
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        uv pip install --system --no-cache "agent-governance-toolkit[full]==$${AGT_PACKAGE_VERSION}"
        exec python /opt/agt-demo/main.py
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, sys, urllib.request; port = os.environ.get('APP_PORT', '8000'); response = urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=5); sys.exit(0 if response.status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - internal

  proxy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "8080:80"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

configs:
  caddy_config:
    content: |
      :80 {
          encode zstd gzip
          header {
              X-Content-Type-Options "nosniff"
              Referrer-Policy "no-referrer"
              -Server
          }
          reverse_proxy app:8000
      }

  agt_demo_app:
    content: |
      import importlib
      import importlib.metadata
      import json
      import os
      import platform
      import sys
      import time
      from http import HTTPStatus
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import urlparse


      SERVICE = "agent-governance-toolkit-demo"
      UPSTREAM = "https://github.com/microsoft/agent-governance-toolkit"
      DOCUMENTATION = "https://microsoft.github.io/agent-governance-toolkit/"
      PACKAGE_NAME = "agent-governance-toolkit"
      REQUESTED_VERSION = os.environ.get("AGT_PACKAGE_VERSION", "3.7.0")
      STARTED_AT = time.time()
      ENDPOINTS = ["/healthz", "/demo", "/v1/models", "/upstream"]

      POLICY_YAML = """
      apiVersion: governance.toolkit/v1
      name: phala-agt-template-demo
      default_action: allow
      rules:
        - name: block-destructive-actions
          condition: "action.type in ['delete_file', 'drop_table', 'shell_exec']"
          action: deny
          description: "Destructive actions are blocked by deterministic policy"
          priority: 100
        - name: require-review-for-email
          condition: "action.type == 'send_email'"
          action: require_approval
          approvers: ["security-team"]
          description: "Outbound email requires human approval in production"
          priority: 50
      """


      def import_checks():
          status = {
              "package": PACKAGE_NAME,
              "requested_version": REQUESTED_VERSION,
              "distribution_version": None,
              "modules": {},
              "symbols": {},
              "ok": False,
              "error": None,
          }
          try:
              status["distribution_version"] = importlib.metadata.version(PACKAGE_NAME)
              governance = importlib.import_module("agentmesh.governance")
              policies = importlib.import_module("agent_os.policies")
              cli = importlib.import_module("agent_compliance.cli.agt")
              status["modules"] = {
                  "agentmesh.governance": True,
                  "agent_os.policies": True,
                  "agent_compliance.cli.agt": True,
              }
              status["symbols"] = {
                  "govern": hasattr(governance, "govern"),
                  "GovernanceDenied": hasattr(governance, "GovernanceDenied"),
                  "AuditLog": hasattr(governance, "AuditLog"),
                  "PolicyEvaluator": hasattr(policies, "PolicyEvaluator"),
                  "agt_verify_command": hasattr(cli, "verify"),
              }
              status["ok"] = all(status["modules"].values()) and all(status["symbols"].values())
          except Exception as exc:
              status["error"] = f"{type(exc).__name__}: {exc}"
          return status


      IMPORT_STATUS = import_checks()


      def governed_tool(action: str, resource: str, payload: dict | None = None):
          return {
              "status": "executed",
              "action": action,
              "resource": resource,
              "payload": payload or {},
          }


      def compact_audit_entry(entry):
          data = getattr(entry, "data", {}) or {}
          return {
              "entry_id": getattr(entry, "entry_id", None),
              "event_type": getattr(entry, "event_type", None),
              "action": getattr(entry, "action", None),
              "outcome": getattr(entry, "outcome", None),
              "policy_decision": getattr(entry, "policy_decision", None),
              "rule": data.get("rule") or getattr(entry, "matched_rule", None),
              "reason": data.get("reason"),
              "entry_hash": getattr(entry, "entry_hash", None),
              "previous_hash": getattr(entry, "previous_hash", None),
          }


      def run_governance_demo():
          if not IMPORT_STATUS["ok"]:
              raise RuntimeError(IMPORT_STATUS["error"] or "AGT imports are unavailable")

          from agentmesh.governance import GovernanceDenied, govern

          safe_tool = govern(
              governed_tool,
              policy=POLICY_YAML,
              agent_id="did:phala:agt-demo",
              audit=True,
          )

          allowed = safe_tool(
              action="read_file",
              resource="policy.yaml",
              payload={"classification": "public"},
          )

          denied = None
          try:
              safe_tool(
                  action="delete_file",
                  resource="/workspace/customer-data.db",
                  payload={"classification": "restricted"},
              )
          except GovernanceDenied as exc:
              denied = {
                  "blocked": True,
                  "exception": type(exc).__name__,
                  "matched_rule": exc.decision.matched_rule,
                  "reason": exc.decision.reason,
              }

          audit_entries = []
          integrity_ok = None
          integrity_error = None
          if safe_tool.audit_log is not None:
              audit_entries = [compact_audit_entry(entry) for entry in safe_tool.audit_log.query()]
              integrity_ok, integrity_error = safe_tool.audit_log.verify_integrity()

          return {
              "policy": {
                  "name": "phala-agt-template-demo",
                  "default_action": "allow",
                  "rules": ["block-destructive-actions", "require-review-for-email"],
              },
              "allowed_call": allowed,
              "denied_call": denied,
              "audit": {
                  "entry_count": len(audit_entries),
                  "integrity_ok": integrity_ok,
                  "integrity_error": integrity_error,
                  "entries": audit_entries,
              },
          }


      def base_payload():
          return {
              "service": SERVICE,
              "upstream": UPSTREAM,
              "documentation": DOCUMENTATION,
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "uptime_seconds": round(time.time() - STARTED_AT, 3),
              "credentials_required": False,
              "llm_provider_calls": False,
              "model_downloaded": False,
              "model_loaded": False,
              "package": IMPORT_STATUS,
          }


      def response_body(path):
          if path == "/healthz":
              payload = base_payload()
              payload["status"] = "ok" if IMPORT_STATUS["ok"] else "unhealthy"
              return (
                  HTTPStatus.OK if IMPORT_STATUS["ok"] else HTTPStatus.SERVICE_UNAVAILABLE,
                  payload,
              )

          if path == "/demo":
              payload = base_payload()
              payload.update(
                  {
                      "ok": IMPORT_STATUS["ok"],
                      "check": "AGT govern() policy enforcement with audit hash-chain verification",
                  }
              )
              if not IMPORT_STATUS["ok"]:
                  return HTTPStatus.SERVICE_UNAVAILABLE, payload
              try:
                  payload["demo"] = run_governance_demo()
              except Exception as exc:
                  payload["ok"] = False
                  payload["error"] = f"{type(exc).__name__}: {exc}"
                  return HTTPStatus.INTERNAL_SERVER_ERROR, payload
              return HTTPStatus.OK, payload

          if path == "/v1/models":
              return HTTPStatus.OK, {
                  "object": "list",
                  "data": [
                      {
                          "id": "agent-governance-toolkit/local-policy-verifier",
                          "object": "model",
                          "created": 0,
                          "owned_by": "microsoft",
                          "description": (
                              "OpenAI-style metadata endpoint for the local deterministic "
                              "AGT verifier. No LLM is hosted or called."
                          ),
                      }
                  ],
                  "llm_provider_calls": False,
                  "model_loaded": False,
              }

          if path == "/upstream":
              return HTTPStatus.OK, {
                  "upstream": UPSTREAM,
                  "documentation": DOCUMENTATION,
                  "package_index": "https://pypi.org/project/agent-governance-toolkit/",
                  "icon_source": (
                      "https://github.com/microsoft/agent-governance-toolkit/blob/main/"
                      "docs/assets/agent-governance-toolkit.svg"
                  ),
                  "default_demo_package": f"agent-governance-toolkit[full]=={REQUESTED_VERSION}",
                  "runtime_shape": "CPU-safe deterministic HTTP verifier",
                  "endpoints": ENDPOINTS,
              }

          if path == "/":
              payload = base_payload()
              payload["endpoints"] = ENDPOINTS
              return HTTPStatus.OK, payload

          return HTTPStatus.NOT_FOUND, {
              "error": "not_found",
              "endpoints": ENDPOINTS,
          }


      class Handler(BaseHTTPRequestHandler):
          server_version = "agt-demo"

          def log_message(self, fmt, *args):
              print(
                  json.dumps(
                      {
                          "ts": time.time(),
                          "client": self.client_address[0],
                          "request": self.requestline,
                          "message": fmt % args,
                      }
                  ),
                  flush=True,
              )

          def do_GET(self):
              path = urlparse(self.path).path.rstrip("/") or "/"
              status, payload = response_body(path)
              body = json.dumps(payload, indent=2, sort_keys=True).encode("utf-8")
              self.send_response(status)
              self.send_header("Content-Type", "application/json; charset=utf-8")
              self.send_header("Cache-Control", "no-store")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)


      if __name__ == "__main__":
          port = int(os.environ.get("APP_PORT", "8000"))
          print(
              json.dumps(
                  {
                      "event": "startup",
                      "port": port,
                      "package": IMPORT_STATUS,
                      "llm_provider_calls": False,
                  }
              ),
              flush=True,
          )
          ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()

networks:
  internal:
    driver: bridge
