repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff-format
        args: [--check]
        files: ^python/
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^python/
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'cd go && files=$(gofmt -l .); [ -z "$files" ] || gofmt -l -w $files'
        language: system
        files: ^go/.*\.go$
        pass_filenames: false
      - id: govet
        name: go vet
        entry: bash -c 'cd go && go vet ./...'
        language: system
        files: ^go/.*\.go$
        pass_filenames: false
      - id: gotest
        name: go test
        entry: bash -c 'cd go && go test ./...'
        language: system
        files: ^go/.*\.go$
        pass_filenames: false
