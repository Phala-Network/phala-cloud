name: Terraform Provider Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (example: 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG_NAME: terraform-provider-phala/v${{ inputs.version }}
    defaults:
      run:
        working-directory: terraform-provider-phala
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: terraform-provider-phala/go.mod
          cache-dependency-path: terraform-provider-phala/go.sum

      - name: Run checks
        run: make ci VERSION="${VERSION}"

      - name: Package release artifacts
        run: make package-release VERSION="${VERSION}"

      - name: Create and push tag
        run: |
          git fetch --tags
          if git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag already exists: ${TAG_NAME}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG_NAME}" "${GITHUB_SHA}"
          git push origin "${TAG_NAME}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: terraform-provider-phala v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            terraform-provider-phala/dist/${{ inputs.version }}/*.zip
            terraform-provider-phala/dist/${{ inputs.version }}/*SHA256SUMS
