name: Terraform Provider Checks

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-provider-checks.yml"
  push:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-provider-checks.yml"

jobs:
  provider-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: terraform/go.mod
          cache-dependency-path: terraform/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run formatting check
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Build release binary
        run: make build-release VERSION=ci
